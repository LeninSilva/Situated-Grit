  "maslow-hierarchy": {
    term: "Maslow's hierarchy of needs", cat: "Motivation",
    short: "Abraham Maslow's 1943 theory of five sets of needs (physiological, safety, love, esteem, self-actualization) that become dominant in roughly that order when lower needs are unmet.",
    deep: `Duckworth's Chapter 12 corrects three misreadings. **There was no pyramid:** Maslow never drew one; the pyramid was popularized by management educators (Bridgman, Cummings & Ballard, 2019, trace it to Charles McDermid, 1960). **Not lockstep:** Maslow said lower needs take *priority* when deprived ("prepotency"), but normally we pursue several at once, partially satisfied. **Not the top:** late in life Maslow placed *self-transcendence* above self-actualization.

The policy point is that programs which meet only bottom-level needs "feed the body but starve the spirit."`,
    origin: `Maslow (1943), "A theory of human motivation," *Psychological Review*; Maslow (1969), "The farther reaches of human nature"; Koltko-Rivera (2006), *Review of General Psychology*.`,
    debate: `Cross-cultural data (Tay & Diener, 2011, 123 countries) found needs are universal and that well-being links to fulfilling each need fairly independently of order. Evolutionary psychologists proposed a "renovated pyramid" with parenting at the top (Kenrick et al., 2010). Scott Barry Kaufman's *Transcend* (2020) replaces the pyramid with a **sailboat**: security needs are the hull, growth needs are the sail. That is a lovely echo of the sailboat painting in *Situated*'s epilogue.`,
    find: ["hierarchy of needs"], where: [["situated", "ch12"]], related: ["self-actualization", "self-transcendence", "situational-responsibility"],
  },
  "self-actualization": {
    term: "Self-actualization", cat: "Motivation",
    short: "Maslow's term for \"the desire to become more and more what one is, to become everything that one is capable of becoming.\" \"A musician must make music.\"",
    deep: `Maslow studied people he judged self-actualizing (Lincoln, Eleanor Roosevelt, Einstein) and listed traits like autonomy, acceptance, creativity, and "peak experiences." The concept shaped humanistic psychology (with Carl Rogers) and later positive psychology.

Duckworth's twist, following Maslow's own late writing and Frankl, is that self-actualization pursued "directly, selfishly" fails. Self-actualizers "practically always have a mission in life."`,
    origin: `Kurt Goldstein coined the term (1934); Maslow (1943, 1954).`,
    debate: `Maslow's sample of exemplars was small and hand-picked, a form of selecting on the outcome. Kaufman (2018) developed a modern Characteristics of Self-Actualization Scale and found it predicts well-being and creativity.`,
    find: ["self-actualization"], where: [["situated", "ch12"]], related: ["maslow-hierarchy", "self-transcendence", "calling"],
  },
  "self-transcendence": {
    term: "Self-transcendence", cat: "Motivation", aka: ["beyond-the-self purpose"],
    short: "Commitment to something beyond one's own needs (a cause, a person, an ideal). Late Maslow and Viktor Frankl both put it at the summit of human motivation.",
    deep: `Frankl's logotherapy held that the "primary motivation" in human beings is the search for meaning, found by turning outward: "It is a constitutive characteristic of being human that it always points… to something other than itself." Maslow conceded in his late work that "self-actualization is not enough."

*Grit*'s chapter on purpose and *Situated*'s chapter on citizenship meet here. Bill Strickland says he served others "to be myself." Duckworth's redrawn pyramid places self-transcendence at the apex.`,
    origin: `Frankl, *Man's Search for Meaning* (1946/1959); Maslow (1969); Koltko-Rivera (2006).`,
    debate: `Research on "self-transcendent purpose for learning" (Yeager et al., 2014) found students who connected schoolwork to helping others persisted longer on boring tasks. Measurement of self-transcendence remains diffuse, ranging from spirituality scales to prosocial-purpose measures.`,
    find: ["self-transcendence"], where: [["situated", "ch12"], ["grit", "ch08", "purpose"]], related: ["self-actualization", "maslow-hierarchy", "calling"],
  },
  flywheel: {
    term: "Situation multiplication (the flywheel)", cat: "Core concept", aka: ["virtuous cycle", "cumulative advantage", "Matthew effect"],
    short: "Chapter 13's addition to the model: your response changes your next situation, so small situational improvements compound over time.",
    deep: `Draw an arrow from Box Three back to Box One. A slightly better situation produces slightly better thoughts and effort, which produce small wins, which attract better mentors and peers. In other words, a better situation. Cody Coleman's exponential curve and Amanda's math comeback are the book's examples.

The idea has strong scholarly cousins. Merton's **Matthew effect** (1968): "to every one who has will more be given." Stanovich's (1986) Matthew effects in reading. Dickens & Flynn's (2001) **multiplier model**: small initial advantages lead people into enriching environments that magnify them, which reconciles high heritability with large environmental gains such as the Flynn effect.`,
    origin: `Merton (1968), *Science*; Dickens & Flynn (2001), *Psychological Review*; DiPrete & Eirich (2006) review of cumulative advantage. "Flywheel" is Jim Collins's business metaphor (*Good to Great*, 2001), which Duckworth's chapter title, "From Grit to Great," nods to.`,
    debate: `The same mechanism runs in reverse as cumulative *disadvantage*. If situations multiply, early inequality multiplies too, which strengthens the case for Part 3's situational responsibility.`,
    find: ["flywheel"], where: [["situated", "ch13"], ["situated", "blueprint"]], related: ["three-boxes", "self-efficacy", "economic-mobility"],
  },
  "why-and-way": {
    term: "Why vs. way (mission vs. culture)", cat: "Management",
    short: "Duckworth's leadership distinction: an organization's why is its mission; its way is its culture, how things are actually done. Leaders must build both, and the way takes longer.",
    deep: `The test is whether the security guard explains the mission as faithfully as the CEO. The NASA janitor story ("I'm putting a man on the moon"), studied by Andrew Carton (2018), shows leaders can link everyday work to the ultimate aim by clarifying a few concrete objectives.

The idea parallels the gap between *espoused* and *enacted* values (Argyris & Schön), and Schein's warning that posters are artifacts, not culture.`,
    origin: `Carton (2018), *Administrative Science Quarterly*; Sinek's "Start with why" (2009) for the popular framing.`,
    find: ["The why of an organization"], where: [["situated", "ch11"]], related: ["culture", "situational-responsibility"],
  },
  "person-situation-debate": {
    term: "Person–situation debate", cat: "History of psychology",
    short: "A decades-long argument in psychology over whether behavior is better explained by stable personal traits or by the situation. It was largely resolved as \"both, interacting.\"",
    deep: `Walter Mischel's *Personality and Assessment* (1968) argued that trait measures rarely predicted behavior in a specific situation above a correlation of about .30 (the "personality coefficient"). Classic social-psychology experiments such as Milgram's obedience studies, Darley & Batson's Good Samaritan study, and Zimbardo's prison simulation seemed to show situations overwhelming character.

Trait psychologists replied that traits predict *aggregated* behavior well (Epstein, 1979) and that situational effects are not larger than trait effects (Funder & Ozer, 1983: classic situational effects correspond to correlations of about .30–.40). The settlement is **interactionism**: traits describe averages; situations drive variation; people select and shape their situations.

*Grit* sat on the person side, *Situated* moves toward the middle.`,
    origin: `Mischel (1968); Bowers (1973); Epstein (1979); Kenrick & Funder (1988), "Profiting from controversy"; Ross & Nisbett, *The Person and the Situation* (1991).`,
    debate: `Philosophers revived the debate as **situationism** versus virtue ethics (Harman, 1999; Doris, *Lack of Character*, 2002): if situations drive behavior, do robust virtues exist? Some of the famous situationist experiments have since been questioned. Zimbardo's prison study was coached by experimenters (Le Texier, 2019), and Milgram's results varied greatly across conditions (Perry, 2013).`,
    where: [["situated", "ch03"], ["situated", "ch04", "Barker forgotten"]], related: ["interactionism", "fundamental-attribution-error", "personality-range", "situation"],
  },
  interactionism: {
    term: "Interactionism: B = f(P, E)", cat: "History of psychology", aka: ["Lewin's equation", "person–environment transaction", "CAPS"],
    short: "Kurt Lewin's formula that behavior (B) is a function of the person (P) and the environment (E), together. It is the shared foundation of both books.",
    deep: `Lewin (1936) wrote B = f(P, E) to insist neither term can be dropped. Modern interactionism has several forms:

- **Statistical interaction**: the effect of a situation depends on the person (e.g., stress affects neurotic people more).
- **If…then signatures**: Mischel & Shoda's Cognitive-Affective Personality System (1995) treats personality as a stable pattern of situation-specific responses.
- **Transactions**: people *select*, *evoke*, and *modify* situations (Buss, 1987), and genes shape which environments we seek, through passive, evocative and active gene–environment correlation (Scarr & McCartney, 1983).

*Situated*'s "situational agency" is the third form made into advice: a person (P) shaping E, which then shapes B.`,
    origin: `Lewin, *Principles of Topological Psychology* (1936); Mischel & Shoda (1995), *Psychological Review*; Buss (1987), *JPSP*; Bandura's "reciprocal determinism" (1978).`,
    find: [], where: [["situated", "ch01"], ["situated", "ch03"]], related: ["person-situation-debate", "situational-agency", "personality-range"],
  },
  "replication-crisis": {
    term: "Replication crisis", cat: "Research methods", aka: ["reproducibility crisis", "credibility revolution"],
    short: "The discovery, starting around 2011, that many published findings in psychology and other fields don't hold up when repeated with larger samples and preregistered methods.",
    deep: `The Open Science Collaboration (2015) replicated 100 psychology studies; about 36–39% reproduced significant results, with effect sizes roughly half the originals. Causes include small samples, flexible analyses ("p-hacking"), selective publication, and incentives to publish surprising results.

Several findings near these books have been affected: ego depletion (Ch. 2 of *Situated*), power posing, some priming effects, and the marshmallow test's long-term predictions. Others have held up or been refined, such as defaults, implementation intentions, and the fundamental attribution error in its basic form.

Reforms include preregistration, registered reports, open data, multi-lab replications, and megastudies.`,
    origin: `Simmons, Nelson & Simonsohn (2011), "False-positive psychology"; Open Science Collaboration (2015), *Science*.`,
    find: [], where: [["situated", "ch02", "ego depletion"]], related: ["ego-depletion", "effect-size", "megastudy", "rct"],
  },
};

/* Glossary, part 2: the vocabulary of Grit, plus research-methods terms for reading the evidence. */
Object.assign(SG.glossary, {
  grit: {
    term: "Grit", cat: "Grit", aka: ["passion and perseverance for long-term goals"],
    short: "Duckworth's term for the combination of passion (consistent interest in a long-term goal) and perseverance (sustained effort despite setbacks).",
    deep: `In *Grit* (2016), grit has two components, measured by the Grit Scale. **Passion** in Duckworth's sense is not intensity but *consistency*: holding the same top-level goal for a long time. **Perseverance** is working hard and bouncing back. Gritty people have "not only determination, they had direction."

*Grit*'s headline findings: grit predicted who completed West Point's Beast Barracks better than the academy's own "Whole Candidate Score," who advanced at the National Spelling Bee, and who stayed in sales jobs and graduated from Chicago high schools. Grit was essentially uncorrelated with measured talent.

*Situated* keeps grit and reframes it: grit is "necessary but not sufficient," and situations shape how gritty anyone is in a given setting.`,
    origin: `Duckworth, Peterson, Matthews & Kelly (2007), *JPSP*; Duckworth & Quinn (2009), Short Grit Scale; earlier echoes in Galton's "zeal" and "capacity for hard labor" (1869) and William James's "The Energies of Men" (1907).`,
    debate: `**Overlap with conscientiousness:** Credé, Tynan & Harms's (2017) meta-analysis (88 samples, ~67,000 people) found grit correlates very highly with conscientiousness (ρ≈.84) and predicts performance only modestly (ρ≈.18 for academic performance). The perseverance facet did most of the work, and the claimed higher-order structure was not supported. **Heritability:** in a UK twin study, grit was moderately heritable and added little prediction of exam results beyond Big Five personality (Rimfeld et al., 2016). **Use in schools:** Duckworth herself warned against grading schools on grit (NYT, 2016) and against using self-report character scales for accountability (Duckworth & Yeager, 2015). **Structural critique:** education writers argued "grit" can shift attention from inequality to children's character (e.g., Kohn, 2014; Ris, 2015). *Situated* can be read partly as a response to that last critique.`,
    find: ["grit"], where: [["grit", "ch01", "defined and measured"], ["grit", "ch04", "Grit Scale"], ["situated", "ch01", "Beyond Grit"], ["situated", "ch13"]],

  "grit-scale": {
    term: "Grit Scale", cat: "Grit", aka: ["Grit-O", "Grit-S", "Short Grit Scale"],
    short: "A brief self-report questionnaire measuring passion (consistency of interests) and perseverance (of effort). Scores run from 1 (not at all gritty) to 5 (extremely gritty).",
    deep: `The original Grit Scale (Grit-O) had 12 items; the Short Grit Scale (Grit-S) has 8. The book's 10-item version mixes perseverance items ("I finish whatever I begin") with reverse-scored passion items ("My interests change from year to year"). Duckworth wrote items "sometimes verbatim" from interviews with high achievers.

Self-report has known limits: social desirability, and **reference bias**. People judge themselves against local standards, so students at demanding schools can rate themselves *less* conscientious than students at lax schools (West et al., 2016). That is a situational artifact Duckworth has written about.`,
    origin: `Duckworth et al. (2007); Duckworth & Quinn (2009), *Journal of Personality Assessment*.`,
    debate: `Psychometric reviews find good internal reliability but question the two-facet structure. The consistency-of-interests facet is weaker and behaves differently across cultures, being less predictive in collectivist samples (Datu, Valdez & King, 2016). Disabato, Goodman & Kashdan (2019) argue perseverance is the active ingredient.`,
    find: ["Grit Scale"], where: [["grit", "ch01"], ["grit", "ch04", "take the scale"]], related: ["grit", "reference-bias", "conscientiousness"],
  },
  "passion-consistency": {
    term: "Passion (as consistency of interest)", cat: "Grit", aka: ["consistency of interests"],
    short: "In Grit, passion means steadiness: caring about the same ultimate goal over years. It is not fiery emotion.",
    deep: `Duckworth's redefinition is easy to miss: "passion" is a *compass*, not a fireworks display. The Grit Scale's passion items ask whether your interests shift, whether new ideas distract you from old ones, and whether you lose interest in projects. The goal-hierarchy diagram makes it concrete: a stable top-level goal organizing many changeable lower-level goals.`,
    origin: `Duckworth et al. (2007); *Grit*, Ch. 4.`,
    debate: `Psychologists of passion (Vallerand's dualistic model) distinguish *harmonious* from *obsessive* passion; obsessive passion predicts burnout and conflict. Jachimowicz et al. (2018, *PNAS*) argued Grit's consistency facet misses "passion attainment," the felt sense of loving the work, which predicted performance when combined with perseverance.`,

    deep: `Grit Scale perseverance items include "Setbacks don't discourage me" and "I am diligent." In the large meta-analyses (Credé et al., 2017), perseverance correlated with performance more strongly than consistency of interests did, and it is closest to the "industriousness" aspect of conscientiousness.`,

  conscientiousness: {
    term: "Conscientiousness", cat: "Personality psychology", aka: ["Big Five", "industriousness", "orderliness"],
    short: "One of the Big Five personality traits: being organized, dependable, hardworking, and self-disciplined. It is the strongest personality predictor of job and school performance.",
    deep: `The Big Five (openness, conscientiousness, extraversion, agreeableness, neuroticism) emerged from factor analyses of personality language. Conscientiousness predicts grades, job performance, health behaviors, and longevity (Roberts et al., 2007; Bogg & Roberts, 2004). It has two aspects: industriousness (closest to grit's perseverance) and orderliness.

*Grit* (Ch. 1) reports that grit predicted sales retention and high-school graduation better than conscientiousness. Later meta-analyses complicate that.`,
    origin: `Goldberg (1990); Costa & McCrae's NEO inventories; DeYoung, Quilty & Peterson (2007) on aspects.`,
    debate: `The **jangle fallacy** (Kelley, 1927) is giving a new name to an old construct. Credé et al. (2017) argued grit may be largely a jangle of conscientiousness. Duckworth's response is that grit emphasizes *long-term* stamina toward one goal, a narrower and more specific predictor. Conscientiousness also rises through adulthood (the **maturity principle**; Roberts, Walton & Viechtbauer, 2006), consistent with *Grit*'s Ch. 5 age data.`,

  "maturity-principle": {
    term: "Maturity principle", cat: "Personality psychology",
    short: "The finding that, on average, people become more conscientious, agreeable, and emotionally stable as they age, especially between 20 and 40.",
    deep: `Roberts, Walton & Viechtbauer's (2006) meta-analysis of 92 longitudinal samples found mean-level increases in conscientiousness and emotional stability across adulthood. Proposed causes include social roles (work, partnership, parenting) that reward reliability, which is a situational account of personality change.

*Grit*'s Ch. 5 shows older adults scoring higher on the Grit Scale, and offers both a cohort explanation and this maturation explanation. Duckworth favors maturation driven by life lessons and roles.`,
    origin: `Roberts, Walton & Viechtbauer (2006), *Psychological Bulletin*; Social Investment Theory (Roberts, Wood & Smith, 2005).`,
    debate: `Cross-sectional data like *Grit*'s age graph can't separate aging from generational (cohort) differences. Longitudinal studies are needed, and they generally support maturation.`,

  },
  talent: {
    term: "Talent", cat: "Grit",
    short: "In Grit, the rate at which your skill improves when you invest effort: how fast you climb the learning curve. It is real, but over-weighted.",
    deep: `Duckworth's narrow definition lets her separate talent cleanly from achievement. Talent × effort = skill; skill × effort = achievement. Her complaint is not that talent doesn't exist but that we are "distracted" by it, so effort, practice, and situations go unnoticed.`,
    origin: `*Grit*, Ch. 3. Compare Galton (1869) on innate "ability"; Chambliss (1989) on talent as a lay explanation that "mystifies" excellence.`,
    debate: `Behavior-genetic research finds most abilities substantially heritable, and deliberate-practice research leaves a lot of variance unexplained by practice (Macnamara et al., 2014). Duckworth's two equations are a conceptual sketch, not a fitted model. Talent may also affect *how much* effort people invest, since early success breeds motivation.`,

  "naturalness-bias": {
    term: "Naturalness bias", cat: "Social psychology", aka: ["naturals vs. strivers"],
    short: "Chia-Jung Tsay's finding that people say effort matters most but, in practice, judge a \"natural\" more favorably than an equally accomplished \"striver.\"",
    deep: `In Tsay & Banaji (2011), professional musicians heard the same pianist but rated the one described as a natural as more likely to succeed. In entrepreneurship studies, a striver needed about four more years of leadership experience and $40,000 more capital to be judged equal to a natural (Tsay, 2016). It is a *revealed* preference that contradicts the *stated* one.`,
    origin: `Tsay & Banaji (2011), *JESP*; Tsay (2016), *PSPB*.`,

  "effort-counts-twice": {
    term: "Effort counts twice", cat: "Grit",
    short: "Duckworth's model in two equations: talent × effort = skill, and skill × effort = achievement. Effort builds skill and also makes skill productive.",
    deep: `The point of writing it as two multiplications is that effort appears in both. Someone "twice as talented but half as hardworking" might reach the same skill level but will produce "dramatically less over time," because achievement requires using skill. Woody Allen's "80 percent of success is showing up" and Will Smith's treadmill appear as illustrations.`,
    origin: `*Grit*, Ch. 3.`,
    debate: `Treat it as a theory sketch. Real relationships are not neatly multiplicative, and talent and effort are not independent: people invest more where they get faster returns. It is a useful corrective to talent-worship, and it later meets *Situated*'s point that situations shape effort itself.`,
    find: ["effort counts twice"], where: [["grit", "ch03"]], related: ["talent", "deliberate-practice", "grit"],

  "whole-candidate-score": {
    term: "Whole Candidate Score", cat: "Grit",
    short: "West Point's weighted admissions index (test scores, class rank, leadership potential, fitness). It predicted almost everything about cadets except who quit during Beast Barracks.",
    deep: `Duckworth's first West Point study (2004, n=1,218) found grit was unrelated to the Whole Candidate Score and predicted completion of Beast; the Score didn't. Among cadets who stayed, the Score predicted grades, military ratings, and fitness. Talent predicts performance; grit predicts *staying*.

A 2019 *PNAS* paper (Duckworth et al., "Cognitive and noncognitive predictors of success") followed over 11,000 cadets and found grit predicted graduation, while cognitive ability better predicted academic grades. *Situated* (Ch. 1) adds that completion rates rose over decades as West Point shifted from an "attrition model" to a "developmental model." The culture changed, not the cadets.`,
    origin: `Duckworth et al. (2007); Duckworth et al. (2019), *PNAS*.`,

  heritability: {
    term: "Heritability", cat: "Behavioral genetics",
    short: "The proportion of variation in a trait within a population that is statistically associated with genetic differences. It says nothing about how changeable the trait is or about individuals.",
    deep: `*Grit*'s Ch. 5 makes three key points. Traits are influenced by both genes and experience. Most traits are polygenic, shaped by many genes of tiny effect. And heritability describes *variance* around a mean, not the mean itself: height is highly heritable, yet average height rose dramatically over a century because of nutrition.

Twin studies estimate heritability by comparing identical and fraternal twins; grit's estimates are about 20–40%, depending on the facet (Rimfeld et al., 2016).`,
    origin: `Galton (twin method, 1875); Falconer's formula; Polderman et al. (2015) meta-analysis of 50 years of twin studies (average heritability ~49% across traits).`,
    debate: `Heritability is population- and environment-specific. In more equal environments, more of the remaining variance is genetic, so high heritability can be a sign of *fair* opportunity. Gene–environment correlation (people with certain genes seek certain situations) blurs the line between nature and situation, which links straight to *Situated*'s flywheel.`,
    find: ["heritability"], where: [["grit", "ch05"]], related: ["flynn-effect", "talent", "flywheel"],
  },
  "flynn-effect": {
    term: "Flynn effect", cat: "Behavioral genetics",
    short: "The large rise in average IQ test scores across the 20th century, roughly three points per decade, far too fast to be genetic.",
    deep: `James Flynn documented the rise across dozens of countries. Gains were largest on abstract-reasoning tests (Raven's matrices), suggesting modern environments trained new habits of mind: schooling, scientific thinking, complex work. Dickens & Flynn (2001) proposed a **social multiplier**: small advantages draw people into richer environments, which amplify the advantage. It is the theoretical ancestor of *Situated*'s flywheel.

*Grit* (Ch. 5) uses it to show that highly heritable traits can still shift a lot with the environment.`,
    origin: `Flynn (1984, 1987); Dickens & Flynn (2001), *Psychological Review*.`,
    debate: `Several countries show a recent reversal ("negative Flynn effect"), with environmental rather than genetic causes (Bratsberg & Rogeberg, 2018).`,
    find: ["Flynn effect"], where: [["grit", "ch05"]], related: ["heritability", "flywheel"],
  },
  "goal-hierarchy": {
    term: "Goal hierarchy", cat: "Motivation",
    short: "Goals arranged from concrete low-level tasks up to a single abstract top-level goal (an \"ultimate concern\") that gives the lower goals their purpose.",
    deep: `*Grit* (Ch. 4) uses the hierarchy to clarify what grit is *not*: stubbornly pursuing every low-level goal. Low-level goals are means and should be swapped when they fail. Bob Mankoff submitted his *New Yorker* cartoons in batches of ten because "nine out of ten things never work out." Gritty people have a well-aligned hierarchy, with most mid-level goals serving the top one.

Warren Buffett's "two-list" prioritizing exercise, with Duckworth's added step ("To what extent do these goals serve a common purpose?"), is the practical tool.`,
    origin: `Control theory of self-regulation (Carver & Scheier, 1981, 1998); goal-systems theory (Kruglanski et al., 2002); Pete Carroll's "life philosophy."`,
    debate: `The Buffett "avoid at all costs" story is widely told but likely apocryphal. Goal-systems research shows that a goal served by many means is pursued more flexibly, and that one means serving many goals ("multifinality") is attractive.`,
    find: ["top-level goal"], where: [["grit", "ch04"]], related: ["ultimate-concern", "passion-consistency", "purpose"],
  },
  "ultimate-concern": {
    term: "Ultimate concern", cat: "Grit",
    short: "The top of the goal hierarchy: the abstract, enduring aim that organizes everything else. Duckworth borrows the phrase from theologian Paul Tillich.",
    deep: `For Tillich, faith is the state of being ultimately concerned. Duckworth uses the phrase secularly for the one thing your efforts serve. Hers: "Use psychological science to help kids thrive." The test of grit is the stability of the ultimate concern, not of the projects beneath it.`,
    origin: `Tillich, *Dynamics of Faith* (1957); *Grit*, Ch. 4.`,
    find: ["ultimate concern"], where: [["grit", "ch04"]], related: ["goal-hierarchy", "purpose"],
  },
  interest: {
    term: "Interest (development of)", cat: "Motivation", aka: ["triggered vs. maintained interest", "four-phase model"],
    short: "In Grit, the first source of passion. Interests are rarely discovered by introspection; they are triggered by experience, deepened by knowledge, and kept alive by others' encouragement.",
    deep: `Duckworth's correction of "follow your passion" is that most passions *develop*. Following Benjamin Bloom's study of world-class performers (*Developing Talent in Young People*, 1985), early years are playful and low-pressure ("romance"), middle years bring rigor and a demanding teacher, and later years bring purpose. Interest needs triggering, then re-triggering, and a crowd of encouraging supporters.

Hidi & Renninger's four-phase model (triggered situational interest → maintained situational interest → emerging individual interest → well-developed individual interest) is the scholarly backbone. Experts keep interest alive through **novelty in nuance**: finding fresh questions inside a familiar field (Paul Silvia).`,
    origin: `Bloom (1985); Hidi & Renninger (2006), *Educational Psychologist*; Silvia, *Exploring the Psychology of Interest* (2006).`,
    debate: `"Fixed" vs. "growth" theories of interest: people who believe passions are found rather than developed abandon new interests sooner when difficulty arises (O'Keefe, Dweck & Walton, 2018). Note how *situational* the early phases are: interest is "triggered" by environments, which bridges to *Situated*.`,
    find: ["interest"], where: [["grit", "ch06"]], related: ["passion-consistency", "deliberate-practice", "purpose"],
  },
  flow: {
    term: "Flow", cat: "Motivation", aka: ["optimal experience"],
    short: "Mihaly Csikszentmihalyi's term for total absorption in an activity, where challenge matches skill, attention narrows, self-consciousness fades, and time distorts.",
    deep: `Flow arises when a challenging task meets high skill and offers clear goals and immediate feedback. *Grit* (Ch. 7) stages a debate between Csikszentmihalyi (experts love what they do) and Ericsson (deliberate practice is not inherently enjoyable). Duckworth's resolution: deliberate practice is for *preparation* and is effortful; flow is for *performance* and is effortless. Gritty people do more of both.`,
    origin: `Csikszentmihalyi, *Beyond Boredom and Anxiety* (1975); *Flow* (1990).`,
    debate: `Flow research relies heavily on self-report (the Experience Sampling Method, which Csikszentmihalyi pioneered). Some studies find flow during practice too, which blurs Duckworth's clean split.`,
    find: ["flow"], where: [["grit", "ch07"]], related: ["deliberate-practice", "experience-sampling"],

  purpose: {
    term: "Purpose", cat: "Motivation", aka: ["beyond-the-self purpose", "prosocial motivation"],
    short: "In Grit, the intention to contribute to the well-being of others. It is the third psychological asset of grit, and it deepens passion as people mature.",
    deep: `Grit paragons usually describe their work as connected to other people. Duckworth's survey of 16,000 adults found grittier people scored higher on purpose (an "eudaimonic" orientation), with no tradeoff against pleasure-seeking.

William Damon defines purpose as a stable, generalized intention to accomplish something meaningful to the self *and* consequential for the world beyond the self. Purpose can be cultivated by reflecting on how current work helps others, by finding a purposeful role model, and by "job crafting" small changes that make work more meaningful (Wrzesniewski).`,
    origin: `Damon, *The Path to Purpose* (2008); Grant (2008) on prosocial motivation; Yeager et al. (2014) on self-transcendent purpose for learning.`,
    debate: `Adam Grant's call-center studies found that a brief meeting with a beneficiary sharply raised fundraising (Grant et al., 2007), a dramatic but small-sample result. Prosocial motivation helps most when combined with intrinsic interest (Grant, 2008, firefighters and fundraisers).`,
    find: ["purpose"], where: [["grit", "ch08"], ["situated", "ch12", "self-transcendence"]], related: ["calling", "self-transcendence", "ultimate-concern"],
  },
  calling: {
    term: "Job, career, calling", cat: "Organizational psychology", aka: ["work orientation"],
    short: "Amy Wrzesniewski's three orientations to work: a job (a paycheck), a career (advancement), or a calling (meaningful in itself and to others). It is like the three bricklayers.",
    deep: `In Wrzesniewski et al. (1997), people in the same occupation, administrative assistants for example, split roughly into thirds across the three orientations. Callings predicted greater satisfaction and fewer missed days. Crucially, orientation depends more on the person's construal than on the job title, so it can change ("job crafting"; Wrzesniewski & Dutton, 2001).`,
    origin: `Bellah et al., *Habits of the Heart* (1985); Wrzesniewski, McCauley, Rozin & Schwartz (1997), *Journal of Research in Personality*.`,
    debate: `Callings have a dark side: zookeepers with strong callings accepted lower pay and more sacrifice (Bunderson & Thompson, 2009). That is a caution for organizations that exploit meaning.`,

  "job-crafting": {

    short: "Employees reshaping the tasks, relationships, and meaning of their job to make it more engaging and purposeful, without changing their formal role.",
    deep: `Hospital cleaners who saw themselves as part of patient care, chatting with patients and timing their cleaning around visits, are the canonical example. Job crafting is a person-level way to shift one's own work situation, a small form of situational agency.`,

  "learned-helplessness": {
    term: "Learned helplessness", cat: "Motivation",
    short: "Passivity after repeated uncontrollable bad events. Seligman and Maier first thought it was learned; Maier's later neuroscience showed passivity is the default, and what gets learned is control.",
    deep: `In the 1967 triadic design, dogs given escapable shock, or no shock, later learned to escape. Dogs given the identical but *inescapable* shock (yoked) mostly stopped trying. The phenomenon became a model of depression.

Fifty years later, Maier & Seligman (2016) reversed the mechanism. Prolonged aversive events trigger passivity by default (via the dorsal raphe nucleus). Detecting *control* engages the prefrontal cortex, which inhibits that response, and this "immunizes" against later helplessness. In *Grit* (Ch. 9) this supports the "rising to the occasion" argument: adversity you can master builds hope.`,
    origin: `Overmier & Seligman (1967); Seligman & Maier (1967), *JEP*; Maier & Seligman (2016), *Psychological Review*.`,
    debate: `Ethical criticism of the original animal research persists. The human literature moved toward attributional explanations (explanatory style).`,
    find: ["learned helplessness"], where: [["grit", "ch09"]], related: ["explanatory-style", "growth-mindset", "learned-industriousness"],
  },
  "explanatory-style": {
    term: "Explanatory style (learned optimism)", cat: "Motivation", aka: ["attributional style", "optimism"],
    short: "How you habitually explain bad events. Pessimists see causes as permanent and pervasive; optimists see them as temporary and specific.",
    deep: `The reformulated helplessness theory (Abramson, Seligman & Teasdale, 1978) said helplessness depends on the explanations people make. Seligman's Attributional Style Questionnaire measures this. At MetLife, optimistic insurance agents sold more and quit less (Seligman & Schulman, 1986). Duckworth's study of Teach For America teachers found optimistic explanatory style predicted effectiveness.

Cognitive therapy teaches people to dispute pessimistic explanations: a Box Two strategy.`,
    origin: `Abramson, Seligman & Teasdale (1978); Seligman, *Learned Optimism* (1991); Peterson & Seligman (1984).`,
    debate: `Optimism interventions (e.g., the Penn Resiliency Program) show small, sometimes short-lived effects in large trials (Brunwasser, Gillham & Kim, 2009).`,
    find: ["learned optimism"], where: [["grit", "ch09"]], related: ["learned-helplessness", "growth-mindset", "cognitive-therapy"],
  },
  "learned-industriousness": {

    short: "Robert Eisenberger's finding that rewarding effort (not just success) teaches animals and people to associate hard work with reward, making later effort feel less aversive.",
    deep: `Rats rewarded for pressing a lever many times, rather than once, later persisted longer at other tasks. Children rewarded for effortful performance persevered more later. *Grit* (Ch. 11) uses it to argue for structured extracurriculars where effort pays off, and for the family **Hard Thing Rule**.

In *Situated*'s terms, it is the "make it rewarding" principle applied to effort itself: a situation that reliably pays off hard work teaches you to work hard.`,
    origin: `Eisenberger (1992), "Learned industriousness," *Psychological Review*.`,

  "hard-thing-rule": {

    short: "The Duckworth family rule: everyone does a hard thing that requires daily deliberate practice, you can quit only at a natural stopping point, and you pick your own hard thing.",
    deep: `The fourth clause, added for her daughters in high school, requires sticking with one hard thing for at least two years. The rule combines challenge (hard, daily practice) with support and autonomy (you choose it, you can switch at natural endpoints), which is the sweet-spot grid in household form.`,

  "extracurricular-follow-through": {
    term: "Follow-through (extracurriculars)", cat: "Grit",
    short: "Sustained, multi-year commitment and advancement in an activity. In Willingham's Personal Qualities Project it predicted college accomplishment better than test scores.",
    deep: `Warren Willingham's Personal Qualities Project (ETS, 1978–) followed thousands of students and found that "follow-through," meaning purposeful, continuous commitment to activities in high school, predicted college leadership and accomplishment. Duckworth replicated the idea with the **Grit Grid** and found follow-through predicted college graduation and, later, teacher effectiveness.`,

  "authoritative-parenting": {
    term: "Authoritative (\"wise\") parenting", cat: "Developmental psychology", aka: ["demanding and supportive parenting", "wise parenting"],
    short: "Parenting that is both warm and demanding. Diana Baumrind's authoritative style, which Grit calls \"wise parenting,\" predicts better outcomes than authoritarian, permissive, or neglectful styles.",
    deep: `Baumrind's typology (1966) was formalized by Maccoby & Martin (1983) as two dimensions, demandingness and responsiveness, giving four styles. Authoritative parents set high standards *and* explain, listen, and support autonomy. *Grit* (Ch. 10) illustrates it with Steve Young's and Francesca Martinez's parents and argues grit grows best in this combination.

It is the parental ancestor of *Situated*'s challenge × support "sweet spot."`,
    origin: `Baumrind (1966, 1971); Maccoby & Martin (1983); Lamborn et al. (1991); Steinberg's adolescent research.`,
    debate: `Cultural context matters. Ruth Chao (1994) argued Chinese-American "training" (*guan*) parenting looks authoritarian on Western measures but carries warmth and different meanings. Darling & Steinberg (1993) separated parenting *style* from *practices*. Much of the evidence is correlational, and children's temperaments also shape parenting (evocative effects).`,

  "situational-parenting": {
    term: "Situational parenting", cat: "Core concept",
    short: "Duckworth's term in Situated for raising children by shaping their situations (home, school, neighborhood, activities) rather than by exhortation.",
    deep: `When children are young: set up their space (books in, screens out) and model the behavior you want ("children see, children do"). As they grow: choose schools and neighborhoods where peers and mentors will be good influences, and support structured activities where effort pays off (Debbie Phelps's minivan).

Mister Rogers's reframe captures it: "Why can't my boy concentrate?" becomes "Where can my boy concentrate?"`,
    origin: `*Situated*, Ch. 10; Bronfenbrenner's ecological systems theory; Steinberg on adolescent peers.`,
    debate: `"Buy the smallest house in the best district" is advice that only some families can follow and that can't work for everyone simultaneously. Readers might ask what *policy* version of situational parenting Duckworth would endorse (Ch. 12 gestures at this).`,

      body: `**Who is writing.** Angela Duckworth is the Rosa Lee and Egbert Chang Professor at the University of Pennsylvania, with appointments in psychology and at the Wharton School. Her path explains a lot about her books. She studied neurobiology at Harvard and neuroscience at Oxford, worked at McKinsey, taught middle- and high-school math in New York and San Francisco, and earned a PhD in psychology at Penn under Martin Seligman, a founder of positive psychology. She won a MacArthur Fellowship in 2013, cofounded the nonprofit Character Lab, cofounded the Behavior Change for Good initiative with Katy Milkman, and cohosts the *No Stupid Questions* podcast with Stephen Dubner. Teacher, consultant, scientist and storyteller all show up on the page.

**What kind of books these are.** Both are *trade science* books: written for the public by a working scientist, built from stories plus studies. That genre has conventions you should read *through*:

- **Stories carry the argument; studies anchor it.** A champion's story (Michael Phelps, Taylor Swift) makes an idea vivid. The endnotes tell you which claims rest on randomized experiments, which on correlations, and which on interviews. This companion's **Sources** tab sorts that out chapter by chapter.
- **The author's own research is central.** Duckworth cites many of her own studies, including several marked "manuscript in preparation." Those had not been peer-reviewed when the book went to press. Treat them as promising rather than settled.
- **Simplification is a feature, not a bug.** The Three Boxes model and the "four elements" are deliberately simple. Judge them by whether they help you act, and separately by whether they are true. Those are different tests.

**What "charitable reading" means here.** The *principle of charity* asks you to reconstruct an argument in its strongest form before you criticize it. Every chapter guide includes an **"In the author's voice"** section that does exactly that: a paraphrase in Duckworth's first person, clearly labeled. The verbatim text is always one tab away in **Read**. After you have the strongest version, the **"The debate"** section gives you the best objections and the current state of the research.

**How the two books relate.** *Grit* (2016) is mostly about what is inside successful people: passion and perseverance, interest, practice, purpose, hope. Its last third, "Growing Grit from the Outside In," is about parents, coaches, and cultures. *Situated* (2026) takes that last third and makes it the whole book, with a new theory (Three Boxes), new evidence, and a new stance (situational agency). Reading *Situated* first and then *Grit* works well: you will see *Grit*'s situational seeds everywhere. Reading in publication order shows you a scientist changing her mind in public, which is its own lesson.`,

      body: `### Grit, in five claims
1. Achievement depends on talent, but we are "distracted by talent" and underrate effort.
2. Effort counts twice: talent × effort = skill; skill × effort = achievement.
3. Grit, meaning **passion** (consistency of interest in a top-level goal) plus **perseverance** (sustained effort through setbacks), predicts who keeps going in hard situations, independent of measured talent.
4. Grit grows. From the inside it grows through **interest, deliberate practice, purpose, and hope**. From the outside it grows through wise parenting, extracurricular follow-through, and cultures of grit.
5. You can cultivate grit in yourself and in others.

### Situated, in seven claims
1. **Situations are powerful and invisible.** Behavior depends on where you are and who you're with at least as much as on who you are. We overlook this (the [[fundamental-attribution-error]]).
2. **The Three Boxes.** Situation → thoughts → response. Willpower acts at the last box and is the weakest strategy. Changing the situation acts at the first box and is the strongest.
3. **Personality has range.** We each contain multiple selves, and situations select which one shows up. Seek the [[sweet-spot]]: high challenge plus high support.
4. **We moralize willpower.** Changing your situation feels like cheating, but it is honest, effective and even heroic.
5. **Situational agency.** You can set up your **space**, pick your **peers**, attract **mentors**, and choose your **culture**, in that order from near to far.
6. **Situational responsibility.** As parents, leaders and citizens, we help others most by improving their situations rather than urging them to try harder. That also shows them respect.
7. **Situations multiply.** Responses change future situations, so small situational advantages compound like a flywheel.

### The bridge sentence
"Grit is necessary but not sufficient." *Situated* doesn't retract *Grit*. It adds the missing variable, and in doing so lands near the oldest equation in social psychology, Kurt Lewin's B = f(P, E): behavior is a function of the person *and* the environment.`,

### Tier 1: Randomized and natural experiments
The strongest causal evidence. Examples: the situation-change vs. willpower intervention (Ch. 2), temptation bundling at the gym (Ch. 6), the voting social-pressure study (Ch. 7), the LinkedIn weak-ties experiment (Ch. 8), the coin-flip study and Hurricane Katrina (Ch. 9), randomly assigned roommates and military postings (Chs. 9–10), the megastudies. Even here ask: how big is the effect (absolute or relative)? How long did it last? Who was studied?

Clean causal tests but artificial settings: the quiz-bowl study, forgetting intentions after five seconds, ego depletion. Ask whether the finding has replicated and whether it generalizes beyond the lab.

### Tier 4: Interviews, case studies, stories
Phelps, Marchand, Swift, Seinfeld, Cleveland Clinic, Wegmans, Cody Coleman, Duckworth's own marriage. These illustrate mechanisms and make ideas memorable. They can't establish them, because of [[survivorship-bias]]: we don't hear from the swimmers who trained with great coaches and didn't win.

### The replication crisis, briefly
Since about 2011 psychology has discovered that many published effects shrink or vanish in larger, preregistered replications ([[replication-crisis]]). Findings near these books that have been challenged: [[ego-depletion]] (which *Situated* treats as a dead end, to its credit), the long-run predictive power of the marshmallow test, the size of the [[pygmalion-effect]], average [[nudge]] effects (much smaller in government trials than in journals), and [[growth-mindset]] intervention effects (small and context-dependent). Findings that have held up well: defaults, implementation intentions, the basic attribution error, the importance of practice (if smaller than once claimed), peer effects in randomized roommate designs, and neighborhood effects on mobility.

### 1. "Grit is just conscientiousness"
The **jangle fallacy** is giving an old construct a new name. Credé, Tynan & Harms's 2017 meta-analysis (about 67,000 people) found grit correlates about .84 with conscientiousness and predicts academic performance only modestly (around .18). Perseverance carried most of the predictive weight; the "passion/consistency" facet added little. A UK twin study (Rimfeld et al., 2016) found grit added little beyond the Big Five in predicting exam results. Duckworth's reply: grit was never meant to replace conscientiousness. It emphasizes stamina toward one long-term goal, and in some settings (West Point completion) it predicts where other measures don't.

### 2. "Measuring and grading grit is a mistake"
Self-report character scales are vulnerable to faking and [[reference-bias]]. Duckworth largely agreed and argued publicly against using grit scores to evaluate schools (Duckworth & Yeager, 2015; "Don't Grade Schools on Grit," *New York Times*, 2016).

### 3. "Grit blames kids for structural problems"
The sharpest critique came from education scholars and journalists. Telling poor children to be grittier, they argued, puts the burden of inequality on the children and celebrates enduring bad conditions rather than changing them (Alfie Kohn; Ethan Ris's history of "grit" as a concept; Paul Gorski on "grit ideology" and deficit thinking). Paul Tough's *Helping Children Succeed* (2016) made a related turn: noncognitive skills are better understood as products of children's environments than as lessons to be taught.

### How Situated responds
Read *Situated* as taking the third critique seriously while keeping the first two in view:
- It says grit is **necessary but not sufficient**. Situations matter "to an astonishing degree."
- Its central image is the ocean current: "a force that can't be overpowered through sheer determination alone."
- Part 3 makes improving *other people's* situations a responsibility of parents, leaders and citizens, and calls helping indirectly more respectful.
- Chapter 12 attacks poverty programs that "feed the body but starve the spirit."

### What a critic might still say
- **Agency is unequally distributed.** "Choose your culture" and "buy the smallest house in the best district" assume options many people lack. Duckworth concedes this ("some of us have much more freedom… than others") and points to immigrants and Strickland. Is that enough?
- **The individual is still the unit of action.** Part 2 asks *you* to change your situation. A structural critic would ask for more about policy, institutions, and collective action, and less about personal strategy.
- **Influence ethics.** Shaping others' situations ("situational responsibility") raises the same consent and paternalism questions as nudging. Hertwig's distinction between *nudges* (change the environment) and *boosts* (build people's competence to change their own environment) is a useful lens. Duckworth's "nudge thyself" sits interestingly between them.
- **Evidence quality.** Some new findings are unpublished, and the most dramatic stories are survivors.

The best book-club discussions hold both books up together: what did Duckworth change her mind about, and what did she keep?`,

  origins: `**Grit research.** The West Point findings come from Duckworth et al. (2007) and the much larger PNAS follow-up (Duckworth et al., 2019), which tracked over 11,000 cadets. Grit predicted completing Beast Barracks and graduating; cognitive ability predicted grades.

**The four thoughts** ("interesting, important, I can do this, I know what to try next") condense *Grit*'s four psychological assets: interest, purpose, hope, and the know-how built by deliberate practice. The figure in this chapter is the bridge between the two books.

**Sport as a natural laboratory.** Elite swimming has long been used to study excellence, from Dan Chambliss's ethnography "The Mundanity of Excellence" (1989), which *Grit* cites, to Bowman's own *The Golden Rules* (2016). Chambliss already stressed the *social world* of swimmers: parents, coaches, pools, money.`,
  evidence: [
    { cite: "Duckworth, Peterson, Matthews & Kelly (2007), \"Grit: Perseverance and passion for long-term goals,\" *JPSP*", note: "The founding grit paper: West Point, Spelling Bee, Ivy League and adult samples. Correlational, but prospective, with grit measured before outcomes." },
    { cite: "Duckworth et al. (2019), \"Cognitive and noncognitive predictors of success,\" *PNAS*", note: "Over 11,000 West Point cadets. Grit predicted graduation, and cognitive ability predicted academic and military grades. It supports grit's niche role in *persistence*." },
    { cite: "Interview with Lt. Gen. Robert Caslen (2015)", note: "The culture claim (\"attrition model\" to \"developmental model\") rests on the superintendent's account. It is plausible, but historical trends have many possible causes (selection of applicants, policy, the end of the draft era)." },
    { cite: "Interviews with Bob Bowman (2025); press accounts of Léon Marchand (Le Monde, L'Équipe, The Guardian)", note: "Biographical sources. They show mechanisms (coaching, peers, facilities) but can't separate their effects from Marchand's own development." },
  ],
  debates: `**Trends across years vs. differences within a year.** The West Point example is clever. It says person-level variables (grit) explain who completes *within* a cohort, while situation-level changes (culture) explain how many complete *across* cohorts. That is the classic statistical point that between-person correlations and population-level changes answer different questions, the same logic as the Flynn effect and heritability. But the across-years trend is a single time series, and many things changed after the 1970s. Treat it as suggestive.

**Survivorship and the champion story.** Phelps and Marchand are extreme outliers. Many swimmers moved to elite programs and didn't win medals. The stories show *how* situations might matter, not *how much*. Duckworth knows this and backs the claim with larger studies in later chapters.

**Talent is still in the frame.** Bowman notes Phelps's "height and wingspan." Marchand's uncle saw him glide fifteen feet at six. Situational accounts sometimes ignore that coaches and programs **select** promising athletes. Good situations both develop talent and attract it, a selection effect worth discussing.

**Tolstoy's stoicism vs. Duckworth's agency.** Tolstoy's maxim stands in for a long tradition of Stoicism, Buddhism and "accept what you can't change." Duckworth's disagreement is partial: Chapter 4 annotates the Serenity Prayer rather than rejecting it.`,

  annotations: [
    { anchor: "passion and perseverance that I call", title: "Grit, defined", body: `In the research, grit is "perseverance and passion for long-term goals" (Duckworth et al., 2007), measured by the Grit Scale. "Passion" there means *consistency* of interests over time. Note the debate: meta-analyses find grit overlaps heavily with conscientiousness (Credé et al., 2017). See [[grit]].` },
    { anchor: "was also the simplest: willpower", title: "From willpower to love", body: `This is the hinge between the two books. *Grit* already argued that gritty people's passion is sustained by *interest* and *purpose*, not grim self-denial (Grit, Chs. 6, 8). *Situated* adds a causal layer: those motivating thoughts are evoked by situations.` },
    { anchor: "with no changes in admission criteria or graduation standards", title: "Two levels of explanation", body: `A classic methods point. Correlations *between individuals* (grittier cadets finish more often) and changes *in the population mean* (more cadets finish each decade) can have different causes. Height is highly heritable within a generation, yet average height rose for environmental reasons. The same logic underlies the Flynn effect (*Grit*, Ch. 5).` },
    { anchor: "An evolution from weeding out the weak to helping every cadet grow stronger", title: "Attrition vs. development cultures", body: `This mirrors debates in higher education ("weed-out" STEM courses) and medicine (hazing-style training). Studies of gateway courses show that redesigning instruction can cut failure rates without lowering standards. Freeman et al.'s 2014 *PNAS* meta-analysis found active learning reduced STEM failure rates from about 34% to 22%. It parallels *Grit*'s "wise parenting" and Ch. 3's sweet spot: high standards plus support.` },
    { anchor: "grit is necessary but not sufficient", title: "An interaction claim", body: `In statistical terms Duckworth is proposing that the effect of grit depends on the situation (grit × situation), not just that both matter additively. Interactions are harder to detect than main effects and need large samples. Most evidence in the book shows situational *main* effects. Ask, as you read, where the evidence for the interaction is.` },
    { anchor: "environment of excellence", title: "Designing practice", body: `Bowman's preplanned practices are deliberate practice in Ericsson's sense: specific goals, feedback, progressive difficulty, designed by a teacher (*Grit*, Ch. 7; *Situated*, Ch. 8). The "environment" is mostly people and routines, not facilities.` },
    { anchor: "Advantageous circumstances are typically chalked up to good luck", title: "Luck as a label", body: `Calling something "luck" ends the inquiry. Robert Frank (*Success and Luck*, 2016) and Michael Sandel (*The Tyranny of Merit*, 2020) argue successful people systematically underrate luck, with moral consequences for how they view the less fortunate. Duckworth's move is subtler: some "luck" is a set of situational causes that could, in principle, be replicated for others.` },
    { anchor: "A wise man does not wish to change his situation", title: "Tolstoy and the Stoics", body: `Tolstoy's *Calendar of Wisdom* compiles Stoic, Christian and Eastern sayings. The Stoic dichotomy of control (Epictetus) says only judgments and choices are "up to us." Duckworth's annotated Serenity Prayer in Ch. 4 enlarges what counts as "up to us" to include your immediate situation.` },
    { anchor: "heroic grit and situational awareness are compatible", title: "Reconciling the two books", body: `This is the thesis sentence for readers of *Grit*. Interactionist personality psychology (Mischel & Shoda's CAPS; Fleeson's whole trait theory) has long held that dispositions and situations jointly produce behavior. What is new is the practical, almost moral, emphasis on choosing situations.` },
    { anchor: "Léon Marchand got on a plane", title: "Selection as agency", body: `Moving is "situation selection" at its largest scale. Note the resources required: language learning, a scholarship, family support, an elite athlete's bargaining power. Chapter 9 takes up who can move and the "status quo bias" that keeps even those who can from moving.` },
    { anchor: "Success is collective.", title: "Individual vs. collective credit", body: `The sociology of science calls the tendency to credit famous individuals for collective work the **Matthew effect** (Merton, 1968). It also connects to the "great man" theory of history and its critics. Duckworth's version is practical: if success is collective, so are the levers for producing it.` },
  ],
});

SG.fill("situated", "ch02", {
  thesis: "Behavior unfolds in three stages (situation → thoughts → response), and the earliest intervention, changing the situation, is the most powerful and least effortful.",
  overview: `At a conference titled "How Do We Change?", Stanford's **James Gross** sketched three boxes: situation, thoughts, response. At Thanksgiving, you can suppress your anger at your brother-in-law (Box Three, willpower), reframe his comments or think about pie (Box Two), or, earliest of all, sit at the other end of the table, wash dishes, or sit by Grandma (Box One). "By changing your situation, you automatically change your thoughts, which automatically change your response."

For Duckworth this was "revolutionary." It explained why her early "just-do-it" grit interventions (handgrips, rowing machines, banning "like") "failed spectacularly": they attacked motivation at the last possible moment.

Evidence follows. Among ~20,000 high schoolers, those relying on willpower studied less and scored lower on the SAT, while those with situational strategies did better. The "Everyday Temptations" study found successful people avoid temptation more than they resist it. An intervention teaching young adults situation change beat both willpower training and no advice. And in essays about life changes, successes were more often about "mastery over the environment," including moving (36% vs. 13%). The chapter ends with Frog and Toad feeding the cookies to the birds, and with Frankl's rarely quoted line: "To suffer unnecessarily is masochistic rather than heroic."`,
  voice: `When I was in graduate school, I believed willpower was a muscle you could strengthen by doing hard things. My students and I designed exercise after exercise. None of them worked. The day I heard James Gross explain his three boxes, I understood why: we were trying to change behavior at the last possible moment.

Here is the sequence. First there is your situation, the objective facts. Then your mind interprets it, so fast you don't notice. Only then do you feel and act. You can intervene at any box, but the earlier you intervene, the easier it gets. Our research now shows that, of all the ways you can change your behavior, willpower is the absolute worst.

Changing your situation isn't effortless. But a little willpower goes a long way when you use it to get situated. It is not a hack or a trick. It is how people actually make big, lasting changes in their lives. Even Frankl, whose name coaches invoke to argue that we should only change ourselves, said that when suffering is avoidable, the meaningful thing to do is remove its cause.`,

    { title: "JUST DO IT Doesn’t Do It", gist: "Frog and Toad's cookies; surveys calling lack of willpower the top barrier to change; the \"muscle\" model of willpower; Duckworth's failed just-do-it grit interventions; four situational routes to four motivating thoughts.", idea: "Just-do-it strategies accept the situation as a given and attack motivation at the last moment.", q: "Why might willpower interventions fail even if willpower is real?", terms: ["willpower", "ego-depletion", "self-control"] },
    { title: "First Things First", gist: "A ~20,000-student study: \"just forced myself\" students studied less and scored lower on the SAT, while those using situational strategies scored higher. The \"Everyday Temptations\" study: successful people avoid temptation. Shorts and sneakers by the bed.", idea: "A little willpower goes a long way when used to get situated.", q: "Correlation check: could better students simply be more likely to report situational strategies?", terms: ["situation-selection", "self-control", "experience-sampling"] },
    { title: "Succeed More, Suffer Less", gist: "Young adults randomly assigned to learn situation change met goals more (19% vs. control, 16% vs. willpower) and felt less tempted. Frog gives the cookies to the birds.", idea: "Changing the situation improves outcomes and reduces the suffering of resisting temptation.", q: "Why does feeling *less tempted* matter beyond the goal itself?", terms: ["rct", "situation-selection", "effect-size"] },
    { title: "Change Your Situation, Change Your Life", gist: "Heatherton & Nichols's essays on life changes: failures described willpower; successes described \"mastery over the environment,\" including moving (36% vs. 13%), support and accountability.", idea: "Big life changes stick when aimed at Box One.", q: "Think of the biggest positive change you've made. Was it Box One, Two or Three?", terms: ["situation-selection", "correlation-causation"] },
    { title: "Three Boxes, Daily", gist: "Stephen Dubner draws three boxes as a screen saver; \"control the controllables\"; Frankl's famous line and the passage that follows: unnecessary suffering is \"masochistic rather than heroic.\"", idea: "When you're able to change a situation for the better, you absolutely should.", q: "Does Duckworth read Frankl fairly? What was his context?", terms: ["three-boxes", "serenity-prayer"] },
  ],
  origins: `**James Gross's process model** (1998) organized dozens of emotion-regulation tactics into five families ordered by when they act: situation selection, situation modification, attentional deployment, cognitive change, response modulation. Duckworth and Gross, with philosopher Tamar Gendler, extended it to self-control ("Situational strategies for self-control," 2016) and then to behavior change generally (Duckworth & Gross, 2020).

**The willpower-as-muscle model** came from Roy Baumeister's ego-depletion research (1998). Duckworth's endnote points instead to Kurzban et al.'s (2013) opportunity-cost model, a signal that she sides with the critics after the replication failures.

**Frankl** (*Man's Search for Meaning*, 1946/1959) is often quoted as a pure "change yourself" Stoic. Duckworth's close reading of the following passage ("If it were avoidable… the meaningful thing to do would be to remove its cause") is one of the chapter's best moves.`,
  evidence: [
    { cite: "Duckworth, Gendler & Gross (2016), \"Situational strategies for self-control,\" *Perspectives on Psychological Science*", note: "The theoretical paper behind the whole book. It argues situational strategies are underused and effective, and maps them onto Gross's process model." },
    { cite: "Baldwin, …, Duckworth (2022), \"Self-control and SAT outcomes: Evidence from two national field studies,\" *PLoS ONE*", note: "About 20,000 high schoolers. Correlational: strategy reports and outcomes were measured, not assigned. The direction (willpower users do worse) fits the theory, but confounds are possible." },
    { cite: "Hofmann, Baumeister, Förster & Vohs (2012), \"Everyday temptations,\" *JPSP*", note: "Experience sampling of 205 adults. People higher in trait self-control reported *fewer* temptations rather than more successful resistance, consistent with situation selection. A widely cited, important finding." },
    { cite: "Duckworth et al. (2016), \"A stitch in time: Strategic self-control in high school and college students,\" *Journal of Educational Psychology*", note: "Includes the randomized intervention: situation-change training beat willpower training and control on goal attainment and reduced temptation. Effects are modest and short-term (one week)." },
    { cite: "Heatherton & Nichols (1994), \"Personal accounts of successful versus failed attempts at life change,\" *PSPB*", note: "Coded autobiographical essays. Illuminating but retrospective: people may *remember* successes as environmental and failures as willpower lapses." },
    { cite: "Kurzban, Duckworth, Kable & Myers (2013), \"An opportunity cost model of subjective effort and task performance,\" *BBS*", note: "Effort feels costly because of what else you could be doing. An alternative to the depletable \"muscle.\" Duckworth is a coauthor." },
  ],
  debates: `**Ego depletion's collapse.** The muscle model of willpower, which inspired Duckworth's early interventions, failed large preregistered replications (Hagger et al., 2016; Vohs et al., 2021). *Situated* is on the right side of this shift. But note that the case for situational strategies doesn't depend on depletion. Even if willpower never "runs out," it acts late and must be re-exerted every time.

**Is "situation first" always best?** Some situations can't be selected (a family dinner you must attend), and avoiding triggers can backfire in anxiety disorders, where avoidance maintains fear (exposure therapy works by *not* avoiding). Troy et al. (2013) found reappraisal helps more when situations are uncontrollable. Duckworth's model is best read as "consider the earliest *feasible* box first."

**Effect sizes.** The intervention's 19% and 16% figures are *relative* improvements over one week. Ask about absolute differences and durability.

**Self-report of strategies.** Several findings rest on what people *say* they do. People may have poor insight into their own strategies, or describe them in culturally approved ways.`,
  people: [

  annotations: [
    { anchor: "Your feelings don’t show up until Box Three", title: "Appraisal before emotion", body: `This follows appraisal theory (Arnold, Lazarus): emotions arise from evaluations of a situation's relevance to your goals. In the 1980s Zajonc argued affect can precede cognition ("preferences need no inferences"); Lazarus replied that appraisal can be fast and nonconscious. Most emotion scientists now accept rapid, minimal appraisal, which is compatible with Gross's sequence.` },
    { anchor: "Earliest of all, you can change yourself by changing your situation", title: "Situation selection and modification", body: `Gross separates **selection** (choosing which situation to enter) from **modification** (changing the one you are in). Duckworth's Box One merges them. In the self-control paper (Duckworth, Gendler & Gross, 2016), selection is the most "upstream" and generally the most powerful, but requires foresight.` },
    { anchor: "the most commonly cited barrier to making lifestyle and behavior changes", title: "Folk theories of change", body: `The American Psychological Association's *Stress in America* survey (2012). Folk psychology treats willpower as the main cause of success or failure, which is why the book has to argue so hard. Compare research on "lay theories of willpower" (Job, Dweck & Walton, 2010): believing willpower is limited predicts worse self-control.` },
    { anchor: "our just-do-it interventions failed spectacularly", title: "A null result, reported", body: `Notice that Duckworth reports her own failed studies, the kind of result that often never gets published (the "file-drawer problem"). It also anticipates the ego-depletion replication failures. Practicing self-control on irrelevant tasks rarely transfers (see also the mixed evidence for "self-control training"; Friese et al., 2017, meta-analysis).` },
    { anchor: "willpower is the absolute worst", title: "Strong claim, careful reading", body: `"Worst" here means least effective and most effortful per unit of behavior change in their studies. That is a comparative claim across strategies, mostly from self-report and short interventions. It doesn't mean willpower is useless. Duckworth still says a little willpower is needed to set up the situation.` },
    { anchor: "nearly twenty thousand American high school students", title: "Reading the SAT study", body: `Two national samples linked self-reported strategies to SAT outcomes (Baldwin et al., 2022). Ask: who reports "set a concrete study schedule somewhere I would see it"? Possibly more organized, better-resourced students. The pattern fits the theory, but causal confidence comes from the randomized intervention later in the chapter.` },
    { anchor: "a landmark study called", title: "Everyday Temptations", body: `Hofmann et al. (2012) pinged 205 adults with smartphones seven times a day for a week, recording desires, conflicts and resistance. People high in trait self-control reported fewer problematic desires. Follow-ups (Ent, Baumeister & Tice, 2015; Galla & Duckworth, 2015) suggest they rely on avoidance and good habits. Self-control may be less about inner strength than about good *setup*.` },
    { anchor: "19 percent better than the no-treatment group", title: "Relative vs. absolute", body: `These are relative differences in self-reported goal progress after one week. Short horizons and self-report are typical of first-stage interventions. Next steps would be longer follow-ups, objective outcomes and preregistered replication. Megastudies (Ch. 6) are part of that path.` },
    { anchor: "36 percent of adults who succeeded", title: "Retrospective accounts", body: `Heatherton & Nichols coded essays written after the fact. Attribution research predicts we explain successes differently from failures, so the coding may capture *storytelling* as well as causes. Still, the moving statistic (36% vs. 13%) points toward natural experiments in Ch. 9 that are harder to dismiss.` },
    { anchor: "a little willpower goes a long way", title: "Willpower, relocated", body: `A key reconciliation. Willpower is not abolished; it moves upstream. Philosophers call this **diachronic** self-control (acting now to constrain your future self), as opposed to **synchronic** self-control (resisting in the moment). See Kennett & Smith, and Gendler's work on alief.` },
    { anchor: "To suffer unnecessarily is masochistic rather than heroic", title: "Frankl, in context", body: `Frankl wrote from the Holocaust, where most suffering was unavoidable, so meaning came from attitude. The passage Duckworth quotes is his explicit limit on that teaching. This is a good example of the principle of charity applied to a source: reading the full argument instead of the famous excerpt.` },

SG.fill("situated", "ch03", {
  thesis: "We each contain multiple selves, and situations switch them on. We underestimate this in others (the fundamental attribution error) and in ourselves, so seek situations that are both challenging and supportive.",
  overview: `Visiting her parents, gritty Professor Duckworth sprawls in front of *Top Chef* like a teenager. Her husband jokes about multiple personality disorder, which prompts the lecture at the heart of this chapter: **we all have multiple personalities**. Traits are like climate, situations like weather. "Your personality has range." Her optimism collapses while writing this book; her pessimist father was a bold risk-taker at DuPont.

Why don't we see this? The **fundamental attribution error**: Lee Ross's quiz-bowl study showed randomly assigned "questioners" look smarter than "contestants," even to the contestants themselves. Our brains work in "portrait mode," sharp on the person and blurring the background. Even NFL teams pay quarterbacks for "yards after catch," which depend on receivers and don't carry over when a QB switches teams.

Aaron Beck, founder of cognitive therapy, persuades Duckworth that **inconsistency is a feature**: personalities shift into "modes" depending on fit with the environment. A psychotic patient, David, becomes lucid in the hospital cafeteria, and cooking eventually leads him out of the hospital. Beck calls such situations the **sweet spot**. Duckworth's 2×2: high challenge + high support is the sweet spot; support alone breeds complacency, challenge alone burnout, neither apathy. You can't pick your parents, she tells a Milton Hershey student, but you can pick colleges, classmates, office hours, and the front row.`,
  voice: `It is instinctive to label people by their traits, and traits are real. I am, on average, an optimist, and my father was, on average, a worrier. But averages hide range. While writing this book, there was a confident Angela and an insecure one. My father the pessimist was also an inventor who took bold risks at work.

So I've come to see inconsistency not as hypocrisy but as design. Tim Beck taught me that personalities shift into modes, and that flexibility is a marker of health. The question is not whether different situations bring out different selves. They do. The question is which selves you want to feed.

We are blind to this partly because our brains are built to see people sharply and backgrounds dimly. Even professionals paying millions of dollars make the error. Once you see it, you start asking not just "What kind of person is this?" but "What situation brings out their best?" My answer, from research and from Beck's clinic, is situations that are both challenging and supportive.`,
  quotes: [
    { text: "To an astonishing degree, your personality has range." },
    { text: "The situation is hard to see—until you look for it." },
    { text: "It raises the ceiling on your expectations and builds the floor so you can reach them." },
  ],
  diagrams: ["range", "portrait-mode", "sweet-spot"],
  sections: [
    { key: "_open", title: "Opening: Angela on the carpet", gist: "Duckworth regresses to her teenage self at her parents' house; Jason's \"multiple personality disorder\" joke; the correction to \"dissociative identity disorder\" and the claim that \"we all have multiple personalities.\"", idea: "The same person can switch selves like a light switch, cued by place and people.", q: "Where do you become a version of yourself you don't recognize?", terms: ["multiple-selves", "dissociative-identity-disorder"] },
    { title: "Personality 101", gist: "Traits describe tendencies; personalities differ by goals, interests, beliefs and habits. But traits are like climate. Duckworth's optimism and her father's pessimism both had wide ranges.", idea: "What is surprising is not differences between people but the variation around each person's average.", q: "Rate your own optimism from 1 to 10 on your best and worst days. How wide is your range?", terms: ["personality-range", "conscientiousness"] },

  origins: `This chapter compresses half a century of personality and social psychology.

**Trait psychology and its critics.** Mischel (1968) argued traits predicted specific behaviors weakly (r ≈ .30). The resolution came through *aggregation* (Epstein, 1979), *if–then signatures* (Mischel & Shoda, 1995), and *density distributions* (Fleeson, 2001), which show large within-person variability around stable averages. The Little League coaches study (Smith, Shoda, Cumming & Smoll, 2009) is a direct test of behavioral signatures.

**The fundamental attribution error.** Jones & Harris (1967) found observers attributed essay content to the writer even when told the position was assigned. Ross (1977) named the "fundamental" error; Ross, Amabile & Steinmetz (1977) ran the quiz-bowl study. Gilbert & Malone (1995) analyzed its causes.

**Beck's modes.** Late in his career, Beck (with Paul Grant and colleagues) built **recovery-oriented cognitive therapy (CT-R)** for serious mental illness, focusing on activating an "adaptive mode" through meaningful activity.

**The 2×2.** It echoes Baumrind's authoritative parenting, which *Grit* calls "wise parenting," and Yeager's "wise feedback."`,

  debates: `**How "fundamental" is the error?** Cross-cultural research finds weaker dispositional bias in East Asian samples (Miller, 1984; Morris & Peng, 1994), and the actor–observer asymmetry didn't survive meta-analysis (Malle, 2006). Some argue dispositional inferences are often reasonable, since people *select* their situations, so behavior does carry information about character (Funder's accuracy research). Duckworth's twist, that we neglect situations even in explaining *ourselves*, deserves more direct evidence.

**Are traits illusions?** No. Duckworth's position is the modern consensus: traits are real averages with real predictive power over time (Roberts et al., 2007). The person–situation debate ended in a draw. The open question is how much of the within-person range can be steered deliberately.

**The 2×2's evidence base.** Challenge × support is supported by parenting research, feedback research (Yeager et al., 2014), and organizational studies, but is mostly assembled from separate literatures. It works as a heuristic. Specific predictions, for example where complacency turns into apathy, are less tested.

**Mental illness and situations.** The David story is moving, but schizophrenia has strong biological components. CT-R works *alongside* medication. Beware reading the case as "situation cures psychosis."`,
