  thesis: "Situational parenting means shaping children's situations (home, then school and neighborhood, then activities) rather than insisting. Parents keep their leverage by choosing where peers and mentors are found.",
  overview: `Mister Rogers: "'Why can't my boy concentrate?' might be rephrased 'Where can my boy concentrate?'" That missing link is **situational parenting**.

**Home.** "A thousand details add up to one impression" (John McPhee). Books in the home predict educational attainment across 27 nations, with 500 books about as powerful as college-educated parents. Screen time, nearly nine hours a day for teens, predicts the opposite. Children learn by imitation (Andrew Meltzoff), so model what you want: "Children see, children do." **Shonda Rhimes** grew up with a pantry kingdom and a willow-tree reading perch, with parents who said "That's interesting! Do more!" and a family where "hard work was not optional." She later built Shondaland.

**Adolescence.** Teens turn to peers and non-parent adults, so parents choose the place where those are found: **school**. Duckworth's study of ~1,000 Pennsylvania teens: stronger growth-mindset school cultures predicted more grit and higher grades. Bridget Terry Long's parents drew a 30-mile commute circle and toured high schools.

**Neighborhood.** Raj Chetty: "the determinants of economic mobility are hyperlocal." Schools, income mix, two-parent families, and above all **social capital** (cross-class friendships), the strongest predictor of mobility yet found. "You buy the smallest house in the best school district."

**Activities.** Debbie Phelps, a single-mom educator, told teachers "You're wrong" about her son with ADHD, rearranged his classroom situations, found a math tutor who used swimming problems, and drove the minivan to North Baltimore Aquatic Club ("Have minivan, will travel"). Michael absorbed swimming for years from the stands. For a parent, there's nothing better than watching a child in their sweet spot.`,
  voice: `Parents can't shield children from pain or fight their battles for them. What we can do is set up situations that bring out their best.

When children are small, that means the home. Fill it with books, keep screens scarce, and above all model what you want, because children learn by imitation. As they grow, parents' influence gives way to peers and other adults, but parents still choose the places where children find those peers and mentors: schools, neighborhoods, activities. These are among the most consequential decisions you'll make. Situationally wise parents make whatever sacrifices they can to get them right.

    { anchor: "Where can my boy concentrate?", title: "From why to where", body: `This reframe matches person–environment fit research: performance and well-being depend on the match between a person's needs and abilities and the environment's demands and supplies (Edwards; Eccles's "stage–environment fit" in adolescence).` },
    { anchor: "A thousand details add up to one impression", title: "Cumulative cues", body: `In environmental psychology, settings communicate through many small cues. Gosling's "snooping" studies showed strangers can accurately infer personality from bedrooms and offices. Children read the same cues for values.` },
    { anchor: "as having college-educated parents", title: "Scholarly culture", body: `Evans et al. estimated growing up with 500 books ≈ 3.2 extra years of schooling. Critics note books mark parental reading, cognitive engagement, and possibly genetic transmission. No experiment has randomly assigned home libraries.` },
    { anchor: "now averages nearly nine hours a day", title: "What counts as screen time", body: `Common Sense counts entertainment screen media, much of it simultaneous with other activities. Research increasingly distinguishes *types* of use (passive scrolling vs. creating vs. communicating) and *displacement* (of sleep, reading, exercise) over total hours.` },
    { anchor: "within days, newborns spontaneously imitate the adults around them", title: "A disputed claim", body: `Meltzoff & Moore (1977) is famous, but Oostenbroek et al. (2016) followed 106 infants from 1 to 9 weeks and found no evidence of neonatal imitation. Meltzoff and colleagues disputed their methods. The broader point stands: by late infancy children imitate extensively, even "over-imitating" unnecessary actions (Horner & Whiten, 2005).` },
    { anchor: "Children see, children do", title: "Modeling", body: `Bandura's Bobo doll studies (1961) showed children imitate adult aggression they observe. Parental modeling predicts children's reading, eating and physical activity. Hypocrisy, preaching one behavior while modeling another, undermines the message (Bryan & Walbek, 1970).` },
    { anchor: "she declared it a sign of creativity", title: "Autonomy support", body: `Self-determination theory (Deci & Ryan) finds autonomy-supportive parenting, which takes the child's perspective, offers choice and minimizes control, predicts intrinsic motivation and creativity. Shonda's mother closing the pantry door is a textbook example.` },
    { anchor: "their same-aged peers", title: "The adolescent social brain", body: `Steinberg's research shows adolescents take more risks when peers are watching (Gardner & Steinberg, 2005, driving-simulator study). Peer presence amplifies reward sensitivity, which is why the *choice* of peers matters so much in these years.` },
    { anchor: "the stronger a school’s growth mindset culture, the more its students demonstrated grit", title: "Goal structures", body: `Achievement goal theory distinguishes *mastery* climates (learning, effort, improvement) from *performance* climates (ability, comparison). Mastery climates predict adaptive motivation (Meece, Anderman & Anderman, 2006). Duckworth's items measure students' perceptions, which may reflect their own orientations as well as school reality.` },
    { anchor: "Many kids go on college tours, but I went on high school tours", title: "Choosing schools", body: `School choice research finds parents weigh peer composition heavily, sometimes more than school value-added. Abdulkadiroğlu et al. (2020) found parents' choices track peer quality more than causal school effectiveness. Duckworth's advice to look at culture and teachers is a corrective.` },
    { anchor: "the determinants of economic mobility are hyperlocal", title: "Exposure effects", body: `Chetty & Hendren (2018) used families that moved with children of different ages. Each additional childhood year in a better area raised adult income proportionally, about 4% of the difference per year. That is causal evidence that childhood environment matters, and it explains why timing matters.` },
    { anchor: "a longitudinal study of 760,000 children in military families", title: "Military assignment designs", body: `Military postings are determined largely by service needs, making neighborhood assignment plausibly random relative to family characteristics. Similar designs underlie the BMI study in Ch. 9.` },
    { anchor: "the single strongest predictor of economic mobility", title: "Economic connectedness", body: `Chetty et al. (2022) measured economic connectedness, the share of high-SES friends among low-SES people, using 21 billion friendships. It predicted mobility better than school quality, segregation, inequality, or family structure. It is still a correlation at the county level, which is why "Social Capital II" studied the exposure and friending-bias components.` },
    { anchor: "You buy the smallest house in the best school district", title: "The fallacy of composition", body: `What is rational for one family can't work for all: if everyone bids for the same districts, prices rise and segregation can deepen. Housing-voucher programs with search help (Creating Moves to Opportunity) and inclusionary zoning are collective versions of this advice.` },
    { anchor: "At age nine, Michael was diagnosed with attention deficit hyperactivity disorder", title: "ADHD and environment", body: `ADHD is highly heritable (~70–80%), and symptom expression depends on context. Children with ADHD often focus intensely on highly engaging activities ("hyperfocus"). The large MTA trial (1999) found medication plus behavioral support helped most on several outcomes.` },
    { anchor: "when learning is meaningful and authentic, a child will sit forever", title: "Engagement and context", body: `Classroom engagement research (Fredricks et al.) and situational interest research (Hidi & Renninger) agree: relevance, autonomy and challenge raise attention. That is *Grit*'s interest chapter applied to school design.` },
    { anchor: "what Michael needed most was structure", title: "Structured activities", body: `Larson's (2000) work on youth development argues structured voluntary activities uniquely combine intrinsic motivation with sustained concentration, building "initiative." That supports *Grit*'s Ch. 11 on extracurriculars.` },
    { anchor: "It was almost as if he’d been developing his skills mentally", title: "Observational learning and mental practice", body: `Watching experts and mentally rehearsing can improve motor performance (Driskell, Copper & Moran's 1994 meta-analysis of mental practice found a moderate effect). Children's ambient exposure to skilled performance is a kind of situational apprenticeship.` },
  ],
});

SG.fill("situated", "ch11", {
  thesis: "Performers deliver their best; leaders bring out the best in others by designing their situation: physical space, peer structures, mentoring, and culture carriers.",
  overview: `Duckworth's Wharton leadership course begins with the Three Boxes read right to left: leaders want effort (Box Three), which flows from motivating thoughts (Box Two), which leaders create through the situation (Box One). Too much challenge without support breeds burnout; support without challenge, complacency; both together, the sweet spot. "Never… think about something else… when you should be thinking about the power of incentives" (Charlie Munger).

**Case study: Toby Cosgrove and Cleveland Clinic.** A heart surgeon with 22,000 operations becomes CEO, sets the North Star "Patients First," and moves the clinic from the bottom quartile of patient experience to the top. A security guard recites the mission unprompted: the *why* (mission) connected to the *way* (culture). The **situational leadership checklist** has four moves.

1. **Set up their space.** A skyway and co-located offices so disciplines collide; one logo; Diane von Fürstenberg hospital gowns; price tags on supplies ($100M saved); smoke-free campuses (99% compliance); "Go!" labels; farmers markets; patients get the closest parking.
2. **Pick their peers.** Departments dissolved into disease- and organ-based institutes with shared budgets, metrics and case reviews: peer accountability, learning and solidarity built into the org chart.
3. **Make mentorship the mode.** Cosgrove's own curiosity conversation with Michael Porter; Andrea Sikon's elective mentoring program with peer coaches, joint training, a directory, and 45-minute starting conversations.
4. **Champion culture carriers.** Chief experience officer Jim Merlino; the "Empathy" video; a universal half-day "Cleveland Clinic Experience" ($11M) after which everyone's badge reads *Caregiver*.

Emerson: "An institution is the lengthened shadow of [its leader]." What shadow will you cast?`,
  voice: `The difference between a great performer and a great leader is simple to say and hard to do. Performers bring their own best. Leaders are responsible for bringing out the best in others, and exhortation won't do it. Telling people to try harder is asking them to use willpower, and we know how well that works.

What works is designing the situation. The physical space. The structure of who works with whom. The norm of mentoring. The people who carry the culture. Toby Cosgrove did all four, and Cleveland Clinic's way of doing things came to match its reason for existing.

It's slow, complex work, and the wise leader shares the load. But it's how a leader's habits become a team's traditions, a leader's purpose becomes a team's mission, and a leader's character becomes a team's culture.`,

    { text: "Performers strive to deliver their best as individuals; leaders are responsible for bringing out the best in others." },

    { title: "A Case Study in Situational Leadership", gist: "Toby Cosgrove's record as surgeon and CEO; Cleveland Clinic's growth and jump in patient experience; \"Patients First\" as North Star.", idea: "A single top-level goal can organize a large organization.", q: "What is your organization's \"Patients First\"? Does everyone know it?", terms: ["goal-hierarchy", "ultimate-concern"] },
    { title: "Why vs. Way", gist: "The security guard's history lesson; why (mission) vs. way (culture); JFK and the NASA janitor; the test is whether frontline staff explain the mission as the CEO would.", idea: "The why takes a long time; the way takes longer.", q: "Would the newest person in your organization explain its mission the way its leader would?", terms: ["why-and-way", "culture"] },
    { title: "Situational Leadership Checklist", gist: "Cosgrove's four moves: space, peer structure, mentoring, empowered culture carriers. These are the four elements of situational agency, applied to others.", idea: "Four essential elements of situational leadership.", q: "Which of the four is weakest in your team?", terms: ["situational-responsibility"] },
    { title: "Set Up Their Space", gist: "Churchill's chamber; Steve Jobs's hallways; the skyway and co-located offices; one logo; new gowns; price tags; smoking ban; Go! labels; farmers markets; patient parking.", idea: "Physical setup makes priorities a reality.", q: "What one physical change would make your team's priority obvious, easy, rewarding?", terms: ["physical-distance", "nudge", "behavior-setting"] },

    { title: "Champion Culture Carriers", gist: "\"Our patients respected us, but they sure didn't like us\"; chief experience officer Jim Merlino; the Empathy video; universal workshops mixing roles; everyone's badge says Caregiver.", idea: "The wise leader shares the load.", q: "Who carries culture in your organization, and are they empowered?", terms: ["culture", "identity-motivation"] },
    { title: "Lengthen Your Shadow", gist: "Emerson's \"lengthened shadow\"; habits → traditions, purpose → mission, character → culture; structural change, not mandates.", idea: "The way you do things becomes the way we do things.", q: "What shadow will you cast?", terms: ["culture"] },
  ],
  origins: `**Leadership and organizational design.** Schein's culture-embedding mechanisms (what leaders attend to, reward, model, and how they design structures); Hackman's conditions for effective teams (real team, compelling direction, enabling structure, supportive context, expert coaching); Edmondson's psychological safety and "teaming" in hospitals.

**Health-care management.** Cosgrove's *The Cleveland Clinic Way* (2014); Merlino's *Service Fanatics* (2015); the shift to integrated practice units, which Michael Porter advocated (Porter & Teisberg, *Redefining Health Care*, 2006).

**Architecture and behavior.** Churchill's 1943 speech on rebuilding the Commons; research on office layout and interaction (Allen curve: communication falls off sharply with distance).

**Incentives.** Munger's "Psychology of Human Misjudgment"; Kerr's classic "On the folly of rewarding A, while hoping for B" (1975).`,
  evidence: [
    { cite: "Cosgrove (2014), *The Cleveland Clinic Way*; interviews by the author", note: "Primary source for the case. Organizational case studies are rich but can't isolate which change caused which outcome." },
    { cite: "Carton (2018), \"'I'm not mopping the floors, I'm putting a man on the moon,'\" *ASQ*", note: "Historical study of NASA under Kennedy: leaders connected everyday work to the ultimate aim through a few concrete milestones." },
    { cite: "Musgrave (2010), interview with Cosgrove, *Clinical and Translational Science*", note: "Source for the borders-of-disciplines quote. Innovation research on boundary-spanning supports it (e.g., Uzzi et al., 2013, atypical combinations in science)." },
    { cite: "Skarupski (2024) podcast with Andrea Sikon; Van Dyke (2022), *Healthcare Executive*", note: "Descriptions and internal survey data on the mentoring program. Promising but not independently evaluated." },
    { cite: "Lee & Duckworth (2018), \"Organizational Grit,\" *Harvard Business Review*", note: "Duckworth's earlier essay with Cosgrove's input on building gritty organizations." },

  debates: `**Case-study inference.** Cleveland Clinic changed many things at once during a period of growth and industry change. Its patient-experience gains may reflect the new metrics (HCAHPS) and management focus as well as culture. Single-case leadership stories are prone to the **halo effect** (Rosenzweig, *The Halo Effect*, 2007): successful firms' practices look wise in hindsight.

**Open offices and "collisions."** Steve Jobs's hallway theory is popular, but Bernstein & Turban (2018) found moving to open-plan offices *reduced* face-to-face interaction by about 70% as people retreated to email. Proximity helps (the Allen curve), but design details matter. Cleveland Clinic's version, co-locating related specialists and building bridges, is more targeted.

**Smoking bans for employees in their own cars.** Effective (99% compliance), but it raises questions about employer control over personal behavior. Some hospital systems also refused to hire smokers, which drew ethical criticism (Schmidt, Voigt & Emanuel, 2013, *NEJM*).

**Leader-centric accounts.** Emerson's "lengthened shadow" fits the hero narrative Duckworth critiqued in Ch. 1. She notes Cosgrove credits others. Organizational scholars caution against the "romance of leadership" (Meindl, 1985): attributing outcomes to leaders is the fundamental attribution error at the organizational level.`,
  people: [

  why: `It translates the book from self-help to management. If you lead anyone, your job is to build the Box One where your team's best selves show up.`,

  annotations: [
    { anchor: "leaders are responsible for bringing out the best in others", title: "Leadership as situation design", body: `Hackman's research on teams found that a team's *design* (structure, composition, direction, context) predicts effectiveness more than leaders' real-time coaching. He estimated design explained far more variance than coaching. That is situational leadership in an organizational-science key.` },
    { anchor: "Never, ever, think about something else", title: "Incentives and folly", body: `Steven Kerr's 1975 paper "On the folly of rewarding A, while hoping for B" catalogues organizations that exhort one behavior while incentivizing another. Incentives are the most powerful Box One feature of any workplace.` },
    { anchor: "Cleveland Clinic rose from the bottom quartile of patient experience to the top", title: "Measuring patient experience", body: `HCAHPS scores became public and tied to Medicare payments in the 2000s–2010s, which gave hospitals strong incentives to improve. Part of Cleveland Clinic's rise reflects a national shift in incentives, a situational factor for the organization itself.` },
    { anchor: "the way almost certainly takes longer", title: "Espoused vs. enacted values", body: `Argyris & Schön distinguished espoused theories from theories-in-use. Schein's "basic assumptions" are slow to change because they are learned through shared success and rarely discussed. Culture change programs often fail by stopping at posters.` },
    { anchor: "I’m putting a man on the moon", title: "Sensegiving", body: `Carton found Kennedy-era NASA leaders linked daily work to the ultimate aim by creating a clear, concrete ladder of milestones, so employees could see their contribution. The janitor story itself is likely apocryphal, but the mechanism was documented.` },
    { anchor: "We shape our buildings, and afterwards our buildings shape us", title: "Architecture and politics", body: `Churchill argued the oblong chamber's adversarial seating and limited size preserved Britain's two-party, conversational debate. Political scientists debate whether chamber design affects partisanship. It is Barker's behavior settings at the scale of a parliament.` },
    { anchor: "innovation comes from people meeting up in the hallways", title: "The Allen curve", body: `Thomas Allen (MIT, 1970s) found communication frequency between engineers drops exponentially with distance, nearly vanishing beyond about 50 meters. Recent work on remote work finds similar effects for spontaneous collaboration (Yang et al., 2022, Microsoft).` },
    { anchor: "Innovation generally takes place at the borders of disciplines", title: "Boundary spanning", body: `Uzzi et al. (2013, *Science*) found the highest-impact papers combine conventional knowledge with atypical combinations. Diverse teams and boundary spanners produce more novel work, though integrating diverse expertise takes effort.` },
    { anchor: "$100 million in total savings", title: "Price transparency to clinicians", body: `Studies showing clinicians the prices of tests and supplies have found modest reductions in ordering (Sedrak et al., 2017, *JAMA Internal Medicine*, mixed results). The scorecards and committees probably mattered as much as the tags.` },
    { anchor: "99 percent of staff were in compliance", title: "Smoke-free policies", body: `Hospital and workplace smoke-free policies reduce employee smoking and support quitting (Fichtenberg & Glantz, 2002). Pairing restrictions with free support (classes, NRT) follows the sweet-spot formula: challenge plus support.` },
    { anchor: "parked closest to the clinic’s entrances", title: "Symbolic acts", body: `Leaders' allocation of scarce, visible resources (parking, corner offices) is one of Schein's primary culture-embedding mechanisms. It shows what they truly value.` },
    { anchor: "In medicine, we’re trained in silos", title: "Integrated practice units", body: `Porter & Lee's value-based health care advocates organizing care around medical conditions over the full cycle of care, as Cleveland Clinic's institutes do. Evidence on outcomes is growing but mixed, since reorganizations have many moving parts.` },
    { anchor: "The organizational chart makes interdisciplinary collaboration the path of least resistance", title: "Structure as friction", body: `Organizational structure is friction at scale. Conway's law in software ("organizations design systems that mirror their communication structure") is a famous corollary: change the structure and you change what gets built.` },
    { anchor: "would be elective rather than mandatory", title: "Formal vs. informal mentoring", body: `Research finds informal and voluntary mentoring tends to outperform assigned mentoring (Ragins & Cotton, 1999), partly through mutual choice and motivation. Sikon's design keeps choice while providing structure, a hybrid supported by later studies.` },
    { anchor: "but they sure didn’t like us", title: "Technical vs. relational quality", body: `Patient experience correlates, modestly, with clinical quality and adherence (Doyle, Lennox & Bell, 2013, systematic review). Empathy also affects outcomes in some trials (e.g., Hojat et al. on physician empathy and diabetic control).` },
    { anchor: "The total cost for taking all of its personnel offline", title: "Shared experience", body: `Mixing roles randomly builds what organizational scholars call "boundary-crossing ties" and a shared identity. Social identity theory (Tajfel & Turner) predicts that a common in-group label ("Caregiver") reduces status-based divisions.` },
    { anchor: "An institution is the lengthened shadow of", title: "Emerson and the romance of leadership", body: `Emerson's line, from "Self-Reliance" (1841), fits his individualism. Organizational research cautions against over-crediting leaders (Meindl's romance of leadership). Duckworth's reframing, that leaders design structures which outlast them, is more structural than Emerson's original.` },
  ],

SG.fill("situated", "ch12", {
  thesis: "Maslow's needs are pursued together, not in sequence, and self-transcendence sits at the top. Programs for the poor must meet needs for challenge, beauty and purpose, not just survival, and helping others is part of our own fulfillment.",
  overview: `Duckworth corrects the textbook **Maslow**. He never drew a pyramid. He didn't say needs must be met one at a time from the bottom; we pursue them simultaneously, and in a life well lived, needs are integrated. He came to see **self-actualization** as insufficient and placed **self-transcendence** at the top. Half of US youth lack at least one basic necessity, and outcomes worsen with each missing necessity.

**Bill Strickland** proves Maslow right. A Black teenager in a poor Pittsburgh neighborhood ("everything was gray"), he followed the smell of coffee and Herbie Hancock into Frank Ross's ceramics classroom and began "seeing the world in color." After a trip to Fallingwater, he vowed to build a school "just like that." **Manchester Bidwell** offers free after-school arts for teens and job training for adults in a light-filled building with orchids, quilts, a gourmet dining room, a jazz amphitheater and Grammy-winning recordings. "Poverty projects look like poverty… If you want world-class behavior, then you need to begin with a world-class environment." It has no metal detectors and has never called the police in over fifty years; about 84% of vocational graduates find jobs; it costs less per person than a prison. "Talk is cheap; beautiful art and architecture are not."

**From self-actualization to self-transcendence.** Frankl argued with Maslow: "People may have enough to live by, but… not… anything to live for." Maslow conceded. Strickland at Harvard: he didn't do it out of selflessness, but "to be myself." **Situational responsibility** ends with Frankl's call for a Statue of Responsibility to match the Statue of Liberty: a hand reaching down to a hand reaching up.`,
  voice: `The pyramid in every psychology textbook gets Maslow wrong. He never drew it, he didn't think we climb it one step at a time, and late in life he concluded that self-actualization isn't the summit. Living for something beyond yourself is.

Getting Maslow right matters because it changes how we treat our neighbors. Too many programs for the poor feed the body but starve the spirit. Bill Strickland showed me what happens when you meet every need at once: beauty, order, respect, challenge, purpose. People rise to a world-class environment.

And the deepest lesson isn't about charity. Creating better situations for others is one of the most fulfilling things we can do for ourselves. Freedom is half the story. Responsibility is the other half.`,
  quotes: [
    { text: "Poverty projects look like poverty,” Bill says. “If you want world-class behavior, then you need to begin with a world-class environment." },
    { text: "A good life is one in which we meet our needs not in sequence but in synchrony." },
    { text: "Where is the hand reaching down?" },
  ],
  diagrams: ["maslow"],
  sections: [
    { key: "_open", title: "Opening: Maslow, corrected", gist: "The textbook pyramid that Maslow never drew; why correcting the record matters for helping the most vulnerable.", idea: "Properly understood, Maslow explains why everyone yearns for challenge as much as support.", q: "What did you learn about Maslow in school? What changes if needs are pursued together?", terms: ["maslow-hierarchy"] },
    { title: "Beyond Basic Needs", gist: "Maslow's 1943 theory; self-actualization; misreading as lockstep; needs integrated (the family dinner); Scott Barry Kaufman: \"Life is not a video game\"; half of US youth lack a necessity; Maslow's view that meeting all needs is a civic responsibility.", idea: "In a life well lived, needs are pursued in synchrony.", q: "Which of your needs are met together by one activity?", terms: ["maslow-hierarchy", "self-actualization"] },
    { title: "Seeing the World in Color", gist: "Bill Strickland's gray adolescence; the ceramics classroom with Frank Ross; \"passion grades\"; Fallingwater; \"I'm going to build a school just like that.\"", idea: "One mentor and one beautiful room changed a life.", q: "Did a single room or teacher ever change what you thought was possible?", terms: ["mentor", "interest", "sweet-spot"] },
    { title: "A Beautiful Situation", gist: "Manchester Bidwell's building, programs, art, music and food; the hand-crafted bench; VIP treatment without metal detectors; trust begets trustworthiness.", idea: "If you want world-class behavior, begin with a world-class environment.", q: "What would a \"world-class environment\" look like in a school or clinic you know?", terms: ["behavior-setting", "social-norms"] },
    { title: "Talk Is Cheap", gist: "Teachers notice students transformed; 84% job placement; replication in many cities and abroad; costs less than prison; \"Talk is cheap; beautiful art and architecture are not.\"", idea: "Physical beauty signals high expectations and worth.", q: "What does the physical condition of public spaces communicate to the people who use them?", terms: ["situational-responsibility"] },
    { title: "From Self-Actualization to Self-Transcendence", gist: "Frankl vs. Maslow; Maslow's concession that self-actualization requires a mission; the revised pyramid with self-transcendence at the apex.", idea: "The good life looks outward to the needs of others.", q: "What cause beyond yourself organizes your effort?", terms: ["self-transcendence", "self-actualization", "purpose"] },
    { title: "Both-And", gist: "Strickland's Harvard lecture with a duct-taped slide carousel; his MacArthur; \"I did it to be myself\"; a new definition of success.", idea: "Serving others and fulfilling yourself are not opposites.", q: "Is Strickland's \"I did it to be myself\" selfish, selfless, or neither?", terms: ["self-transcendence", "calling"] },
    { title: "Situational Responsibility", gist: "Frankl's lectures urging Americans to pair liberty with responsibility; the planned Statue of Responsibility; Frankl's carving *The Suffering Man* and his question \"Where is the hand reaching down?\"", idea: "Freedom without responsibleness degenerates into arbitrariness.", q: "Where is your hand reaching down?", terms: ["situational-responsibility"] },
  ],
  origins: `**Maslow scholarship.** Maslow (1943, 1954, 1969, 1971); Koltko-Rivera (2006) on the late hierarchy with self-transcendence; Bridgman, Cummings & Ballard (2019) on who actually built the pyramid; Kaufman's *Transcend* (2020).

**Frankl and logotherapy.** *Man's Search for Meaning*; the Frankl–Maslow exchanges.

**Built environment and dignity.** Strickland's *Make the Impossible Possible* (2007); Harvard Business School case on Manchester Bidwell; broken-windows theory's more defensible cousins (environmental disorder affects behavior; Keizer, Lindenberg & Steg, 2008); trauma-informed and "dignity-centered" design.

**Measuring youth necessities.** Duckworth's lab's Adolescent Necessities Index (Jebb et al.), listed in the endnotes.`,
  evidence: [
    { cite: "Maslow (1943), \"A theory of human motivation,\" *Psychological Review*", note: "Read it: shorter and more nuanced than the textbook version. It explicitly says needs are partially satisfied together and the order isn't rigid." },
    { cite: "Kaufman (2020), *Transcend*", note: "Synthesizes modern needs research; replaces the pyramid with a sailboat (security hull, growth sail)." },
    { cite: "Jebb, …, Duckworth, \"The Adolescent Necessities Index,\" *Journal of Research on Adolescence*", note: "A brief self-report measure of material and social necessities; more missing necessities predict worse outcomes. Correlational." },
    { cite: "Strickland (2007), *Make the Impossible Possible*; author's visit and interviews", note: "Primary source for Manchester Bidwell; outcome figures (84% placement) are program-reported, not independently evaluated in the book." },
    { cite: "Tay & Diener (2011), \"Needs and subjective well-being around the world,\" *JPSP*", note: "Companion reading: 123 countries; needs are fairly universal and contribute to well-being somewhat independently of order." },
  ],
  debates: `**Is the hierarchy valid at all?** Empirical support for strict prepotency was weak from early on (Wahba & Bridwell, 1976). Duckworth's "synchrony" reading is supported by Tay & Diener. The evolutionary "renovated pyramid" (Kenrick et al., 2010) puts parenting at the top, a different revision.

**Beauty as policy.** Manchester Bidwell's results are compelling but not experimentally evaluated. Selection is likely: students and adults choose to come, and staff are exceptional. Still, environmental-disorder experiments (Keizer et al., 2008, *Science*: litter and graffiti increased norm violations) and "dignity" research support the mechanism. Contrast this with "broken windows" policing, which used the same insight punitively and is heavily criticized.

**Cost comparisons.** "Cheaper than a prison" compares per-person costs, but the relevant question is cost per outcome changed. Rigorous cost-effectiveness studies would strengthen the argument.

**Charity vs. justice.** Situational *citizenship* is framed as personal responsibility and philanthropy. Political philosophers (Rawls; Sen and Nussbaum's capabilities approach) frame the same needs as matters of justice for institutions. Discuss which frame you find more compelling, and whether they conflict.`,

  annotations: [
    { anchor: "The fact is, Maslow never drew a pyramid", title: "Who built the pyramid?", body: `Bridgman, Cummings & Ballard (2019) traced the pyramid to management consultant Charles McDermid (1960) and its spread through management textbooks, which turned a nuanced theory into a simple hierarchy and, they argue, a tool for managerial control.` },
    { anchor: "to become everything that one is capable of becoming", title: "Self-actualization's origin", body: `Kurt Goldstein coined "self-actualization" (1934) for organisms' tendency to actualize capacities. Maslow made it a distinctively human growth need. Carl Rogers's "actualizing tendency" is a close cousin.` },
    { anchor: "From its debut, Maslow’s hierarchy was misinterpreted", title: "What Maslow wrote", body: `In 1943 Maslow said a "normal" person might have perhaps 85% of physiological needs satisfied, 70% of safety, 50% of love, 40% of esteem and 10% of self-actualization, all at once, explicitly rejecting all-or-none stepping.` },
    { anchor: "Life is not a video game", title: "Kaufman's sailboat", body: `Kaufman's *Transcend* reorganizes needs into a **security** hull (safety, connection, self-esteem) and a **growth** sail (exploration, love, purpose), with transcendence above. The epilogue's sailboat painting echoes it beautifully.` },
    { anchor: "half of the young people in the United States lack at least one necessity", title: "Measuring deprivation", body: `Multidimensional deprivation indices (e.g., the Alkire–Foster method used by the UN's Multidimensional Poverty Index) count specific necessities rather than income. Duckworth's Adolescent Necessities Index adopts a similar logic for youth.` },
    { anchor: "Environments shape behavior", title: "Disorder and norms", body: `Keizer, Lindenberg & Steg (2008, *Science*) found visible disorder (graffiti, litter) increased littering and even theft in field experiments, the "cross-norm inhibition effect." Order signals norms. Manchester Bidwell is the positive version.` },
    { anchor: "poverty of the spirit", title: "Capabilities and aspiration", body: `Economists describe an "aspirations failure" (Appadurai's "capacity to aspire"; Ray, 2006): poverty can narrow imagined futures. That echoes Chetty's "It's aspirations" (Ch. 10).` },
    { anchor: "passion grades", title: "Interest as a lifeline", body: `Strickland's story mirrors *Grit*'s interest chapter: a triggering experience (the clay), a supportive mentor (Ross), then sustained interest. Hidi & Renninger would call the ceramics room a powerful trigger for situational interest that became individual interest.` },
    { anchor: "Poverty projects look like poverty", title: "Design and dignity", body: `Architecture critics and designers (e.g., MASS Design Group's hospitals in Rwanda) argue dignified design improves care and outcomes. Evidence-based design research finds daylight, views and noise reduction affect patient recovery (Ulrich, 1984, window-view study).` },
    { anchor: "In over fifty years of operation, we haven’t once had to call the police", title: "Trust and trustworthiness", body: `Experimental economics finds trust is often reciprocated (Berg, Dickhaut & McCabe's 1995 trust game). Signaling trust can elicit trustworthy behavior, though it can also be exploited. Selection of participants matters.` },
    { anchor: "Approximately 84 percent of the adults enrolled in the vocational program find jobs", title: "Program-reported outcomes", body: `Placement rates depend on who enrolls and completes, and how "placement" is defined. Rigorous sectoral job-training evaluations (e.g., Year Up, Project QUEST; Katz et al., 2022) show some programs produce large, lasting earnings gains, which makes the model plausible.` },
    { anchor: "it costs a lot less than operating a prison", title: "Cost vs. cost-effectiveness", body: `Per-person cost comparisons are suggestive. Policy analysts prefer cost per outcome (e.g., per crime averted, per job gained) and benefit–cost ratios. Early-childhood and youth programs with strong evaluations (Perry Preschool; Heckman) show high returns.` },
    { anchor: "Self-actualization is not man’s ultimate destination", title: "Frankl's critique", body: `Frankl argued self-actualization is a *side effect* of self-transcendence: like happiness, it eludes direct pursuit. Research on "the paradox of happiness" (Mauss et al., 2011) finds valuing happiness too much can reduce it.` },
    { anchor: "self-actualization is not enough", title: "Maslow's late turn", body: `In "The Farther Reaches of Human Nature" (1969) and "Theory Z," Maslow described "transcenders" who have frequent peak experiences and orient to values beyond self ("Being-values"). He helped found transpersonal psychology.` },
    { anchor: "I did it to be myself", title: "Self-interest and altruism", body: `Psychology debates "pure" altruism (Batson's empathy–altruism hypothesis) vs. egoistic motives. Strickland dissolves the dichotomy. Research on prosocial spending (Dunn, Aknin & Norton, 2008) finds giving boosts the giver's happiness.` },

SG.fill("situated", "ch13", {
  thesis: "Grit grows best in good situations, and good situations multiply. Add one arrow from response back to situation, and the Three Boxes become a flywheel of compounding advantage.",
  overview: `**Cody Coleman** was born in a jail to a mother with mental illness, raised by a struggling grandmother in a chaotic house full of animals that aggravated his asthma. He became an MIT graduate with a 4.9 GPA, a Stanford PhD in computer science (the first Black recipient in nearly two decades), and CEO of an AI startup. On a napkin he drew why it "doesn't make sense": a straight line couldn't get him there; an **exponential curve** could. His TEDx talk contrasts "life on paper" with "the life you actually live": headwinds and tailwinds, his brother Shawn, his trig teacher Chantel Smith ("Mom"), his drama teacher Norm. His dissertation acknowledgments thank over two hundred people. He was not lucky; he was a paragon of **situational agency**: school breakfasts and computer labs, a dorm room "palace," phone in another room, Post-its, a move to San Jose.

**Situation multiplication.** Add an arrow from Box Three back to Box One: how you behave changes your next situation. Better situation → better thoughts → effort → small wins → better situation. "Situational advantage begets situational advantage." Duckworth's daughter **Amanda** failed her first two algebra tests (40%, 54%). Her dad brought scrap paper and coached; Mr. Taranta offered a retake; she made the kitchen a sanctuary and zipped her phone in a coat pocket. She aced the retake, earned an A, did math for fun, and graduated from Harvard in applied math.

**What makes you stronger.** Taylor Swift's "The Best Day": what doesn't kill you makes you stronger when you have unconditional support. Cody: "Grit is like a muscle. It gets stronger… Each situation was better than the last."`,
  voice: `When I met Cody Coleman, I saw the embodiment of grit. Now I see more: someone who, at critical moments, navigated toward situations in which passion and perseverance paid off.

Here's the adjustment to the Three Boxes that explains how a slight improvement today becomes massive change over time: your response changes your next situation. A good situation leads to better thoughts and effort, which lead to small wins, which attract better mentors and peers, which make a better situation. Like money in the bank, the value of a positive situation compounds.

I saw this flywheel spin under my own roof, when a twelve-year-old who failed two math tests ended up majoring in applied math. If you zoom in, it's a story of grit. If you zoom out, it's an ode to the people and places that bring out your best. Grit does grow, but not because suffering makes you stronger. It grows because each situation is better than the last.`,
  quotes: [

  diagrams: ["flywheel", "curves"],
  sections: [
    { key: "_open", title: "Opening: Cody Coleman", gist: "From jail birth and a chaotic home to MIT, Stanford and Coactive AI; the napkin sketch; the TEDx talk on two lives; headwinds and tailwinds; Shawn, Chantel, Norm; his space, peers, mentors and culture.", idea: "Only when we become situationally aware do we see the complete picture.", q: "Draw your own napkin curve. Where did it bend upward, and why?", terms: ["situational-agency", "mentor-magnet", "survivorship-bias"] },
    { title: "Situation Multiplication", gist: "The fourth arrow: Box Three back to Box One; the flywheel; Cody's compounding; Amanda's algebra comeback with her father, Mr. Taranta, a quiet kitchen and a phone in the closet.", idea: "Situational advantage begets situational advantage.", q: "What small situational improvement could start a flywheel in your life this month?", terms: ["flywheel", "self-efficacy", "physical-distance"] },
    { title: "What Makes You Stronger", gist: "Taylor Swift's \"The Best Day\" and her mother's support; Cody: \"Grit is like a muscle… Each situation was better than the last.\"", idea: "What doesn't kill you makes you stronger when you have unconditional support.", q: "Was your growth driven more by adversity or by support?", terms: ["grit", "sweet-spot", "learned-helplessness"] },
  ],
  origins: `**Cumulative advantage.** Merton's Matthew effect (1968); Stanovich's reading research (1986); DiPrete & Eirich (2006); Dickens & Flynn's (2001) social multiplier model, the closest formal analog to Duckworth's flywheel.

**Resilience research.** Ann Masten's "ordinary magic" (2001): resilience usually comes from ordinary protective systems (caring adults, competent schools, opportunities to succeed) rather than rare traits. The Kauai longitudinal study (Werner & Smith) found that resilient children typically had at least one caring adult outside the family.

**"Steeling" vs. support.** *Grit* Ch. 9 discussed Steve Maier's finding that mastered adversity can protect. Mark Seery's research (2010) found moderate lifetime adversity predicted better well-being than none or high adversity. Duckworth's final emphasis is on support.

**Jim Collins**'s "flywheel" (*Good to Great*, 2001) supplies the metaphor and, with the chapter title, a wink.`,
  evidence: [
    { cite: "Cody Coleman's TEDx Stanford talk and interviews; his dissertation acknowledgments", note: "A single life story, rich in mechanism. Illustrative." },
    { cite: "Kalyani (2024), \"Uneven innovation in the U.S.,\" St. Louis Fed *Economic Synopses*", note: "Patent concentration by area. Supports the culture claim about San Jose." },
    { cite: "Amanda Duckworth's essay (family source)", note: "Memoir-level evidence; a vivid case of the flywheel." },
    { cite: "Dickens & Flynn (2001), \"Heritability estimates versus large environmental effects,\" *Psychological Review*", note: "Companion reading (not cited in the book): a formal model of how small advantages are amplified by matching environments." },
    { cite: "Masten (2001), \"Ordinary magic: Resilience processes in development,\" *American Psychologist*", note: "Companion reading: resilience as the product of common protective systems, which matches Cody's tailwinds." },
  ],
  debates: `**Exceptional cases.** Cody is extraordinary. For every Cody, many children with similar starts don't reach MIT. The flywheel explains *how* advantage compounds, and that same logic predicts that disadvantage compounds too. This is the strongest argument for Part 3's situational responsibility: interrupting negative flywheels early.

**Does grit grow through adversity?** Cody says not because of more adversity but because of better situations. Research is mixed. Moderate, controllable challenges can build resilience (Seery; Maier's controllability findings), while chronic uncontrollable adversity harms development (toxic stress; Shonkoff). Duckworth's position, challenge plus support, fits both.

**Agency or luck?** Duckworth insists Cody's tailwinds "weren't happy accidents." Some were his choices, such as reaching out to mentors. Some were luck: an encouraging brother, a teacher who took him in. Distinguishing them is hard. Robert Frank's work argues people systematically underweight luck in their own success stories.

**Amanda's story and privilege.** Her support (two highly educated parents, a math-tutoring father, a strong school) is the kind of situation many children lack. Duckworth tells it as a parent, but it also illustrates why opportunity gaps compound.`,
  people: [

  annotations: [
    { anchor: "the Three Boxes model offers an explanation", title: "Reciprocal determinism", body: `The feedback arrow is Bandura's **reciprocal determinism** (1978): person, behavior and environment mutually influence each other. It is also the transactional model of development (Sameroff, 1975): children shape their environments, which then shape them.` },
    { anchor: "the first Black recipient in nearly two decades", title: "Representation and pipelines", body: `Black students earn a small share of US CS PhDs. Research on "leaky pipelines" emphasizes situational factors: advising, belonging, funding, and peer networks (e.g., the role of mentoring in persistence; Estrada et al., 2018).` },
    { anchor: "Grit explains my life", title: "The mentor-magnet email", body: `Cody's first email models what Ch. 8 recommends: introduce yourself, connect to the mentor's work, and offer to help. It is a curiosity conversation request with an offer of value.` },
    { anchor: "There’s our life on paper", title: "Résumé vs. eulogy", body: `David Brooks's "résumé virtues vs. eulogy virtues" and the sociology of the CV both note that paper records erase the supports behind achievements. Acknowledgments sections are where the situation becomes visible.` },
    { anchor: "the headwinds of poverty and disadvantage", title: "Headwinds/tailwinds asymmetry", body: `Davidai & Gilovich (2016) found people notice their headwinds more than their tailwinds: we feel obstacles vividly and take advantages for granted. Cody's talk deliberately makes tailwinds visible.` },
    { anchor: "Rather than returning to where he was born and raised", title: "Innovation geography", body: `Innovation is highly concentrated: a handful of metro areas account for most US patents and venture capital. Moretti's "great divergence" describes how such hubs pull ahead, an agglomeration flywheel at the scale of cities.` },
    { anchor: "situational advantage begets situational advantage", title: "Social multipliers", body: `Dickens & Flynn showed how a small genetic or environmental edge leads people into richer environments (more practice, better teachers, smarter peers), multiplying the initial difference. The same model explains how a sports-loving child becomes a better athlete and why environments can produce huge gains like the Flynn effect.` },
    { anchor: "scoring 40% on the first and 54% on the second", title: "Early failure and identity", body: `Research on "stereotype threat" and on "belonging uncertainty" (Walton & Cohen, 2007) shows early setbacks can trigger identity conclusions ("I'm not a math person"). Brief interventions that reframe setbacks as normal and temporary improved persistence and grades.` },
    { anchor: "Retake the test this weekend", title: "Mastery grading", body: `Mr. Taranta's retake reflects mastery-based (standards-based) grading, which lets students demonstrate learning after failure. It operationalizes a growth-mindset culture (Ch. 10), turning failure into feedback.` },
    { anchor: "your failures do not define you", title: "Attributions after failure", body: `Weiner's attribution theory predicts that attributing failure to unstable, controllable causes (effort, strategy) sustains motivation. Amanda's story shows how a situation (a retake, a coach, a quiet room) makes those attributions believable.` },

SG.fill("situated", "epilogue", {
  thesis: "Taking the situation seriously yields two gifts, humility and hope. Duckworth's mother's story shows both: grit thwarted by circumstance, then fulfilled at 87 in a room of her own.",
  overview: `Duckworth's mother, Theresa, was the oldest of eleven, born in Nanjing in 1935. War meant seven schools before sixth grade. Her mother traded her books for paintbrushes, and art became her dream. In Taiwan, an art teacher and then the painter **Chu Teh-Chun** (Ch. 9) told her she was special. She became the first in her family to immigrate to the US, with no money, little English, and grit. In Philadelphia, a professor told her "Paint like yourself," and she painted the mountain island with sailboats that now hangs over Duckworth's bed.

Then the detour: marriage, three children, needlepoint canvases, a wholesale business run for four decades "long after we really needed the money." Year after year she asked for one Christmas gift, selling the business, and got a mink coat. Duckworth, who witnessed it all, didn't see the tragedy until she read Virginia Woolf: every writer needs "a room of one's own," "with a lock on the door." Grit isn't enough. Your situation must be your ally.

After her husband retired she sold the business and painted again. At 87, months after the snorkeling accident, she rented an extra room with light and a lock. At 91 she paints there still: "When I paint, I forget that I am old." Duckworth now sees the painting differently: her mother is the brave little boat, and "the sails are full, so [the tailwinds] must be there… Mom's always been gritty. Now, at long last, she's also situated."`,
  voice: `What do you get when you take the situation seriously? Two gifts: humility and hope.

Humility, because I grew up watching my gritty mother's dream of art be stifled by circumstances, and I didn't see it. Nobody in our house cleared a corner for her paints or offered to do the dishes so she could work. Her situation was as powerful as the tide, and just as easy to overlook.

Hope, because it's never too late. At eighty-seven my mother finally got a room of her own, with natural light and a lock on the door, and she is painting there today. The little sailboat in her painting is her. You can't see the tailwinds, but the sails are full, and she's not alone.`,
  quotes: [
    { text: "What do you get when you take the power of the situation seriously? Two gifts. First, humility. Second, hope." },

  origins: `**Virginia Woolf**, *A Room of One's Own* (1929), argued women's creative output was limited not by talent but by material conditions: money and private space. It is one of the great situational arguments in literature. **Gendered labor** research (Hochschild's *The Second Shift*) documents how domestic and emotional labor fall disproportionately on women, constraining their time for their own work. **Late-life creativity** research (Simonton; Galenson's "old masters and young geniuses") shows many artists, especially experimental "seekers," do their best work late.`,
  evidence: [

    { cite: "Family history and conversations", note: "Memoir." },
    { cite: "Galenson (2006), *Old Masters and Young Geniuses*", note: "Companion reading (not cited): many artists peak late, which supports Duckworth's \"your best art is in front of you.\"" },
  ],
  debates: `The epilogue is less an argument than a coda, but it raises the book's deepest tension. Theresa had abundant grit, and still her situation, shaped by her husband's choices, the economy and gender norms, thwarted her for decades. Is situational agency enough when others control your situation? Her eventual freedom depended on her husband's retirement ("he allowed her"). That makes situational *responsibility*, others making room, at least as important as personal agency. The epilogue's honesty about her family's failure ("we didn't even clear our own dishes") is Duckworth's own application of Part 3.`,
  people: [["Virginia Woolf", "*A Room of One's Own*."], ["Arlie Hochschild", "*The Second Shift*."], ["David Galenson", "Late-blooming creativity."], ["Chu Teh-Chun", "Theresa's teacher, who reappears from Ch. 9."]],
  why: `It brings the book home: the people we love are in situations we help create. Clearing a corner, taking the dishes, giving the time: these are the smallest acts of situational responsibility.`,
  terms: ["situational-awareness", "situational-agency", "situational-responsibility", "grit"],
  questions: {
    comprehension: ["Trace the situations that supported and thwarted Theresa's art at each stage.", "Why does Duckworth invoke Virginia Woolf?", "How does Duckworth reinterpret the sailboat painting?"],
    critical: ["Theresa's freedom came when her husband \"allowed\" her to sell the business. What does that say about the limits of individual situational agency?", "Does this story strengthen or complicate the claim, from Part 2, that \"there's almost always something you can\" change?"],
    personal: ["Is there someone in your household who needs \"a room of their own\"? What could you change this week?"],
    club: ["Why end a book about achievement with an 87-year-old's art room?", "What are the two gifts of taking situations seriously, and which do you need more?"],
  },
  annotations: [
    { anchor: "First, humility. Second, hope.", title: "Two virtues", body: `Humility here is epistemic: recognizing how much of success and failure is situational. Research on intellectual humility (Leary et al., 2017) links it to openness and better judgment. Hope, in Snyder's model, is "pathways and agency," which maps neatly onto situational agency.` },
    { anchor: "Paint like yourself", title: "Authentic style", body: `Chu Teh-Chun's style blended Chinese ink traditions with Western abstraction. Theresa's breakthrough follows the same path: a mentor's permission to bring her own tradition, a mentor who "believes" in Ch. 8's sense.` },
    { anchor: "Year after year, he bought me a new mink coat instead", title: "Who controls the situation?", body: `This is the hardest moment in the book. It shows situational agency's limit when someone else holds the levers. Economists and sociologists study intra-household bargaining power, and it shaped Theresa's choices for decades.` },
    { anchor: "Ideally, a room with", title: "A Room of One's Own", body: `Woolf's two requirements were £500 a year (money) and a room with a lock (space). She imagined "Shakespeare's sister," as gifted as he but blocked by circumstance. It is an early and eloquent version of the Lost Einsteins argument.` },
    { anchor: "In other words, grit isn’t enough", title: "The thesis, in a life", body: `The epilogue restates the book's claim with its most personal evidence. Note the four elements in Duckworth's list: personal space, mentors, peers, and culture. The book's architecture is folded into one sentence.` },
    { anchor: "When I paint, I forget that I am old", title: "Flow in late life", body: `Csikszentmihalyi found flow experiences are possible across the lifespan and are linked to well-being. Studies of older artists and "creative aging" programs (Cohen, 2006) find benefits for health and mood.` },
    { anchor: "Now, at long last, she’s also situated", title: "The final word", body: `Notice it is "also." The book ends where it began: grit plus situation. It is Lewin's B = f(P, E), told as a mother's life.` },
  ],
});

/* Grit: Preface and Part I (What Grit Is and Why It Matters). */
SG.books.grit.about = `*Grit: The Power of Passion and Perseverance* (2016) made Angela Duckworth's research famous. Its argument: in the long run, **grit** (passion and perseverance for long-term goals) may matter more than talent, and grit can grow.

**Part I** defines grit, shows it predicting who persists (West Point, the Spelling Bee, sales, schools), argues we are "distracted by talent" and that "effort counts twice," and offers the Grit Scale. **Part II** grows grit "from the inside out" through four psychological assets: **interest, practice, purpose, and hope**. **Part III** grows it "from the outside in" through wise parenting, extracurricular "playing fields," and cultures of grit, the seed of *Situated*.

Read it now with the debates in mind: the overlap with conscientiousness, measurement limits, and the critique that grit talk can individualize structural problems. All of these are covered in this companion's guides and in "Before You Begin."`;

    { title: "Scott Barry Kaufman", gist: "Special education after a bad IQ test; a teacher's belief; cello eight hours a day; \"At what point does achievement trump potential?\"; opera to psychology at Carnegie Mellon.", idea: "A teacher who believed in him changed his trajectory.", q: "Who first asked \"Who knows what you can do?\" about you?", terms: ["pygmalion-effect", "mentor"] },

  ],
  origins: `**Galton vs. Darwin** is the founding debate of differential psychology. **James** (1907) is the founding statement of the gap between potential and use. **Tsay & Banaji** (2011) and Tsay (2016) documented the naturalness bias. **The War for Talent** (Michaels, Handfield-Jones & Axelrod, 2001) and **Gladwell**'s "The Talent Myth" (New Yorker, 2002) frame the business critique. **Kaufman**'s later work (*Ungifted*, 2013) develops his story.`,
  evidence: [
    { cite: "Tsay & Banaji (2011), \"Naturals and strivers,\" *JESP*; Tsay (2016), *PSPB*", note: "Controlled experiments: identical performances, different labels. Robust demonstrations of a stated–revealed preference gap." },

    { cite: "Darwin's letter to Galton (1869)", note: "Historical source; Darwin's self-assessment from his *Autobiography*." },

  debates: `**Talent is real.** Cognitive ability strongly predicts job performance and learning (Schmidt & Hunter, 1998), and gifted-education research (Lubinski & Benbow's SMPY) finds that talent identified early predicts eminent achievement decades later, even among the top 1%. Duckworth agrees talent matters. Her claim is about over-weighting and its side effects.

**Tracking.** Debates over gifted programs and tracking are heated. Research finds mixed effects of ability grouping, with gains for high achievers in some designs and losses or no change for others, and identification often biased by test access and teacher referral (Card & Giuliano, 2016: universal screening increased identification of disadvantaged students).

**Enron's lesson.** Was Enron's failure about a talent culture or about fraud, incentives and leadership? Gladwell's account is one reading. Organizational research on "forced ranking" (e.g., Scullen et al., 2005) finds initial gains that decline quickly.`,
  people: [["Francis Galton", "*Hereditary Genius*; eugenics' founder, a troubling legacy."], ["Charles Darwin", "Zeal and hard work."], ["William James", "\"The Energies of Men.\""], ["Chia-Jung Tsay", "Naturalness bias."], ["Scott Barry Kaufman", "*Ungifted*; *Transcend*."], ["David Lubinski & Camilla Benbow", "SMPY: longitudinal evidence that early talent predicts achievement."]],

  questions: {

  annotations: [
    { anchor: "Talent for math was different from excelling in math class", title: "Ability vs. achievement", body: `Educational research distinguishes ability tests from achievement tests. Self-discipline predicted report-card grades better than IQ in Duckworth & Seligman (2005), while IQ better predicted standardized test scores. Effort shows up most in cumulative, effortful outcomes.` },
    { anchor: "I’d been distracted by talent", title: "Teacher expectations", body: `Teacher judgments of ability are fairly accurate on average but can be biased by early impressions and stereotypes, and initial impressions can stick (Jussim & Harber, 2005).` },
    { anchor: "excepting fools, men did not differ much in intellect, only in zeal and hard work", title: "Darwin's humility", body: `Darwin's contemporaries considered him brilliant. His self-description reflects Victorian modesty as much as accuracy. The point survives: sustained, curious attention was his signature.` },
    { anchor: "Compared with what we ought to be, we are only half awake", title: "James's energies", body: `James wrote "The Energies of Men" (1907) as a presidential address. He argued most people habitually use a fraction of their capacity and that crises, ideas, and "excitements" unlock more, an early situational theory of effort.` },
    { anchor: "the point of indifference between a striver and a natural", title: "Pricing a bias", body: `Translating a bias into money and years is a powerful experimental technique: it shows the bias has real economic consequences.` },
    { anchor: "a hidden prejudice against those who’ve achieved what they have because they worked for it", title: "Effort heuristics", body: `People sometimes infer *more* value from effort (the "effort heuristic," Kruger et al., 2004), so the naturalness bias is domain-specific, strongest when judging potential or talent.` },
    { anchor: "that expectation becomes a self-fulfilling prophecy", title: "Expectancy effects", body: `See [[pygmalion-effect]] for the current evidence. The effects are real but modest, and stronger when early impressions form.` },

    { anchor: "talent is great, but tests of talent stink", title: "Measurement error", body: `Every test has error. A single cutoff misclassifies children near the threshold. Duckworth's own retest is an example. Universal screening and multiple measures reduce error and bias.` },

SG.fill("grit", "ch03", {
  thesis: "Talent × effort = skill; skill × effort = achievement. Effort counts twice, and showing up again tomorrow matters most.",
  overview: `Sociologist **Dan Chambliss**'s "The Mundanity of Excellence" found that superlative performance is a confluence of many small, drilled skills. "Greatness is doable." **Nietzsche** explained our preference for magic: "our vanity, our self-love, promotes the cult of the genius," because if genius is divine, "here there is no need to compete."

Pushed by Marty Seligman ("You don't have a theory"), Duckworth wrote two equations: **talent × effort = skill** and **skill × effort = achievement**. She notes that opportunities like a great coach "matter tremendously, too, and maybe more than anything about the individual," but her theory leaves them out. Examples: potter **Warren MacKenzie** ("The first 10,000 pots are difficult"); **John Irving**, severely dyslexic, for whom rewriting became an advantage; **Will Smith** ("I'm not afraid to die on a treadmill"), and the Harvard Treadmill Test, where run time at 20 predicted psychological adjustment decades later (George Vaillant). Woody Allen: "Eighty percent of success in life is showing up." The bigger point is getting back on the treadmill the next day. "Without effort, your talent is nothing more than your unmet potential."`,
  voice: `When we can't see how someone got so good, we call it talent. It's flattering and it lets us off the hook, because if they're divine, we don't have to compete. But look closely and excellence is mundane: many small things done well, consistently.

So here is my theory. Talent is how fast your skill grows with effort. Achievement is what you produce with that skill, which also takes effort. Effort counts twice. Someone twice as talented but half as hardworking may reach the same skill and still accomplish far less. Most of all, what matters is not how hard you push on one day but whether you come back the next.`,
  quotes: [
    { text: "Without effort, your talent is nothing more than your unmet potential." },
    { text: "But effort factors into the calculations twice, not once." },
  ],
  diagrams: ["effort-twice"],
  sections: [
    { title: "Talent everywhere", gist: "The press's reflexive \"talent\" labels; Bill vs. Hillary Clinton as natural vs. striver; Duckworth catches herself saying \"What a genius!\"", q: "When did you last call someone a genius? What did you skip over?", terms: ["talent", "naturalness-bias"] },
    { title: "The mundanity of excellence", gist: "Dan Chambliss's six years with swimmers; excellence as many small skills drilled into habit; talent as a mystifying lay explanation; the social world of swimmers (parents, money, pools, coaches); Spitz \"is a fish.\"", idea: "Greatness is many individual feats, each of them doable.", q: "Break down a skill you admire into its \"mundane\" components.", terms: ["mundanity-excellence", "talent"] },
    { title: "Nietzsche and the cult of genius", gist: "\"With everything perfect, we do not ask how it came to be\"; genius as an excuse not to compete; great people as craftsmen.", idea: "Mythologizing talent lets us off the hook.", q: "Do you secretly prefer to believe some people are just born great? Why?", terms: ["talent"] },
    { title: "\"You don't have a theory\"", gist: "Marty Seligman's critique; tears; the start of a decade of work on the psychology of achievement.", q: "What feedback hurt but changed your work?", terms: ["mentor"] },
    { title: "Two equations", gist: "Talent × effort = skill; skill × effort = achievement; opportunities and luck acknowledged but excluded.", idea: "Effort counts twice.", q: "What does the theory deliberately leave out, and why does it matter?", terms: ["effort-counts-twice", "talent"] },
    { title: "Warren MacKenzie's pots", gist: "A potter's daily practice; forty or fifty pots a day, few great; \"The first 10,000 pots are difficult.\"", q: "What's your craft's equivalent of 10,000 pots?", terms: ["effort-counts-twice", "deliberate-practice"] },
    { title: "John Irving", gist: "Not a natural: C− English, low SAT verbal, severe dyslexia; rewriting as his strength; \"I began to take my lack of talent seriously.\"", idea: "Early struggle can teach the stamina to revise.", q: "Has a weakness ever become a working advantage for you?", terms: ["talent", "perseverance"] },
    { title: "Will Smith and the treadmill", gist: "\"I'm not afraid to die on a treadmill\"; the 1940 Harvard Treadmill Test; George Vaillant's finding that run time predicted adult adjustment; Vaillant's own grit in one domain.", q: "In what domain are you a Vaillant: persistent there, if not in crosswords?", terms: ["perseverance", "grit"] },
    { title: "Showing up, again", gist: "Woody Allen's \"showing up\"; a better grit test is whether you come back to the treadmill; unused home exercise equipment; quitting too early and too often.", idea: "Consistency of effort over the long run is everything.", q: "What did you start with excitement and quit at the first plateau?", terms: ["grit", "habit"] },
    { title: "Talent half, effort double", gist: "Twice as talented, half as hardworking → same skill, less achievement; Will Smith on talent vs. skill.", idea: "Without effort, your talent is nothing more than your unmet potential.", q: "Do the math for yourself: where would doubling effort matter most?", terms: ["effort-counts-twice"] },
  ],
  origins: `**Chambliss (1989)** is a classic qualitative study. **Nietzsche**'s remarks are from *Human, All Too Human* (1878). The **two equations** were published in Duckworth & Eskreis-Winkler and colleagues' work on the psychology of achievement. The **Harvard Grant Study** (Vaillant, *Triumphs of Experience*, 2012) is the longest longitudinal study of adult development, notably all-male and all-Harvard in its original cohort.`,
  evidence: [

  debates: `**Is the model right?** Multiplicative models imply zero effort yields zero skill, which is reasonable, and that talent and effort are independent inputs. In reality, talent affects effort (fast learners enjoy learning more), and effort is shaped by situations: coaches, opportunities, incentives. Duckworth explicitly brackets "outside forces," and *Situated* reopens that bracket.

**Practice explains part, not all.** See [[deliberate-practice]] and Macnamara et al. (2014): practice explains a substantial but not dominant share of skill differences, more in structured domains like games and music than in professions.

**Chambliss's social world.** Chambliss stressed that swimmers' excellence depended on clubs, coaches and money, which is an argument for situations. *Grit* emphasizes the mundanity, and *Situated* later the social world.`,

  terms: ["effort-counts-twice", "talent", "mundanity-excellence", "deliberate-practice", "perseverance", "habit"],
  questions: {

  annotations: [
    { anchor: "the most dazzling human achievements are, in fact, the aggregate of countless individual elements", title: "Chunking and expertise", body: `Cognitive research on expertise (Chase & Simon, 1973, chess) shows experts perceive and act in "chunks" built from many small learned patterns. Mundane parts, assembled.` },
    { anchor: "Our vanity, our self-love, promotes the cult of the genius", title: "Self-protective attributions", body: `Social comparison research finds people protect self-esteem by attributing others' superior performance to innate gifts, which makes comparison irrelevant (Alicke et al., 1997, the "genius effect").` },
    { anchor: "You don’t have a theory for the psychology of achievement", title: "Theory in psychology", body: `Seligman's critique reflects a longstanding complaint that psychology accumulates findings without strong theory (Meehl, 1978). Duckworth's equations are a deliberately simple formal model.` },
    { anchor: "matter tremendously, too, and maybe more than anything about the individual", title: "The seed of Situated", body: `Here, in 2016, Duckworth concedes that opportunities like a great coach may matter more than anything about the individual, then sets them aside. *Situated* is, in effect, the book about this sentence.` },
    { anchor: "But effort factors into the calculations twice, not once", title: "Compounding", body: `Because effort multiplies at two stages, small differences in daily effort compound into large differences in lifetime output. That is a forerunner of *Situated*'s flywheel, but located in the person.` },
    { anchor: "The first 10,000 pots are difficult", title: "Volume and quality", body: `Simonton's equal-odds rule: across a career, a creator's proportion of hits is roughly constant, so total hits scale with total output.` },
    { anchor: "I began to take my lack of talent seriously", title: "Compensation", body: `"Desirable difficulties" research (Bjork) suggests some struggles improve long-term learning. Compensatory effort in dyslexia is well documented; many successful dyslexic adults report developing persistence and strategies.` },
    { anchor: "I’m not afraid to die on a treadmill", title: "Endurance as persistence", body: `Lab "persistence" tasks (unsolvable anagrams, handgrip) are used as behavioral measures of self-control and grit, but they correlate only weakly with questionnaire measures, a classic measurement puzzle.` },
    { anchor: "run time in the Treadmill Test at age twenty was a surprisingly reliable predictor", title: "Grant Study caveats", body: `The sample (268 Harvard men, 1939–44) limits generalization. The finding is suggestive of a stable trait of persistence, or of fitness-related health factors only partly adjusted for.` },
    { anchor: "Eighty percent of success in life is showing up", title: "Showing up", body: `Attendance and persistence are strong predictors of educational outcomes. Chronic absenteeism predicts dropout. Attendance is also highly situational: transportation, health and school climate shape it.` },
    { anchor: "Without effort, your talent is nothing more than your unmet potential", title: "Potential realized", body: `Economists model skills as built by investment: "skills beget skills" (Cunha & Heckman, 2007). Their dynamic complementarity, where early skills make later investment more productive, is a formal version of effort counting twice.` },

SG.fill("grit", "ch04", {
  thesis: "Grit is stamina, not intensity: falling in love with a top-level goal and staying in love. Passion is consistency over time, organized by a goal hierarchy whose low-level goals are written in pencil.",
  overview: `Duckworth tells an eager entrepreneur that grit is "more about stamina than intensity": "not just falling in love—staying in love." Then the **Grit Scale** (ten items, five passion and five perseverance) and her prediction that your perseverance score beats your passion score.

**Passion as a compass.** Passion in her sense is consistency, not fireworks. "Enthusiasm is common. Endurance is rare." Jeff Gettleman built his passion, living in East Africa, step by step, with journalism as the means.

**Goal hierarchies.** Pete Carroll's "life philosophy" sits at the top of a goal hierarchy; Tom Seaver's pitching organized his whole life. Lack of grit shows up as top goals without means ("positive fantasizing"), mid-level goals without a top goal, or competing hierarchies. Buffett's 25-goal exercise needs one more step: "To what extent do these goals serve a common purpose?"

**Ink and pencil.** Top goals in ink, low-level goals in pencil. Bob Mankoff submitted some 2,000 rejected cartoons before his first *New Yorker* sale and advises batches of ten "because… nine out of ten things never work out."

**Catharine Cox** (1926) studied 301 geniuses: IQ barely separated the most from the least eminent, but **"persistence of motive"** did. "High but not the highest intelligence, combined with the greatest degree of persistence," wins.`,
  voice: `Grit isn't just working incredibly hard. It's working on something you care about so much that you stay loyal to it, not just falling in love but staying in love. That's why my scale asks about consistency, not intensity. Enthusiasm is common. Endurance is rare.

Think of your goals as a hierarchy. At the top is your compass, the thing that matters for its own sake. Below are means, which you should swap when they fail. Write the top goal in ink and the rest in pencil. Gritty people get rejected constantly; they just don't change compasses.`,
  quotes: [
    { text: "Enthusiasm is common. Endurance is rare." },

    { title: "The Grit Scale", gist: "Ten items (odd = passion, reverse-scored; even = perseverance); scoring and norms; perseverance usually exceeds passion. In the Read tab, click the numbers to score yourself.", q: "Was your perseverance score higher than your passion score?", terms: ["grit-scale", "reference-bias"] },

    { title: "Catharine Cox's 301 geniuses", gist: "Estimated IQs of eminent figures; IQ barely separates First Ten from Last Ten; \"persistence of motive\" does.", idea: "High but not the highest intelligence, plus the greatest persistence.", q: "Why might historiometric estimates be unreliable?", terms: ["grit", "talent"] },

  origins: `**Goal-systems theory** (Carver & Scheier; Kruglanski), **Oettingen**'s research on positive fantasies vs. mental contrasting (WOOP), **Cox** (1926) *The Early Mental Traits of Three Hundred Geniuses*, part of Terman's *Genetic Studies of Genius*. The **Grit Scale** items here mix Grit-O and Grit-S.`,

  debates: `**Is consistency always good?** David Epstein's *Range* (2019) argues many high achievers sampled widely before specializing, and that early, narrow commitment can be a mistake in "wicked" learning environments. Duckworth's own path (consulting, teaching, neuroscience) and Gettleman's winding road fit "explore, then commit." The goal hierarchy reconciles them: exploration at lower levels, consistency at the top, once found.

  annotations: [
    { anchor: "grit is more about stamina than intensity", title: "Stamina vs. intensity", body: `Motivation science separates goal *intensity* (effort per unit time) from goal *persistence* (duration). They have different predictors. Persistence is more sensitive to goal value and expectancy over time.` },
    { anchor: "but not just falling in love—staying in love", title: "Harmonious passion", body: `Vallerand's research: harmonious passion, freely integrated into identity, predicts sustained engagement and well-being; obsessive passion predicts rigid persistence and burnout.` },
    { anchor: "a wee bit higher than your passion score", title: "Facet differences", body: `Mean differences between facets are common in self-report, partly because perseverance items are socially desirable and phrased positively, while passion items are reverse-scored.` },

    { anchor: "the highest-level goal gets written in ink", title: "Equifinality", body: `Goal-systems theory: when a goal has many substitutable means ("equifinality"), people persist at the goal by switching means. That is grit at the top, flexibility below.` },
