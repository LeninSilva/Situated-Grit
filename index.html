  annotations: [
    { anchor: "your personality has range", title: "Density distributions", body: `Fleeson (2001) found that the typical person's within-week spread in, say, extraversion was about as large as the spread between people's averages, yet weekly averages correlated highly from week to week. Both "traits are real" and "behavior is situational" are true. Whole trait theory (Fleeson & Jayawickreme, 2015) models traits as distributions plus the processes that move you within them.` },
    { anchor: "situational Achilles’ heel", title: "Domain-specific self-control", body: `Tsukayama, Duckworth & Kim (2012) showed impulsivity is partly domain-specific: someone may resist food but not online shopping, because domains differ in how tempting they are *to that person* and how harmful they think the temptation is. Situational fixes therefore need to be personalized.` },
    { anchor: "Most research shows that the situation matters at least as much as the person", title: "How big are situational effects?", body: `Funder & Ozer (1983) converted classic situational experiments (Milgram, bystander studies) into correlations of roughly .30–.40, the same range as trait–behavior correlations. Richard, Bond & Stokes-Zoota's (2003) synthesis of a century of social psychology found an average effect of r ≈ .21. "At least as much" is defensible. "Much more" would not be.` },
    { anchor: "We are more unlike ourselves", title: "Montaigne's line", body: `Duckworth translates it herself: "Et se trouve autant de difference de nous à nous mesmes, que de nous à autruy." There is as much difference between us and ourselves as between us and others. It is a 16th-century statement of Fleeson's finding.` },
    { anchor: "insufficiently sensitive to the impact of situational factors", title: "Ross's last word", body: `In his 2018 retrospective Ross went further, proposing a "truly fundamental attribution error": people assume they see the world objectively (naive realism), so others who disagree must be biased. That has implications for polarization and for the Thanksgiving brother-in-law of Ch. 2.` },
    { anchor: "like a phone camera in portrait mode", title: "Figure–ground perception", body: `Gestalt psychologists (Rubin's vase, 1915) showed perception splits scenes into figure and ground. Attention research finds backgrounds are processed but suppressed. Gilbert & Malone (1995) list "lack of awareness" of situational constraints as the first cause of the correspondence bias. The perceptual account is plausible, though the bias also has motivational and cultural roots.` },
    { anchor: "show no consistency from team to team", title: "Stability as a test of attribution", body: `A neat method: a skill that belongs to the person should be stable when the person changes context. Air yards travel with the quarterback; yards-after-catch don't. Sports analytics uses this logic constantly (e.g., "stickiness" of stats). Organizational research does too, for example star analysts whose performance drops after switching firms (Groysberg, *Chasing Stars*, 2010).` },
    { anchor: "I’m really a product of what I’ve been around", title: "Groysberg's portable stars", body: `Boris Groysberg found star equity analysts who moved firms saw performance fall, unless they moved with their teams or to firms with better resources. Much "talent" is firm-specific capital: colleagues, systems, data. It is a corporate version of the quarterback finding.` },
    { anchor: "It is important to me that those who know me can predict what I will do", title: "Preference for consistency", body: `From Cialdini, Trost & Newsom's (1995) Preference for Consistency scale. High scorers are more susceptible to foot-in-the-door techniques: once committed, they comply to stay consistent. Duckworth inverts the usual valuation. Rigid consistency can be a vulnerability.` },
    { anchor: "Personalities can shift drastically and holistically", title: "Modes vs. schemas", body: `Early cognitive therapy targeted *schemas*, enduring belief structures. Beck's mode theory (1996) bundles cognition, affect, motivation and behavior into configurations that activate together, closer to network models of personality and to "state" views of psychopathology. It moves therapy from editing beliefs to engineering activating situations.` },
    { anchor: "going to McDonald’s for a hamburger", title: "Asset-based care", body: `CT-R asks about interests and values ("What did you enjoy?") rather than starting with symptoms. It belongs to a broader shift toward strengths-based and recovery models in psychiatry. In Three Boxes terms, the therapist changes Box One (an outing, a role, a kitchen) to evoke an adaptive Box Two.` },
    { anchor: "there is a bias toward fixing people, rather than fixing the job situation", title: "Individual vs. organizational fixes", body: `Meta-analyses of physician burnout (Panagioti et al., 2017) find organization-directed interventions (workload, scheduling, teamwork) outperform individual-directed ones (mindfulness, resilience training). It is a direct empirical case for situational responsibility (Part 3).` },
    { anchor: "It raises the ceiling on your expectations and builds the floor", title: "Wise feedback", body: `Yeager et al. (2014) gave students critical essay feedback with a note: "I'm giving you these comments because I have very high expectations and I know that you can reach them." Revision rates rose, especially among Black students who might otherwise mistrust the feedback. It is the sweet spot in a single sentence.` },
    { anchor: "The one you feed", title: "About the parable", body: `Often presented as Cherokee folklore, the "two wolves" story's earliest traceable versions come from 20th-century Christian evangelical writing. Its Native American attribution is likely apocryphal. Duckworth's note says she retells Beck's version. As a metaphor it fits the chapter: which "mode" grows depends on which situations you keep entering.` },
  ],
});

SG.fill("situated", "ch04", {
  thesis: "Changing your situation to change yourself often feels like cheating, because we moralize willpower. In fact it is honest, effective, and even heroic.",
  overview: `Pediatrician and writer **Aaron Carroll** delayed antidepressants and then GLP-1 weight-loss drugs because using them "felt like an admission of failure… like cheating." **Oprah Winfrey** said the same about GLP-1s ("I've got to do it the hard way"), then: "It quiets the food noise." Duckworth argues medication is a **Box One** change. We live in an obesogenic environment of ultraprocessed food; a drug deliberately introduced to reduce the situation's grip on thought is situational agency.

Why the shame? Research shows we **worship willpower**. Medication users are judged as having poorer character; people who use apps or accountability partners are seen as less trustworthy; teens give friends smart situational advice but tell themselves "suck it up." From Plato's charioteer to Samuel Smiles's *Self-Help*, Kipling's "If—," *Rocky*, and "JUST DO IT," culture celebrates effort without help. The **Strategy Beliefs Scale** measures this confusion.

Then the forgotten hero: **Roger Barker**, whose Midwest Field Station in Kansas showed "places 'do' things to people." Behavior settings coerce: "In the drugstore: Click! People behave drugstore." His work faded because it seemed to deny agency. Val Curtis revived it, and kitchen makeovers in Nepal raised safe-food practices from 1% to 43%. Duckworth closes by annotating the **Serenity Prayer**: you can't change your genes or birthplace, but you can change what's in your personal space and who you're with. "Can we learn to worship strategy as much as strength?"`,
  voice: `It can seem braver to ask "What's wrong with me?" than "What's wrong with my situation?" I understand the instinct. Most of us equate self-control with willpower and willpower with character, so needing help feels like failing a moral test.

I want to change that intuition. When the environment is engineered against you, as our food environment is, a medication or a different setting is not a shortcut. It is strategy. The research is clear that we judge people who use strategies harshly, and that we judge ourselves the same way. That's why so many of us cling to the least effective approach.

Roger Barker saw seventy years ago that places require certain behavior, and that understanding behavior settings gives people power over the environment that has so coercive an influence on them. Controlling the controllables should include your situation. Sun Tzu said the supreme art of war is to win without fighting. I'd like us to admire the person who walks down another street as much as the one who keeps climbing out of the hole.`,

  origins: `**Moralizing self-control** has deep roots. Plato's *Phaedrus* chariot and Aristotle's distinction between the *enkratic* (self-controlled by effort) and the *temperate* (not tempted) person; Victorian character ideals (Smiles, *Self-Help*, 1859); and the American bootstraps ethos.

**Social psychology of strategy use.** Recent experiments show observers penalize people who rely on external aids. Scott & Landy's work on medication and moral character; Kristal & Zlatev (2024) on commitment devices; Gennara, Peetz & Milyavskaya on "strategy beliefs." Duckworth's lab adds "situation neglect" (in preparation).

**Ecological psychology.** Roger Barker (with Herbert Wright and Louise Barker) founded the Midwest Psychological Field Station in 1947. Classic outputs: *One Boy's Day* (1951), *Midwest and Its Children* (1955), *Big School, Small School* (1964), *Ecological Psychology* (1968). Val Curtis (London School of Hygiene & Tropical Medicine, d. 2021) built "Behaviour Centred Design" on Barker's settings.`,

  debates: `**Is medication really \"situational\"?** Duckworth's reclassification is philosophically interesting. A drug changes your physiology, which is arguably *you*, not your surroundings. One could say it changes Box Two's inputs from inside the body. The underlying point stands either way: a deliberate, upstream change that reduces the need for in-the-moment resistance shouldn't be stigmatized. Bioethicists debate the related "enhancement vs. treatment" distinction and whether "authentic" achievement requires unaided effort (Sandel, *The Case Against Perfection*, 2007, argues for an ethic of "giftedness").

**Is moralizing willpower irrational?** Some philosophers defend admiring effort. Effortful resistance can express commitment, and relying on external constraints can erode the capacity to self-govern. Others (Gendler; Kennett & Smith) argue the wise agent arranges her circumstances. Aristotle ranked the temperate person, who isn't tempted, above the enkratic person, who resists.

**Barker's legacy.** Barker's methods were labor-intensive and his theory under-specified individual differences within settings. Its modern revival comes through smartphone sensing, place-based public health, and the built-environment research of Ch. 9.

**GLP-1 debates.** Long-term safety, regain after discontinuation, cost and access are open. Unequal access means "situational agency" through medication is unevenly distributed.`,

  annotations: [
    { anchor: "felt like an admission of failure", title: "Moral identity and help-seeking", body: `Help-seeking research finds people avoid help when it threatens self-image, especially in cultures and professions that prize self-reliance (physicians are a well-studied example). Stigma reduces treatment-seeking for depression worldwide (Clement et al., 2015, meta-analysis).` },
    { anchor: "the obesogenic environment in which most of us now reside", title: "An engineered environment", body: `Coined by Swinburn et al. (1999). Kevin Hall's inpatient trial (2019) is the cleanest situational evidence: the same people ate ~500 kcal/day more on an ultraprocessed diet than on an unprocessed one matched for offered nutrients.` },
    { anchor: "precipitate a dopamine response similar to nicotine", title: "A contested comparison", body: `Some neuroimaging studies show overlapping reward responses for palatable food and drugs, and the Yale Food Addiction Scale is widely used. But "food addiction" isn't a formal diagnosis, and the strength of the analogy is debated (Hebebrand et al., 2014, argue for "eating addiction" as a behavior rather than a substance).` },
    { anchor: "but I believe it is", title: "Treatment, enhancement, and the self", body: `Bioethics debates whether medical interventions that change motivation or mood threaten "authenticity." Some argue medication can *restore* a person's authentic self (Kramer's *Listening to Prozac*, 1993, and responses). Duckworth's framing sidesteps authenticity by focusing on effectiveness and the strategic logic of Box One.` },
    { anchor: "five times more likely to", title: "Stated vs. revealed strategy", body: `People's stated beliefs and actual practices diverge here, as with the "naturalness bias" in *Grit* Ch. 2: people *say* effort matters most but *favor* naturals. In both books, Duckworth uses a gap between what people say and do to expose a hidden cultural value.` },
    { anchor: "we tend to automatically assume that person is less trustworthy", title: "Why commitment devices carry a stigma", body: `Kristal & Zlatev suggest observers infer the user would otherwise misbehave, so the device reveals a weakness. Signaling theory predicts this: unobserved virtue is assumed; visible safeguards suggest something needed guarding. One fix is cultural norms that treat strategy as competence, like a pilot's checklist.` },
    { anchor: "using my willpower alone", title: "Identity-based motivation", body: `People choose actions that fit who they want to be (Oyserman's identity-based motivation). If "a strong person" is defined as someone who needs no help, situational strategies feel identity-inconsistent. Redefining the identity ("strategic people set themselves up") may be the lever.` },
    { anchor: "difficult and unpleasant task", title: "Plato's charioteer", body: `In the *Phaedrus*, the soul is a charioteer (reason) driving a noble horse (spirit) and an unruly horse (appetite). Self-control is a struggle of reins. Aristotle's *Nicomachean Ethics* VII ranks the temperate person, who doesn't feel the pull, above the self-controlled one who must fight it. That classical argument supports Duckworth.` },
    { anchor: "Help from without is often enfeebling", title: "Self-Help and the bootstrap ethic", body: `Smiles's *Self-Help* (1859) sold widely in Victorian Britain and abroad and helped define the self-made-man ideal. Historians link this ethos to attitudes toward poverty relief: individual character rather than circumstance. Chapter 12's argument about poverty programs is a modern reply.` },
    { anchor: "They require certain behavior", title: "Behavior settings, defined", body: `Barker's settings have a *standing pattern of behavior* attached to a *milieu* (time and place), with a "synomorphic" fit between them. Settings are maintained by "control circuits": deviation-countering (correcting deviants) and vetoing (ejecting them).` },
    { anchor: "then the setting vetoes you", title: "Program, deviation, veto", body: `Barker's "undermanning" theory adds a twist. In settings with too few people for their roles (small schools, small towns), each person is pulled into more roles and responsibilities. Barker & Gump (1964) found students in small high schools participated in more activities and reported more responsibility. Settings can make people bigger, not just conform.` },
    { anchor: "as the cell concept does in biology", title: "Why the field faded", body: `Besides the agency worry Duckworth suggests, ecological psychology lost out to the lab-experiment paradigm of the "cognitive revolution," which was cheaper and faster to publish. Its descendants include Bronfenbrenner's ecological systems theory and today's smartphone-based "ecological momentary assessment."` },
    { anchor: "his research seemed to question the very idea of human agency", title: "Situationism and responsibility", body: `This worry recurs in philosophy. If situations drive behavior, does moral responsibility survive? Strawson-style compatibilists say responsibility depends on responsiveness to reasons, not freedom from causes. Duckworth's answer is practical: if settings shape us, our agency lies in choosing and designing settings.` },
    { anchor: "from just 1 percent at baseline to 43 percent", title: "A big effect, read carefully", body: `The outcome is the share of mothers performing *all five* target behaviors, a demanding composite, which inflates percentage changes from a low base. Individual behaviors improved too. The trial combined several components: pledges, social events, physical cues. That is typical of "Behaviour Centred Design," which treats behavior as embedded in settings.` },
    { anchor: "dignity through environmentalism", title: "Respect and responsibility", body: `Willems's phrase anticipates Part 3's claim that helping by changing situations "shows respect." Political philosophers debate the converse too: does attributing outcomes to environments deny people credit and dignity for their choices? (Compare luck egalitarianism and its critics.)` },
    { anchor: "Because these nuances bring humility and hope in equal measure", title: "The 2×2 of control", body: `Duckworth's annotation crosses two distinctions: person vs. situation, and controllable vs. not. Reappraisal research (Troy et al., 2013) gives the matching rule: accept and reappraise when circumstances are uncontrollable, change them when they are controllable.` },
    { anchor: "The supreme art of war is to subdue the enemy without fighting", title: "Strategy from strategos", body: `Sun Tzu's *Art of War* (c. 5th century BCE) prizes positioning over force: shape conditions so that victory is easy. Military theorists call this "indirect approach" (Liddell Hart). Duckworth's point is that the situational strategist does the same with her own impulses.` },
    { anchor: "I walk down another street", title: "Five chapters, three boxes", body: `Read the poem through the model. Chapters I–III are Box Three (falling in, climbing out) with growing awareness. Chapter IV is situation modification (walking around). Chapter V is situation selection (another street). Selection is the most upstream strategy in Gross's model.` },
  ],
});

  overview: `A memoir chapter in three acts. **Act I: Just Try Harder (40 years).** Duckworth grows up equating achievement with her father's approval. He told her she was "no genius," and his own life was a testament of effort. Trying hard works: calculus, cheerleading, Harvard, consulting, teaching, a PhD, and a marriage to Jason, another striver.

  origins: `This chapter has no endnotes. It is memoir, and its evidential role is illustrative. But it echoes several research traditions:

  overview: `Jerry Seinfeld's "Night Guy always screws Morning Guy" introduces the **intention–action gap**: people fail to act on nearly half their intentions. Seinfeld himself, a "game of tonnage" writer, says the key is to "build a system," and Duckworth adds that a good system lives *outside* your head.

Why the gap? An **empathy gap** between selves. George Loewenstein's "I could do that again!" moment on a Pittsburgh hill; smokers most pessimistic about resisting cravings were the ones who stayed quit, because they changed their situations. **Thomas Schelling** prescribed "little tricks" and Odysseus's mast. **Richard Thaler**'s Planner and Doer led to **nudges**: water at eye level, default retirement enrollment, slower elevators, rumble strips, the Schiphol urinal fly, and 300+ government nudge units. Behavior Change for Good's megastudies scale nudges to millions. You can "nudge thyself."

The goal is **habits**, which are cue–response links built by repeating the same behavior in the same situation. Three design rules follow. **Make it obvious** (external cues defeat forgetting: the blue dot, Gawande's checklists, Post-its, Bruce Lee's cards). **Make it easy** (friction down for goals, as with Alistair Brownlee's warm shoes; friction up for temptations, as with the One Sec app's 57% drop). **Make it rewarding** (choose enjoyable exercise, temptation bundling, grayscale phones). And one rule does all three: **physical distance creates psychological distance**. Your personal space is about three feet in every direction, and teens who kept phones farther away had higher GPAs. "You worship what you sit next to."`,
  voice: `One version of you makes great plans, and a different version has to carry them out. That gap between intention and action isn't a character flaw. It's an empathy gap between selves. The calm self who resolves to exercise can't feel what the tired self will feel at 6 a.m.

You can't bridge that gap by resolving harder. You bridge it by changing the physical world your future self will walk into. Make the right action obvious with a cue they can't miss. Make it easy, and make the wrong action hard. Make it rewarding now, not someday. Do that in the same place again and again, and your brain eventually takes over: the situation triggers the action with no deliberation at all.

    { cite: "Kirgios et al. (2020), \"Teaching temptation bundling to boost exercise,\" *OBHDP*", note: "Large field experiment; about a 10% increase in gym visits. Modest but durable for weeks." },
    { cite: "Lee, …, Duckworth, \"The farther the phone, the higher the GPA\" (manuscript in preparation)", note: "Correlational; not yet peer-reviewed. Consistent with the \"brain drain\" lab study (Ward et al., 2017), where a phone's mere presence reduced working-memory capacity, though that lab finding has had mixed replications." },

  debates: `**How big are nudge effects, really?** DellaVigna & Linos (2022) found the average nudge in academic journals moved behavior about 8.7 percentage points, but the average in government nudge units' full portfolios was about 1.4 points. Most of the gap reflects publication bias. Self-nudging may differ, since you choose nudges that fit you, but the caution applies to the book's percentages too.

**Habit formation isn't fast or uniform.** Lally et al.'s median of 66 days (range 18–254) means "make it a habit" can take months, and complex behaviors (exercise) automatize more slowly than simple ones (drinking water).

**Phones and attention.** The "mere presence" effect (Ward et al., 2017) had mixed replications, and correlational GPA data can't rule out that more conscientious students keep phones away. The proposed mechanism (distance → less temptation) is plausible and the recommendation is cheap.

**Food-environment studies.** Some influential "mindless eating" work by Brian Wansink was retracted. Independent studies (e.g., Hunter et al., 2019) still support proximity effects, but be choosy about sources.

**Ethics of nudging.** Self-nudging sidesteps paternalism, since you are your own choice architect. Nudge units raise questions of transparency and consent (Sunstein, 2016; Hausman & Welch, 2010).`,

  annotations: [
    { anchor: "nearly half of their intentions", title: "Sizing the gap", body: `Sheeran & Webb (2016) estimate roughly 47% of intentions go unacted on. Webb & Sheeran's (2006) meta-analysis of experiments found that changing intentions by a medium-to-large amount changed behavior by only a small-to-medium amount (d≈0.36). Implementation intentions ("If X, then Y") are among the best-supported gap-closers.` },
    { anchor: "It’s a game of tonnage", title: "Quantity and quality", body: `Seinfeld's "tonnage" echoes *Grit*'s "effort counts twice" and Dean Keith Simonton's equal-odds rule: creators' hit rates are fairly constant, so prolific creators produce more hits. Quantity and quality are linked through volume.` },
    { anchor: "a good system is not in your head but outside of it", title: "Extended mind", body: `Philosophers Clark & Chalmers (1998) argued that notebooks and tools can be literal parts of cognition, the "extended mind." Duckworth's systems are extended *self-control*: commitments stored in the environment rather than in memory or resolve.` },
    { anchor: "The problem, it turns out, is empathy", title: "Projection bias", body: `Economists formalize this as **projection bias** (Loewenstein, O'Donoghue & Rabin, 2003): people project current states onto future preferences. Field evidence includes more cold-weather clothing returned when ordered on cold days, and over-buying while hungry.` },
    { anchor: "I could do that again!", title: "Hot–cold gaps in memory", body: `People also underestimate *past* visceral states. That is why pain and exhaustion are remembered as milder (see also Kahneman's peak-end rule). The cold self is a poor historian of the hot self.` },
    { anchor: "Paradoxically, the smokers who were initially more pessimistic", title: "The restraint bias", body: `Nordgren et al. (2009) showed that inflated beliefs in impulse control led people to expose themselves to more temptation and to relapse. Humility about willpower predicts better outcomes because it motivates situation selection.` },
    { anchor: "are in continual contest for control", title: "Schelling's two selves", body: `Schelling's 1980 essay asks which self should be honored when they conflict, the one who wants to quit or the one who wants a cigarette. Philosophers (Parfit; Elster) treat this as a puzzle about personal identity over time. Practically, Schelling sides with the planning self.` },
    { anchor: "physically, tangibly bind yourself to the mast", title: "Commitment devices in the field", body: `Ashraf, Karlan & Yin (2006) offered Filipino savers a locked account; takers saved more. Giné, Karlan & Zinman (2010) found a commitment contract improved smoking cessation. But many people decline commitment devices even when they would help (Laibson, 2015, on why there is so little commitment).` },
    { anchor: "store as much memory as Google does in the cloud", title: "Econs vs. Humans", body: `Thaler's distinction between idealized "Econs" and real "Humans" underlies behavioral economics. Kahneman's System 1/System 2 is the psychological counterpart: fast, automatic processing versus slow, deliberate reasoning.` },
    { anchor: "water bottle purchases increased by 26 percent", title: "Choice architecture in a hospital", body: `Thorndike et al. (2012, 2014) at Massachusetts General combined traffic-light labels with placement. Effects persisted over two years, rare durability for a nudge.` },
    { anchor: "spillage reportedly dropped by around 80 percent", title: "A famous, soft number", body: `The 80% figure for the Schiphol fly is widely repeated from an airport manager's account, not from a controlled study. Duckworth's "reportedly" is appropriate. It is a great illustration and weak evidence.` },
    { anchor: "over three hundred local, state, and federal governments", title: "Nudge units", body: `After the UK Behavioural Insights Team (2010) and the US Social and Behavioral Sciences Team (2015), OECD counts of public-sector behavioral units passed 200 by the late 2010s. DellaVigna & Linos (2022) analyzed 126 RCTs from two US units, the best evidence on real-world nudge effect sizes.` },
    { anchor: "3 million elementary school students", title: "Megastudies at scale", body: `Large samples can detect small effects precisely. Ask both whether an effect is statistically real and whether it is practically meaningful per person.` },
    { anchor: "you can, in effect, nudge thyself", title: "Self-nudging", body: `Reijula & Hertwig (2022) argue self-nudging answers the paternalism critique: citizens use behavioral insights as their own choice architects. It sits between nudges (changing environments for people) and "boosts" (building people's competences).` },
    { anchor: "repetition is necessary but not sufficient", title: "Context stability", body: `Wood, Tam & Witt (2005) studied students transferring universities: habits like exercise survived only when the performance context stayed similar. The habit-discontinuity hypothesis says life transitions are windows for change.` },
    { anchor: "a small blue dot on the computer screen", title: "External cues for prospective memory", body: `Event-based prospective memory (remember to do X when Y happens) is easier than time-based. External cues turn time-based intentions into event-based ones.` },
    { anchor: "the line-infection rate dropped to zero", title: "Checklists and culture", body: `The Johns Hopkins result scaled to Michigan ICUs (Pronovost et al., 2006): infections dropped about 66%. But Ontario's mandated surgical checklist showed no improvement (Urbach et al., 2014). Checklists work through teams that use them, including nurses empowered to stop doctors. That is peers and culture, not paper alone.` },
    { anchor: "people systematically underestimate the influence of friction on behavior", title: "Friction blindness", body: `Mazar et al. (2022, *PNAS*) found Americans underestimated how much distance to the polling place reduces turnout. Ross & Nisbett called such small but potent features "channel factors," one of the main lessons of *The Person and the Situation*.` },
    { anchor: "by 57 percent", title: "A clean field test", body: `The One Sec study used objective logs from thousands of users. Notice the mechanism: a few seconds of delay plus a moment of reflection, which adds friction and turns an automatic act into a deliberate one (Box Two re-engaged).` },
    { anchor: "working out 39 percent more", title: "Intrinsic vs. instrumental", body: `Woolley & Fishbach find immediate rewards (enjoyment) predict persistence better than delayed ones (health), even though people *say* delayed rewards matter more. It connects to *Grit*'s Ch. 6 claim that interest sustains effort.` },
    { anchor: "they went to the gym 10 percent more often", title: "Modest, durable effects", body: `Ten percent is small but meaningful for exercise, and durable for weeks. The original temptation-bundling study (Milkman et al., 2014) found effects faded after a Thanksgiving break: habit formation is fragile to context disruption.` },
    { anchor: "waiting even a few seconds has been shown to make a reward half as powerful", title: "Steep short-delay discounting", body: `Animal studies show very steep discounting over seconds, and human studies with *experienced* rewards (Young et al., 2013) find similar steepness. Web research finds conversion and engagement fall with each added second of load time.` },
    { anchor: "the farther the phone, the higher the GPA", title: "Dose–response, correlational", body: `A graded relationship (a dose–response gradient) strengthens a causal reading but doesn't establish it. Conscientious students may both stash phones and study more. Experimental phone-separation studies in classrooms are the next step. Some school phone bans show modest gains, while others show null effects.` },
    { anchor: "The brain is a stupid little dog that is easily trained", title: "Conditioning", body: `Seinfeld's dog metaphor is classical and operant conditioning. Cues (the jacket) come to elicit states (performance mode), and immediate rewards (the red X) reinforce behavior. "Don't break the chain" works partly through loss aversion: a long streak feels costly to lose.` },
    { anchor: "You worship what you sit next to", title: "Proximity and value", body: `The mere-exposure effect (Zajonc, 1968) shows repeated exposure increases liking. Proximity shapes friendship too (Festinger, Schachter & Back's 1950 dormitory study). What is near us gets our attention, then our affection.` },
  ],
});

SG.fill("situated", "ch07", {
  thesis: "Peers make you better through accountability, learning and solidarity. The real hero's journey runs from \"I\" to \"we,\" so seek like-minded strivers.",
  overview: `Diana Nyad, after four failures, swam from Havana to Key West at 64 with a three-dozen-person crew and the words "it looks like a solitary sport but it takes a team." The chapter's three mechanisms:

**Peer accountability.** De La Salle High School's Spartans (151 straight wins, no recruiting) use **Commitment Cards**: specific goals read aloud, handed to a partner ("I commit this to you. Hold me accountable"), then publicly reviewed a week later with unfiltered peer feedback. It matches the research: audiences raise follow-through (voters told neighbors would learn if they voted turned out more), and face-to-face commitments work best. Duckworth's untested addition is *reciprocity*.

**Peer learning.** Y Combinator's batches (Reddit, Twitch, OpenAI in the first cohort); accelerators work through learning from others; co-founders outperform solo founders; Chariot's founders on Bookface and *havruta* ("Give me havruta or give me death"). Henrich's **collective brain**: humans are smart because we learn from each other. In a "relay" experiment, learners with five models improved, while those with one did not. *Idiot* comes from *idios*, on one's own.

**Peer solidarity.** Duckworth's college roommate Stokely got sober through AA: "Peer pressure!" AA began when Bill W. sought another alcoholic to talk to. Research finds its benefits run through members' social networks shifting toward abstinence. The **superforecasters** (top 2% of forecasters) became about 50% more accurate on teams. "Life is a team sport."`,
  voice: `I wasted too many years as a solo striver. The research is clear, and so is the wisdom of every great team: peers make you better in three ways.

They hold you accountable, and accountability means most when it comes from equals who have stood on both sides of honest feedback. They make you smarter, because no one is smart enough to figure everything out alone. That is what's truly special about our species. And they put you in your place, in the best sense. Belonging to a group draws your attention away from yourself and toward something larger.

So ask yourself: Who are my closest professional peers? How much time do we spend together? Are we making the most of it? If you want to go fast, go alone. If you want to go far, go together.`,

    { text: "The power of we is infinitely stronger than the power of I." },

  sections: [
    { key: "_open", title: "Opening: Diana Nyad's team", gist: "Nyad's fifth attempt and her shift from \"me, me, me\" to \"we did this together\"; the chapter's scope (peers, not friendship); Gallup's \"best friend at work.\"", idea: "The real hero's journey is from \"I\" to \"we.\"", q: "Who are your ten closest professional peers? Is anyone also a close friend?", terms: ["peer-effects"] },
    { title: "Peer Accountability", gist: "Coach Bob Ladouceur's De La Salle Spartans: 151 straight wins, no recruiting; Commitment Cards with measurable goals, a partner, an embrace, and next-week public reporting; peer feedback without defensiveness.", idea: "Feedback is a gift because it is costly on both ends, and it means more from peers.", q: "Why might peer feedback land differently from a boss's or coach's?", terms: ["peer-accountability", "commitment-device"] },
    { title: "I Commit to You; You Commit to Me", gist: "Research on audiences (voter turnout), face-to-face commitment, and Duckworth's untested emphasis on reciprocity; her classroom Commitment Card exercise.", idea: "When I publicly commit to you and you to me, we each try our best.", q: "Try it: write one goal, read it to a partner, and check in next week.", terms: ["peer-accountability"] },
    { title: "Peer Learning", gist: "Buckminster Fuller's DIY ethos vs. Paul Graham's Y Combinator batches; accelerators work through learning from others; co-founders beat solo founders; Chariot and Bookface; havruta.", idea: "Peers make you smarter in ways that eventually dwarf individual ingenuity.", q: "When did a peer save you months of trial and error?", terms: ["collective-brain", "peer-effects"] },
    { title: "The Collective Brain", gist: "Worries about groupthink; the illusion of self-sufficiency; humans vs. chimps at social learning; Henrich's collective brain; the five-models relay experiment; Confucius; *idiot* from *idios*.", idea: "Shared wisdom, not solitary genius, drives most human innovation.", q: "What do you keep trying to figure out alone that someone else already knows?", terms: ["collective-brain", "illusion-self-sufficiency"] },
    { title: "Peer Solidarity", gist: "Stokely Chaffin's sobriety via AA (\"Peer pressure!\"); AA as a fellowship of peers without professionals; the Twelve Steps and Traditions; the Big Book.", idea: "Peers at the heart of recovery.", q: "Why might a group of peers succeed where professionals fail?", terms: ["aa", "peer-effects"] },
    { title: "To Keep It, Give It Away", gist: "Bill W.'s relapse temptation in Akron and his call that led to Dr. Bob; mutual aid; AA's efficacy and its network mechanism; five closest friends take ~40% of social time; Jung's \"protective wall of human community.\"", idea: "Our closest peers define what feels normal.", q: "Which four people most define \"normal\" for you?", terms: ["aa", "social-norms"] },
    { title: "Teams Make the Best Even Better", gist: "Students' objections to group work; superforecasters, top 2%, put on designed teams of 12: more questions answered, more updating, ~50% more accurate; Elaine Rich triples her hours.", idea: "Well-designed groups beat even the best individuals.", q: "What made your best team experience work, and your worst fail?", terms: ["superforecasting", "social-loafing"] },

  origins: `**Goal setting and public commitment.** Locke & Latham's goal-setting theory (specific, challenging goals work); Cialdini's commitment and consistency; Gerber, Green & Larimer's (2008) social-pressure voting experiment.

**Social learning and cultural evolution.** Bandura's observational learning (1960s–70s); Boyd & Richerson's dual-inheritance theory; Henrich's *Secret of Our Success* (2016); Tomasello's work on shared intentionality and the cultural intelligence hypothesis (Herrmann et al., 2007).

**Entrepreneurship research** on accelerators (Hallen, Cohen & Bingham, 2020) and founding teams (Jin et al., 2017 meta-analysis).

**Addiction recovery.** AA's history (*Pass It On*, 1984); John Kelly's mechanism research at Harvard's Recovery Research Institute; the 2020 Cochrane review.

**Forecasting.** Tetlock's *Expert Political Judgment* (2005) found expert forecasts barely beat chance; the Good Judgment Project then identified and teamed "superforecasters."`,
  evidence: [
    { cite: "Gerber, Green & Larimer (2008), \"Social pressure and voter turnout,\" *American Political Science Review*", note: "A ~180,000-household field experiment. The \"neighbors\" mailer raised turnout about 8 percentage points, roughly a 27% relative increase. Among the strongest field evidence on audiences." },
    { cite: "Epton, Currie & Armitage (2017), \"Unique effects of setting goals on behavior change,\" *JCCP*", note: "Meta-analysis: goal setting changes behavior, with larger effects when goals are public and set face to face." },
    { cite: "Hallen, Cohen & Bingham (2020), \"Do accelerators work? If so, how?,\" *Organization Science*", note: "Top accelerators speed venture development through \"interorganizational learning\" from peers and mentors." },
    { cite: "Muthukrishna et al. (2014), \"Sociality influences cultural complexity,\" *Proc. R. Soc. B*", note: "Lab \"transmission chain\" experiment. Learning from more models improved skill across generations." },
    { cite: "Kelly et al. (2012), \"Determining the relative importance of the mechanisms of behavior change within AA,\" *Addiction*", note: "Social-network change was the strongest mediator of AA's benefit, especially for young adults." },
    { cite: "Kelly, Humphreys & Ferri (2020), Cochrane Review of AA and twelve-step facilitation", note: "Manualized AA/TSF interventions produced higher continuous abstinence than other established treatments, with comparable results on other outcomes. Duckworth's \"superior to any other treatment\" is a strong reading." },
    { cite: "Mellers et al. (2014, 2015), *Psychological Science*; *Perspectives on Psychological Science*", note: "Training, teaming and tracking improved forecasting accuracy. Teams were designed with norms for independent thinking and generosity." },
  ],
  debates: `**Peer effects are real but tricky to measure.** Homophily (we befriend people like us) and shared environments masquerade as influence. Randomized designs (roommates, military postings) show real but usually modest and domain-specific effects (Sacerdote, 2014). Christakis & Fowler's network "contagion" claims drew strong methodological criticism.

**Groups can make people worse.** Social loafing, groupthink (Janis), polarization, and peer contagion in deviant groups: Dishion, McCord & Poulin (1999) found that grouping high-risk adolescents together *increased* problem behavior. The superforecaster teams worked because they were designed: independence, diversity, generosity, accountability. Duckworth's "pick wisely" matters as much as "pick peers."

**AA's evidence.** The Cochrane review is strong, but AA attendance is self-selected and dropout is high. The network mechanism suggests what to replicate in secular groups (SMART Recovery, recovery communities).

**Reciprocity untested.** Duckworth flags mutual accountability as her hypothesis. That is a good research question for the group.`,

  annotations: [
    { anchor: "If you want to go far, go together", title: "Proverb provenance", body: `Often called an "African proverb," this saying's origin is uncertain; researchers have not traced it reliably to any specific African language. The idea is well supported though. Teams increasingly dominate high-impact science and patents (Wuchty, Jones & Uzzi, 2007).` },
    { anchor: "Do you have a best friend at work?", title: "Gallup's Q12", body: `This item from Gallup's Q12 engagement survey predicts outcomes like safety and retention at the team level. It is often mocked as unprofessional, but research on workplace friendship links it to engagement and lower turnover.` },
    { anchor: "Hold me accountable", title: "Commitment Card anatomy", body: `Each element maps to research. Specific, measurable goals (Locke & Latham). Public declaration (Cialdini's consistency principle). A named partner (social accountability). Face to face (Epton et al., 2017). A follow-up report (feedback). And reciprocity (norm of reciprocity; Gouldner, 1960).` },
    { anchor: "that endows feedback with value", title: "Costly signals", body: `In signaling theory, costly signals are credible because they are costly. Feedback that is uncomfortable to give signals care and honesty. It parallels Kim Scott's Radical Candor and Yeager's "wise feedback."` },
    { anchor: "increased voter turnout by 27 percent", title: "Relative vs. absolute", body: `The "Neighbors" mailer raised turnout from about 29.7% (control) to 37.8%, an 8.1-point absolute increase, roughly 27% relative. Both numbers are worth knowing when discussing effect sizes.` },
    { anchor: "As far as I know, no scientist has tested the added value of reciprocity", title: "An open hypothesis", body: `Notice Duckworth marks this as conjecture. A study could randomize one-way vs. mutual accountability partners. Related research on "giving advice" found advisors' own motivation increased (Eskreis-Winkler et al., 2019, cited in Ch. 6), which suggests a mechanism: holding others accountable may hold you accountable.` },
    { anchor: "they bloom like dying plants given water", title: "Ambition clusters", body: `Graham's observation fits agglomeration economics (Ch. 9) and the "Lost Einsteins" exposure finding: people become what they're surrounded by.` },
    { anchor: "Entrepreneurs with nearly identical credentials", title: "Selection vs. treatment in accelerators", body: `Accelerators select promising founders, so comparing participants with non-participants confounds selection. Hallen et al. used matched comparisons to address it. Some studies use acceptance-threshold designs (regression discontinuity) for stronger causal claims.` },
    { anchor: "Two scholars sharpen one another", title: "Havruta", body: `Traditional Jewish paired study, often loud and argumentative, of Talmud and Torah. Educational research on peer instruction (Mazur's "Peer Instruction" in physics) finds students learn more from explaining to and debating with peers than from lecture alone.` },
    { anchor: "it’s unlikely we’ll stumble on the solution by ourselves", title: "The search-space argument", body: `For complex problems, the space of possible solutions is enormous, and individual trial and error is slow and costly. Social learning lets populations accumulate solutions no individual could find. That is the core of cumulative cultural evolution.` },
    { anchor: "toddlers learn effortlessly, whereas chimps and orangutans learn almost nothing", title: "Cultural intelligence hypothesis", body: `Herrmann et al. (2007) tested 2.5-year-old children and great apes on a battery of tasks. Physical cognition was similar, but children far outperformed apes on social learning, communication and theory of mind. Humans' distinctive intelligence is social.` },
    { anchor: "even the weakest performer in the five-model group outperformed the best in the one-model group", title: "Population size and complexity", body: `It is a lab analog of the claim that larger, better-connected populations sustain more complex technology. Field evidence is debated (e.g., the Tasmanian loss of technologies after isolation; analyses of Oceanic toolkits by Kline & Boyd, 2010). The lab finding itself is robust.` },
    { anchor: "derives from the ancient Greek term", title: "Idiōtēs", body: `In Athens an *idiōtēs* was a private person who didn't take part in public life. The word's later meaning ("fool") reflected the civic view that withdrawing from the collective was a failing.` },
    { anchor: "Peer pressure!", title: "Positive peer pressure", body: `"Peer pressure" usually connotes harm, but the same mechanism (social norms and approval) can support health. Social-norms interventions and recovery communities use it deliberately.` },
    { anchor: "The long-term efficacy of AA has proven to be superior to any other treatment", title: "Reading the Cochrane review", body: `The 2020 Cochrane review (27 studies, 10,565 participants) found manualized AA/TSF was more effective than other established treatments (like CBT) for continuous abstinence, and comparable on other measures, at lower health-care cost. "Superior" holds for abstinence, while "any other treatment" is broader than the review's comparisons.` },
    { anchor: "particularly the four most important people in their lives", title: "Social networks as mechanism", body: `Kelly et al. tracked members' important network members over time. Adding abstainers and removing heavy drinkers mediated AA's effect. Research on social network therapy and community reinforcement (CRAFT) applies the same idea in clinical settings.` },
    { anchor: "of time spent socializing", title: "Dunbar's layers", body: `Robin Dunbar's research identifies nested layers of relationships (~5, 15, 50, 150), each with roughly constant total time investment. The innermost 5 get about 40% of social time. Influence is concentrated in a very small circle.` },
    { anchor: "the opposite of addiction isn’t sobriety—it’s connection", title: "A popular phrase", body: `Popularized by Johann Hari (2015), drawing on Bruce Alexander's "Rat Park" experiments (1978–81), where isolated rats consumed more morphine than rats in enriched colonies. Rat Park's replications were mixed, but social context's role in addiction is well supported (Ch. 9's Vietnam study).` },
    { anchor: "groups can lead to social loafing", title: "When groups fail", body: `Classic group-process losses: loafing (Latané et al., 1979), production blocking in brainstorming (Diehl & Stroebe, 1987), conformity (Asch), groupthink (Janis). Aggregating *independent* judgments, the "wisdom of crowds," avoids many of these. Superforecaster teams combined independent first judgments with discussion.` },
    { anchor: "leading to forecasts that were 50 percent more accurate", title: "How accuracy was measured", body: `Forecasting accuracy in the Good Judgment Project used Brier scores, the squared difference between probability forecasts and outcomes. Percentage improvements in Brier scores aren't intuitive, so read "50 percent more accurate" as a substantial improvement in a scoring rule, not "right 50% more often."` },
    { anchor: "To love and be loved is to feel the sun from both sides", title: "Solidarity and meaning", body: `Belonging is a fundamental need (Baumeister & Leary, 1995). Social isolation's mortality risk is comparable to that of established risk factors (Holt-Lunstad et al., 2010, cited in the endnotes).` },
  ],
});

SG.fill("situated", "ch08", {
  thesis: "Mentors are a need-to-have: they teach, they believe, and they open doors. Anyone can become a \"mentor magnet\" by seeking mentors for a reason, a season, and a life.",
  overview: `Mister Rogers's 1997 Emmy speech, ten seconds of silence for "those who have loved us into being," opens the chapter. The evidence: mentorship quality predicts prize-winning science, and a single school mentor raises college attendance.

**Mentors teach.** Anders Ericsson insisted his "10,000 hours" was misunderstood: experts practice *differently*, and deliberate practice "must be designed… in accordance with individualized instruction and guidance of a teacher." Wynton Marsalis's first rule: find an experienced teacher. John Wooden spent 75% of practice teaching, through three-second demonstrations; Bill Walton then sought a mentor to become a broadcaster.

**Mentors believe.** The Pygmalion study's randomly labeled "bloomers" gained IQ points. Duckworth notes open questions but says there's consensus that "self-confidence is not entirely self-generated." Call it *surrogate grit* or the Ted Lasso effect: BELIEVE.

**Mentors open doors.** Marty Seligman introducing Duckworth at West Point and to luminaries; Anindya Kundu's "circle jumping"; Granovetter's weak ties, confirmed causally on LinkedIn with 20 million users.

**Mentor magnets.** 60% of US workers lack a mentor, but mentorship can be cultivated (Chris Gardner: "That it can happen!"). Look nearby (Oprah's fourth-grade teacher Mrs. Duncan). Use Scott Hugo's three scouting questions. Then build three kinds: **for a reason** (Pooja Bavishi's professor and Malai ice cream; curiosity conversations à la Oprah with Maya Angelou, Brian Grazer, Chris Gardner's "What do you do? How do you do it?"), **for a season** (help on a project; "reward the feedback" by overcorrecting), and **for life** (Mentor in the *Odyssey*; a gratitude letter, like Duckworth's to Anders Ericsson, read at his memorial). Then mentor the next generation.`,
  voice: `Most people know mentors are great. Some know they're indispensable. Very few know that anyone can become a mentor magnet. I owe my career to a long line of mentors who taught me, believed in me when I didn't, and opened doors I didn't know existed.

Practice without a teacher is like filling a leaky bucket. Confidence is borrowed more often than we admit. And opportunities come through people who know people. You don't have to wait to be chosen. Introduce yourself. Ask for five minutes. Show up prepared. Act on the feedback, then ask whether you went far enough. Say thank you in writing before it's too late. I waited too long to thank Anders.

Mentors are mortal and flesh and blood, just a few steps further down the path. They are happier to help than you think. And the most important thing you can do as a mentor magnet is mentor someone else.`,
  quotes: [
    { text: "In other words, high-quality practice is precisely the opposite of DIY." },
    { text: "So very often, the inner voice that says, “I can do this!” begins with an outer voice." },
    { text: "Don’t assume that mentors just happen to you. Take responsibility for bringing them into your life." },

  diagrams: ["mentors", "weak-ties"],

    { key: "_open", title: "Opening: Ten seconds of silence", gist: "Mister Rogers's Emmy speech; mentoring's measured effects (prize-winning research; college going); Oprah and Maya Angelou on not making it alone.", idea: "Mentors are a need-to-have, not a nice-to-have, and anyone can attract them.", q: "Take the ten seconds. Who comes to mind?", terms: ["mentor"] },
    { title: "Mentors Teach", gist: "DIY learning's rise; Ericsson's misunderstood 10,000 hours; the three steps of expert practice; the paradox that practice is solitary but designed by a teacher; Wynton Marsalis and \"sheddin'.\"", idea: "High-quality practice is precisely the opposite of DIY.", q: "What are you trying to learn by yourself that a teacher could accelerate?", terms: ["deliberate-practice", "zone-proximal"] },
    { title: "What Would Wooden Do?", gist: "John Wooden the teacher; Gallimore & Tharp's coding (75% teaching; three-second demonstrations); \"The Four Laws of Learning\" poem; Bill Walton's stutter and his broadcasting mentor.", idea: "Mentors teach by explanation, demonstration and correction.", q: "Who taught you by showing rather than telling?", terms: ["mentor", "deliberate-practice"] },
    { title: "Mentors Believe", gist: "Pygmalion in the Classroom; its critics; consensus that confidence is partly borrowed; Ted Lasso's BELIEVE sign; Jason Sudeikis on mentors seeing past your \"baggage.\"", idea: "The inner \"I can do this!\" often begins as a mentor's outer voice.", q: "Whose belief in you changed what you attempted?", terms: ["pygmalion-effect", "self-fulfilling-prophecy", "self-efficacy"] },

    { title: "Mentor Magnets", gist: "How Duckworth recognizes a mentor magnet; 60% of US workers lack a work mentor; shared values over demographic match; mentors' pride; Chris Gardner's journey and insistence that mentorship \"can happen!\"", idea: "Take responsibility for bringing mentors into your life.", q: "By Duckworth's test, are you a mentor magnet? What would change that?", terms: ["mentor-magnet"] },
    { title: "Look in Your Backyard", gist: "Oprah, Barbara Walters, and the surprise reunion with fourth-grade teacher Mary Duncan; relatable mentors; Scott Hugo's three scouting questions.", idea: "The mentors who change your life may be hiding in plain sight.", q: "Apply Scott Hugo's three questions to the people around you this month.", terms: ["mentor"] },
    { title: "Mentors for a Reason", gist: "Pooja Bavishi's \"wild and crazy\" goal map, her professor's nudge to start a dessert business, and Malai.", idea: "One conversation at the right moment can redirect a life.", q: "When did a single comment change your direction?", terms: ["mentor"] },
    { title: "Curiosity Conversations", gist: "Oprah's five minutes with Maya Angelou; Brian Grazer's decades of curiosity conversations; Chris Gardner's Ferrari question: \"What do you do? And how do you do it?\"", idea: "Don't wait for mentors to reach out. Ask for five minutes.", q: "Write the five-minute request you'll send this week.", terms: ["curiosity-conversation"] },
    { title: "Mentors for a Season", gist: "Extend a relationship by helping on a mentor's existing project; Kim Scott's \"reward the feedback\"; Sheryl Sandberg's advice to overcorrect; people underestimate how happy others are to help.", idea: "Reward mentors by visibly benefiting from their advice.", q: "Whose feedback have you received but not yet acted on?", terms: ["mentor-magnet", "radical-candor"] },
    { title: "Mentors for Life", gist: "Mentor in the *Odyssey*; mentors as surrogate parents; the gratitude letter, and Duckworth's to Anders Ericsson, read at his memorial; pay it forward.", idea: "Thank your mentors, then mentor the next generation.", q: "To whom will you write a gratitude letter, and when?", terms: ["gratitude-letter", "mentor"] },

  origins: `**Mentoring research** began with Kathy Kram's interviews of manager pairs (1983, the "most highly cited" study, quoted for a mentor's parental pride) and *Mentoring at Work* (1985). Later work: developmental networks (Higgins & Kram, 2001), sponsorship (Hewlett, 2013), and youth mentoring (Rhodes; DuBois et al. meta-analyses).

**Expertise.** Ericsson, Krampe & Tesch-Römer (1993); Ericsson & Pool, *Peak* (2016); Duckworth's own collaboration with Ericsson on spelling bee practice (2011).

**Expectancy effects.** Merton (1948); Rosenthal & Jacobson (1968); Eden's military Pygmalion studies; Jussim & Harber's (2005) review.

**Network sociology.** Granovetter (1973); Burt's structural holes (1992); Lin's social resources theory; Kundu's ethnographic work on student agency.

**Gratitude.** Emmons & McCullough (2003); Seligman et al. (2005); Kumar & Epley (2018).`,

    { cite: "Eby et al. (2008), \"Does mentoring matter?,\" *Journal of Vocational Behavior*", note: "Multidisciplinary meta-analysis: mentored people fare better across outcomes, though effects are small on average." },

    { cite: "Kraft, Bolves & Hurd (2023), \"How informal mentoring by teachers, counselors, and coaches supports students' long-run academic success,\" *Economics of Education Review*", note: "Add Health data. A teacher/counselor/coach mentor predicts college attendance. Correlational with extensive controls." },
    { cite: "Ericsson (2020), on the criteria for deliberate practice", note: "Ericsson's last sole-authored statement that deliberate practice requires a teacher's individualized design and feedback." },
    { cite: "Gallimore & Tharp (2004), \"What a coach can teach a teacher, 1975–2004,\" *The Sport Psychologist*", note: "Reanalysis of the 1974–75 observation of Wooden's practices: dense, brief instructional acts, many of them demonstrations." },
    { cite: "Rosenthal & Jacobson (1968), \"Pygmalion in the classroom\"; McNatt (2000) meta-analysis", note: "Workplace Pygmalion effects are robust in organizational studies (McNatt), though the original classroom IQ results are contested." },
    { cite: "Granovetter (1973), *AJS*; Rajkumar et al. (2022), *Science*", note: "Weak ties: from survey interviews to a causal, algorithm-randomized test on LinkedIn." },
    { cite: "Kram (1983), \"Phases of the mentor relationship,\" *Academy of Management Journal*", note: "Qualitative study of 18 pairs. The source of initiation–cultivation–separation–redefinition phases." },
    { cite: "Kumar & Epley (2018), \"Undervaluing gratitude,\" *Psychological Science*", note: "Writers underestimate recipients' positive feelings and overestimate their awkwardness." },

  debates: `**Selection in mentoring.** Do mentors cause success, or do successful people attract mentors? Both, which is Duckworth's point about mentor magnets. Formal programs where mentors are assigned show smaller effects than informal relationships (Ragins & Cotton, 1999), consistent with selection and with relationship quality.

**Pygmalion's true size.** Expectancy effects are real but generally small and often short-lived. Teacher expectations are mostly accurate predictions rather than self-fulfilling causes (Jussim & Harber, 2005). Effects may be larger for stigmatized students and when teachers are new to students. Duckworth presents this fairly ("many questions remain open"), and her "surrogate grit" claim is broader than the IQ result.

**Deliberate practice's limits.** Practice explains a substantial but far from complete share of performance (Macnamara et al., 2014). That doesn't undercut the claim that *good* practice is designed by teachers.

**Who gets mentors?** Mentorship and sponsorship are unequally distributed by class, race and gender (Hewlett; Jack's *The Privileged Poor*). "Become a mentor magnet" is empowering advice; institutional design (structured programs, Cleveland Clinic in Ch. 11) addresses the distribution problem.

**Demographic matching.** Duckworth cites evidence that shared values matter more than race or gender for mentoring quality. Other research finds same-race teachers improve outcomes for Black students (Gershenson et al., 2022). Both can be true: similarity in values predicts relationship quality, and representation affects aspiration and expectations.`,

  annotations: [
    { anchor: "who have loved us into being", title: "Mister Rogers's theology of care", body: `Fred Rogers's work drew on child-development training at the University of Pittsburgh with Margaret McFarland. His emphasis on adults' attentive acceptance anticipates attachment research: secure relationships with caregivers support exploration and competence (Bowlby; Ainsworth).` },
    { anchor: "a two-fold to four-fold increase", title: "Prize-winning lineages", body: `Ma, Mukherjee & Uzzi (2020) used genealogy data for STEM scientists. Protégés of prizewinners were more likely to win prizes, especially when they studied different topics than their mentors, suggesting mentors transmit *ways* of doing science rather than topics. Selection remains a confound.` },
    { anchor: "17 percent more likely to make it to college", title: "Informal mentoring", body: `Kraft et al. found the effect concentrated in students from lower-SES families and was strongest for teacher mentors. Natural mentoring research (Rhodes; Van Dam et al., 2018 meta-analysis) finds informal mentors associated with better youth outcomes.` },
    { anchor: "the most important insight of his work had been misunderstood", title: "Gladwell vs. Ericsson", body: `Gladwell's *Outliers* (2008) popularized a "10,000-hour rule." Ericsson & Pool (2016) objected that the number was an average for one group, not a threshold, and that *deliberate* practice, not mere repetition, was the key. Gladwell later clarified that practice doesn't guarantee expertise in every field.` },
    { anchor: "individualized instruction and guidance of a teacher", title: "The teacher clause", body: `Ericsson's definition distinguishes "deliberate practice" (teacher-designed) from "purposeful practice" (self-designed, focused) and "naive practice." Much debate over replications turns on whether studies measured deliberate practice strictly or just counted hours.` },
    { anchor: "high-quality practice is precisely the opposite of DIY", title: "The DIY paradox", body: `Self-directed learning works best with structure. Research on discovery learning (Kirschner, Sweller & Clark, 2006) finds minimally guided instruction is less effective for novices than explicit guidance. The "expertise reversal effect" says that guidance matters most early.` },
    { anchor: "in 75 percent of these interactions, Wooden was teaching", title: "The Wooden study", body: `Tharp & Gallimore's 1976 *Psychology Today* article ("What a coach can teach a teacher") recorded 2,326 acts of teaching; about half were specific instructions. Praise and scolds were each under 10%. Their insight shaped "instructional conversation" research in education.` },
    { anchor: "His demonstrations are rarely longer than three seconds", title: "Modeling", body: `Bandura's observational learning shows people acquire skills by watching models, especially when demonstrations are brief, clear and followed by practice with feedback. Wooden's "show–imitate–correct–repeat" cycle is a textbook sequence.` },
    { anchor: "by an astounding fifteen points", title: "Pygmalion's fragile core", body: `The gains came mainly from first and second graders. Critics (Thorndike, 1968; Snow, 1969) noted implausible IQ scores and unreliable tests for young children. Raudenbush (1984) found effects only when teachers had less than two weeks' prior contact with students. The result is real in some conditions and smaller than its fame.` },
    { anchor: "self-confidence is not entirely self-generated", title: "Sources of self-efficacy", body: `Bandura's "verbal persuasion" source of self-efficacy is weaker than mastery experience, unless it comes from credible, trusted others and is followed by opportunities to succeed. That is what good mentors arrange.` },
    { anchor: "Call it surrogate grit", title: "Borrowed belief", body: `Relationship research on "transactive goal dynamics" (Fitzsimons, Finkel & vanDellen, 2015) argues people in close relationships pursue goals as a system: partners' confidence and effort substitute for and supplement each other.` },
    { anchor: "calls this circle jumping", title: "Structure and agency", body: `Kundu's framework emphasizes agency *within* structure: students exercise agency by leveraging relationships that institutions make available. It is a sociological version of situational agency, and it shows why institutions that create mentoring opportunities matter.` },
    { anchor: "The single most cited study in the history of sociology", title: "Granovetter's influence", body: `"The Strength of Weak Ties" has tens of thousands of citations. Granovetter's later "embeddedness" (1985) argued economic action is embedded in social relations, a foundation of economic sociology.` },
    { anchor: "weak ties were more likely to lead to a new job", title: "The inverted U", body: `Rajkumar et al. (2022) found moderately weak ties (about 10 mutual connections) were most helpful, not the weakest. The effect varied by industry: weak ties mattered more in digital sectors. This is causal evidence because LinkedIn's algorithm randomly varied recommendations.` },
    { anchor: "60 percent of working adults in the United States lack even a single mentor at work", title: "The mentoring gap", body: `Surveys consistently find a gap between how much people value mentors and how many have one. Organizations that create structures (Cleveland Clinic, Ch. 11) narrow the gap. Informal mentoring tends to favor people who resemble the mentor ("homophily"), one argument for formal programs.` },
    { anchor: "better predicted by shared values and interests than either race or gender", title: "Deep- vs. surface-level similarity", body: `Organizational research distinguishes surface-level diversity (demographics) from deep-level similarity (values, attitudes). Over time, deep-level similarity predicts relationship quality more (Harrison, Price & Bell, 1998). Representation still matters for aspiration and expectations (Gershenson et al., 2022, on Black teachers).` },
    { anchor: "In perhaps the most highly cited study on mentoring ever published", title: "Kram's phases", body: `Kram's four phases are initiation, cultivation, separation (structural or psychological), and redefinition into a peer-like friendship or an ending. Her protégé's "graduation" is the separation phase, and the mentor's pride is part of what Erik Erikson called **generativity**, the midlife need to guide the next generation.` },
    { anchor: "That it can happen! That it’s possible!", title: "Beliefs about mentoring", body: `Like growth mindset about ability, beliefs about whether mentoring is attainable may predict help-seeking. Duckworth's mentor-magnet framing is a mindset intervention for networks.` },
    { anchor: "we’re most likely to follow the lead of ordinary people we can relate to", title: "Relatable exemplars", body: `Han et al. (2022) found "attainable" moral exemplars (relatable, ordinary) inspired more prosocial behavior than extraordinary ones. Social comparison research agrees: upward comparisons inspire when the target seems attainable (Lockwood & Kunda, 1997).` },
    { anchor: "until you’ve overcorrected", title: "Acting on feedback", body: `Feedback research (Kluger & DeNisi's 1996 meta-analysis) found about a third of feedback interventions *reduced* performance, often when feedback threatened the self. Reacting with visible action, as Sandberg advised, shifts feedback from threat to collaboration.` },
    { anchor: "People are much happier to help", title: "Underestimating helpers", body: `Flynn & Lake (2008) found people underestimate others' willingness to help by up to 50%. Zhao & Epley (2022) found helpers feel more positive, and less inconvenienced, than help-seekers expect.` },
    { anchor: "to a Greek character of the same name", title: "Mentor in Homer", body: `In the *Odyssey*, Athena often appears in Mentor's form to guide Telemachus, so the archetypal mentor is a goddess in disguise. The modern sense of "mentor" owes much to Fénelon's *Les Aventures de Télémaque* (1699), which made Mentor the hero's wise guide.` },
    { anchor: "gratitude letters have been scientifically proven to make both the sender and the receiver happier", title: "Gratitude interventions", body: `"Proven" is strong. Gratitude interventions show reliable but modest effects on well-being (Davis et al., 2016 meta-analysis), sometimes no larger than active control activities. The specific underestimation effect (Kumar & Epley) is robust.` },
  ],
});

SG.fill("situated", "ch09", {
  thesis: "Culture (\"the way we do things around here\") is among the most powerful forces on behavior, and it is local. Overcome status quo bias and consider changing where you live or work.",
  overview: `Would Taylor Swift be Taylor Swift without Nashville? Duckworth can't know but thinks not: in Wyomissing, music was a hobby; on Music Row it was "in the air." The **Lost Einsteins** study shows children who grow up near inventors become inventors, in the same fields.

**Culture** is language, rituals, artifacts, norms, values and identity, "the way we do things around here." It is powerful. Military families' BMI drifts toward their assigned county's average. "Where one lives matters for when one dies." Most stunning: about one in five soldiers in Vietnam became addicted to heroin, but 95% weren't addicted within a year of returning home. The availability, the peers and the officers had changed. "Our deepest desires are situational" (Rachlin).

**Living longer.** Dan Buettner (Blue Zones, with caveats about how centenarians were counted) says "pick up and move." People who moved to more walkable places took 1,000+ more daily steps. Duckworth's mother-in-law walks a 5K with her walker.

**In the middle of it.** Chu Teh-Chun chose Paris, the agglomeration for art, over Austin, and became the first Chinese-born member of the Académie des Beaux-Arts. **Wherever you go, there you are**? True, but Shepard Siegel advises addicts to "relocate, relocate, relocate."

**Status quo bias.** John Maeda's "Consider moving" unsettled Duckworth. Levitt's coin-flip study: those nudged to change were happier six months later, yet the coin couldn't move people to move. Hurricane Katrina's displaced residents later earned more and lived longer. Overcoming status quo bias takes "situational willpower."

**Culture is local.** Moving countries raises wages (the "place premium"), but microcultures within five miles matter: smoke-free homes, politically active dorms, roommates. The Duckworths moved 5.6 miles to Center City. And you can change where you work: Wegmans store manager Tim Risser on trust, high standards and caring, and sobriety supported by his colleagues. "It's always worse in our heads."`,
  voice: `Where you grow up powerfully influences what you achieve. Where you live shapes how you eat, walk, drink and even how long you live. That's not destiny, because you can choose where to go, but almost nobody wants to hear it. When I suggest moving, people say "I can't," and when I press, "Well, most people can't."

I understand. When John Maeda told me to consider moving, I immediately listed every reason I couldn't. But research says we stick with the status quo far longer than we should, especially when it comes to where we live, and that people pushed to make a change are often happier for it.

You don't have to cross an ocean. Culture is local. Five miles can be a world away, and so can a different employer down the street. Choose a place where the way they do things is the way you want to do things, too. Wherever you go, there you are, so choose where you go wisely.`,
  quotes: [
    { text: "Culture is the way we do things around here." },
    { text: "As a species, we yearn for change but cling to the familiar." },
    { text: "Wherever you go, there you are—so choose where you go wisely." },
  ],
  diagrams: ["culture-onion", "status-quo"],
  sections: [
    { key: "_open", title: "Opening: What if Taylor Swift never moved to Nashville?", gist: "The Lost Einsteins exposure finding; young Taylor's Nashville obsession, Music Row, the family's move at 14, the Bluebird Cafe; Wyomissing vs. Nashville.", idea: "Moving to a place where you think you can achieve your dreams is no guarantee, but place matters.", q: "Is there a \"Nashville\" for what you want to do?", terms: ["lost-einsteins", "agglomeration", "survivorship-bias"] },
    { title: "The Way We Do Things Around Here", gist: "Six ingredients of culture; Barbara Corcoran's \"everybody wants what everybody wants\"; BMI drift on military bases; place and longevity; Lee Robins's Vietnam heroin study; Howard Rachlin: \"our deepest desires are situational.\"", idea: "Any behavior seems natural when it's what everyone around you is doing.", q: "What behavior seems \"natural\" in your workplace that would seem odd elsewhere?", terms: ["culture", "social-norms", "addiction-context", "natural-experiment"] },
    { title: "Living Longer", gist: "Dan Buettner's Blue Zones (and critics); lifestyle habits of the longest-lived; the cell-phone study of movers to walkable cities (+1,000 steps/day); Mah's move and her 5K with a walker.", idea: "Change your environment and a healthy life \"just happens to you.\"", q: "What's your neighborhood's Walk Score? Does it match how you want to live?", terms: ["blue-zones", "natural-experiment"] },
    { title: "In the Middle of It", gist: "Chu Teh-Chun and Tung Ching-Chao choose Paris over Austin; Paris as an agglomeration for art; Chu's success; Austin becoming a tech hub; Duckworth's mother's view.", idea: "In a scene, if you weren't in the middle of it, you were out of it.", q: "Which \"scene\" are you in or out of?", terms: ["agglomeration"] },
    { title: "Wherever You Go", gist: "\"Wherever you go, there you are\"; AA's caution about \"pulling a geographic\"; SNL's Joe Romano; Shepard Siegel's \"relocate, relocate, relocate!\" for drug-paired cues.", idea: "Moving is no miracle cure, but change is easier in some places.", q: "When is moving running away, and when is it wisdom?", terms: ["addiction-context", "habit"] },
    { title: "Status Quo Bias", gist: "Housing costs and falling mobility; immigrants as movers despite low wealth; John Maeda's \"Consider moving\"; Levitt's coin flip; Katrina victims' better earnings and survival; the brain and \"situational willpower.\"", idea: "We yearn for change but cling to the familiar.", q: "What decision have you been \"flipping a coin\" about for too long?", terms: ["status-quo-bias", "default-effect", "natural-experiment"] },
    { title: "Culture Is Local", gist: "The Economist on moving; the place premium (~$14,000); five-mile radius of daily life; smoke-free workplaces and homes; dorm and roommate effects.", idea: "Microcultures are mighty. Even a local move can change your world.", q: "What microculture (team, floor, gym, friend group) is shaping you most?", terms: ["microculture", "place-premium", "peer-effects"] },
    { title: "Five Miles Is a World Away", gist: "The Duckworths move 5.6 miles from Narberth to Center City Philadelphia for diversity, walkability, independence, and friends nearby.", idea: "Overcoming status quo bias marked the start of Act III.", q: "What would you gain and lose by moving five miles?", terms: ["microculture", "status-quo-bias"] },
    { title: "A Great Place to Work", gist: "Workplace trust matters more than salary for life satisfaction; Wegmans manager Tim Risser: values lived, a manager who said \"Go! Get to the hospital!\", support for his sobriety, high standards and caring together.", idea: "Choose a place where the way they do things is the way you want to do things.", q: "Does your workplace pass Tim's test: are the values lived or just posted?", terms: ["culture", "sweet-spot", "why-and-way"] },

  origins: `**Economics of place.** Urban agglomeration (Marshall, 1890; Glaeser; Moretti); the place premium (Clemens, Montenegro & Pritchett, 2019); Chetty's mobility and exposure research; the Lost Einsteins (Bell et al., 2019); Deryugina & Molitor's review of place and health.

  debates: `**Survivorship again.** Taylor Swift, Chu Teh-Chun and Léon Marchand moved and succeeded. Many others moved and didn't. Duckworth flags this ("by no means a guarantee"). The large-sample studies are the real evidence; the stories are illustration.

  thesis: "You are part of other people's situations. Instead of telling people to try harder, ask what situation drives their thoughts and help change it. It works better and it shows respect.",
  partEpigraph: "“Environments shape behavior.” —Bill Strickland",
  overview: `A brief turn outward. Pep talks are the instinctive way to motivate others and rarely work, for the same reason willpower doesn't: they act at Box Three. Instead, ask without judgment which thoughts drive the behavior, and which situation produces those thoughts. Then help: edit their space, connect them to peers, offer or find mentors, help them find a better culture.

"Situational responsibility means doing what you can to set up others for success." It takes more time than a pep talk, but it replaces exasperation ("What's wrong with this person?") with curiosity ("What might be wrong with this person's situation?"). And it "shows respect. It's not the person that needs fixing, it's their situation."`,
