SG.fill("grit", "ch06", {
  thesis: "Passion is rarely a lightning bolt. Interests are triggered by the world, developed with the help of encouraging people, and deepened by finding novelty in nuance.",
  overview: `Commencement speakers say "follow your passion," and research agrees that interest matters: people whose jobs fit their interests are more satisfied and perform better. Yet most people are disengaged at work (Gallup: only 13% worldwide "engaged"). The problem isn't the advice. It's that most people don't *have* a passion to follow, and misunderstand how passions form.

Grit paragons rarely had cinematic epiphanies. Julia Child's sole meunière was a "first kiss," followed by years of markets, cookbooks, Le Cordon Bleu and collaborators. Rowdy Gaines tried five sports first; Marc Vetri chose between music and kitchens. Barry Schwartz compares career-finding to dating: there's no perfect match, and interest grows by "getting elbow-deep."

The science: passion is "a little bit of discovery, followed by a lot of development, and then a lifetime of deepening." Interests emerge around middle school, are **triggered by interactions with the outside world** (not introspection), must be **re-triggered** again and again, and thrive with **a crew of encouraging supporters**. **Before hard work comes play** (Bloom's "early years"; Jean Côté's sampling). Will Shortz's mother turned a bridge-club afternoon into his first crossword and taught him to sell puzzles. Jackie Bezos let Jeff dismantle his crib and made four RadioShack trips a day. Experts like Jane Golden keep interest alive because, as Paul Silvia says, "for the expert, novelty is nuance."`,
  voice: `I believe the data: matching your work to what interests you is a good idea. But most young people don't need to be told to follow their passion. They'd do it in a heartbeat if they had one. What they need is to understand how passions are actually fostered.

  origins: `**Vocational interests** (Holland's RIASEC types; Rounds and Su's meta-analyses on interest fit), **interest development** (Hidi & Renninger's four-phase model; Silvia's appraisal theory of interest), **talent development** (Bloom's 1985 study of 120 world-class performers), **sport development** (Côté's Developmental Model of Sport Participation), and **self-determination theory** (Deci & Ryan) on autonomy and intrinsic motivation.`,

  thesis: "Gritty people practice more and practice differently: deliberate practice to improve weaknesses, which feels effortful, and flow during performance, which feels effortless. Both can be cultivated.",
  overview: `Grittier spellers practiced more, but experience doesn't guarantee improvement ("twenty years of experience" vs. "one year… twenty times"). Grit paragons exude **kaizen**, continuous improvement.

**Anders Ericsson** found experts accumulate around ten thousand hours over about ten years, but, crucially, of **deliberate practice**: a clearly defined stretch goal focused on a weakness, full concentration and effort, immediate and informative feedback, and repetition with reflection and refinement. Duckworth's jogging (no goal, no feedback) explains why she never got faster.

In her Spelling Bee study with Ericsson, deliberate practice (solitary study) predicted advancement better than quizzing or pleasure reading, and grittier kids did more of it, though spellers rated it the most effortful and least enjoyable activity. **Mihaly Csikszentmihalyi** says experts experience **flow**: effortless absorption. The two "debated" politely. Duckworth's resolution: "deliberate practice is for preparation, and flow is for performance," and grittier adults report *more* flow. Her TED talk: hours of awkward rehearsal, then six minutes of flow.

Make practice better. **Know the science.** **Make it a habit**: same time, same place. **Change how it feels**: Tools of the Mind teachers model cheerful mistakes. "That was hard! It was great!"`,

    { anchor: "Kaizen is Japanese for resisting the plateau of arrested development", title: "Kaizen", body: `Kaizen was central to Toyota's production system: small, continuous, often worker-led improvements. Duckworth's use is metaphorical. In organizations, it is a cultural practice, a situation, not just an attitude.` },
    { anchor: "the very best violinists at a German music academy accumulated about ten thousand hours of practice", title: "The violin study", body: `Retrospective estimates of practice hours are prone to recall bias. Macnamara & Maitra's (2019) replication found practice differences but a smaller effect, and that the best group didn't always practice most.` },
    { anchor: "zeroing in on just one narrow aspect of their overall performance", title: "Stretch goals", body: `This is Vygotsky's zone of proximal development in practice terms: just beyond current ability, with feedback. Too far beyond produces frustration; too close produces stagnation.` },
    { anchor: "spellers rated deliberate practice as significantly more effortful, and significantly less enjoyable", title: "The cost of improvement", body: `Effort feels costly (Kurzban's opportunity-cost account). Gritty spellers did more of the unpleasant but effective practice, suggesting grit's mechanism includes tolerating aversive effort for long-term gain.` },
    { anchor: "deliberate practice is for preparation, and flow is for performance", title: "A clean distinction", body: `Elegant, though practice can contain flow and performance can include deliberate elements. Some research finds flow during practice when challenge and skill are well matched.` },
    { anchor: "grittier adults reported experiencing more flow, not less", title: "Cross-sectional survey", body: `Correlational. Gritty people may seek activities that produce flow, or flow may build grit. Either way, grit and enjoyment aren't opposed.` },
    { anchor: "That was hard! It was great!", title: "Reframing effort", body: `Research on "effort beliefs" finds people who see effort as a sign of learning, not inability, persist more. "Productive failure" (Kapur) shows struggle before instruction can deepen learning.` },
  ],
});

SG.fill("grit", "ch08", {
  thesis: "Purpose, the intention to contribute to others' well-being, is the third source of grit. It usually ripens after interest and practice, and it can be cultivated in any job.",
  overview: `"Interest is one source of passion. Purpose… is another." Usually it comes third (Bloom's "later years"). In Duckworth's lexicon purpose means "the intention to contribute to the well-being of others." Aristotle's **eudaimonic** vs. **hedonic** lives: in her survey of 16,000 adults, grittier people scored higher on purpose but no lower on pleasure-seeking. She concedes purpose can be perverted; altruism isn't strictly required for grit.

**The three bricklayers**: a job, a career, a calling. Amy Wrzesniewski finds people sort themselves easily, and that callings depend more on how people see their work than on the job title. Workers with callings miss fewer days; zookeepers with callings sacrifice more. Studs Terkel's interviewees mostly lacked callings ("I don't think I have a calling… except to be me").

Callings can develop: Joe Leader (NYC subway engineer) grew into his. Duckworth's own purpose crystallized at 21 running **Summerbridge**, a free summer program, over her father's objections. Australian entrepreneurs Aurora and Franco Fonte, **Bill Damon**'s research on beyond-the-self purpose, and Cinnabon president Kat Cole (inspired by her mother) show the variety of paths. Three recommendations: reflect on how your current work contributes to society (David Yeager), change your work in small ways to connect it to your values (Wrzesniewski's job crafting), and find inspiration in a purposeful role model (Damon).`,
  voice: `For most gritty people I study, interest isn't enough to sustain a lifetime of effort. What ripens passion is the conviction that your work matters to other people. Purpose usually comes later, after you've found something interesting and gotten good at it.

You don't need a special job to have a calling. The three bricklayers have the same job. You can reflect on how your work helps others, craft small changes that connect it to your values, and seek out people whose purpose inspires you.`,
  quotes: [
    { text: "At its core, the idea of purpose is the idea that what we do matters to people other than ourselves." },
    { text: "The third has a calling." },
  ],
  diagrams: ["bricklayers", "maslow"],
  sections: [
    { title: "Purpose as a source of passion", gist: "Interest and purpose both fuel passion; for some (Alex Scott) purpose comes first; for most it comes third.", q: "Did purpose come first or last for you?", terms: ["purpose"] },
    { title: "What purpose means", gist: "Grit paragons' work connects to others; purpose = the intention to contribute to others' well-being.", q: "Whose well-being does your work serve?", terms: ["purpose", "self-transcendence"] },
    { title: "Purpose vs. pleasure", gist: "Eudaimonic vs. hedonic; 16,000-adult survey: grit correlates with purpose, not with less pleasure.", idea: "Grittier people are more purpose-driven, not more ascetic.", q: "Rate your orientation to purpose and to pleasure. Any tension?", terms: ["purpose"] },
    { title: "Purpose can be perverted", gist: "Not all gritty people are altruists; purpose is powerful but not a moral guarantee.", q: "What distinguishes good purpose from fanaticism?", terms: ["purpose"] },
    { title: "The three bricklayers", gist: "Job, career, calling; Wrzesniewski: people know which they are; callers miss fewer days; zookeepers' sacrifice.", q: "Which bricklayer are you, today?", terms: ["calling"] },
    { title: "Studs Terkel's workers", gist: "*Working* (1974): most lacked callings; Nora Watson's despair; callings weren't tied to job type.", q: "What would make your work less like Nora's?", terms: ["calling"] },
    { title: "Callings are in the eye of the beholder", gist: "Same occupation, different construals; a calling isn't a job title.", q: "Could you see your current work as a calling?", terms: ["calling", "job-crafting"] },
    { title: "Joe Leader", gist: "A New York subway engineer's growing sense of purpose.", q: "How did his calling develop over time?", terms: ["calling"] },
    { title: "Callings develop", gist: "Many give a job a couple of years before deciding it's not a calling; callings can grow with time and mastery.", q: "Have you given up too soon on finding meaning in a role?", terms: ["calling", "interest"] },
    { title: "Summerbridge", gist: "Duckworth at 21: a tuition-free summer program; her purpose crystallizes; her father objects.", q: "When did you first feel your work mattered to others?", terms: ["purpose"] },
    { title: "Grit and other-orientation", gist: "Her father feared she'd sacrifice herself; grit and prosocial purpose can coexist.", q: "Does caring for others conflict with ambition?", terms: ["purpose", "self-transcendence"] },
    { title: "Aurora and Franco Fonte", gist: "Unpredictable roads to purposeful, interesting passions.", q: "What unexpected road led you here?", terms: ["purpose"] },
    { title: "Bill Damon on cultivating purpose", gist: "Purpose can and should be cultivated; role models and reflection.", q: "Who is your purposeful role model?", terms: ["purpose"] },
    { title: "Kat Cole", gist: "From Hooters waitress to Cinnabon president; her mother as role model for purpose-driven grit.", q: "What role model of purpose did you have growing up?", terms: ["purpose", "mentor"] },
    { title: "Three ways to cultivate purpose", gist: "Reflect on your contribution (Yeager); job crafting (Wrzesniewski); purposeful role models (Damon).", idea: "It's never too early or late to cultivate purpose.", q: "Try one of the three this week.", terms: ["purpose", "job-crafting"] },
  ],
  origins: `Aristotle's *eudaimonia*; Ryan & Deci's distinction between hedonic and eudaimonic well-being; **Wrzesniewski**'s work orientations; **Damon**'s purpose research; **Yeager**'s self-transcendent purpose for learning; **Grant**'s prosocial motivation; Terkel's *Working* (1974).`,
  evidence: [
    { cite: "Wrzesniewski, McCauley, Rozin & Schwartz (1997), *Journal of Research in Personality*", note: "Job/career/calling orientations are distinct and similarly distributed across occupations." },
    { cite: "Bunderson & Thompson (2009), zookeepers, *ASQ*", note: "Callings bring meaning and sacrifice: a \"double-edged sword.\"" },
    { cite: "Yeager et al. (2014), \"Boring but important,\" *JPSP*", note: "A self-transcendent purpose for learning increased persistence on tedious tasks and grades in some samples." },
    { cite: "Damon (2008), *The Path to Purpose*", note: "Interviews and surveys: only a minority of youth have fully formed purpose; it can be cultivated." },
  ],
  debates: `**Purpose as a privilege?** Callings are more common among people with autonomy and security. Bunderson & Thompson show callings can be exploited (low pay, unpaid hours). Organizations shouldn't use meaning as a substitute for fair pay.

**Bridge to *Situated*.** Chapter 12 of *Situated* moves purpose from individual motivation to the top of a corrected Maslow hierarchy (self-transcendence) and from personal virtue to civic responsibility.`,
  people: [["Amy Wrzesniewski", "Callings; job crafting."], ["William Damon", "Purpose in youth."], ["David Yeager", "Purpose-for-learning interventions."], ["Adam Grant", "Prosocial motivation."], ["Studs Terkel", "*Working*."]],
  why: `Purpose turns effort from self-improvement into contribution, and research suggests it sustains effort through tedium.`,
  terms: ["purpose", "calling", "job-crafting", "self-transcendence"],
  questions: {
    comprehension: ["Define purpose in Duckworth's sense.", "Explain the three bricklayers and Wrzesniewski's findings.", "List the three recommendations for cultivating purpose."],
    critical: ["Callings can be exploited. How should organizations balance meaning and fair treatment?", "Compare this chapter to *Situated* Ch. 12 on self-transcendence."],
    personal: ["Write one sentence on how your work helps someone else."],
    club: ["Is a calling something you find or something you make?"],
  },
  annotations: [
    { anchor: "the intention to contribute to the well-being of others", title: "Defining purpose", body: `Damon, Menon & Bronk (2003) define purpose as a stable intention to accomplish something meaningful to the self and consequential for the world beyond the self. Duckworth emphasizes the other-oriented half.` },
    { anchor: "Higher scores on purpose correlate with higher scores on the Grit Scale", title: "Correlation, not direction", body: `Purpose may fuel grit, grit may lead to roles that feel purposeful, or both may stem from a stable top-level goal. The survey can't say which.` },
    { anchor: "the idea of purpose can be perverted", title: "Dark purpose", body: `Research on "devoted actors" (Atran) shows sacred values and group identity can sustain extreme sacrifice for harmful causes, a sobering limit on purpose as a virtue.` },
    { anchor: "The third has a calling", title: "The bricklayer parable", body: `Variously attributed (often to Christopher Wren and St. Paul's Cathedral, likely apocryphally). Its research counterpart is Wrzesniewski's work orientation.` },
    { anchor: "missed at least a third fewer days of work", title: "Callings and absenteeism", body: `Self-selection is possible: people with stable, satisfying jobs may both feel called and miss fewer days.` },
    { anchor: "a recent survey of 982 zookeepers", title: "The double-edged sword", body: `Bunderson & Thompson found zookeepers with callings felt moral duty and identity, and were more willing to sacrifice pay and time, which management could exploit.` },
    { anchor: "except to be me", title: "Meaning at work", body: `Terkel's interviews captured both meaning and alienation. Later research on meaningful work (Rosso, Dekas & Wrzesniewski, 2010) maps its sources: self, others, work context, and spiritual life.` },
  ],
});

SG.fill("grit", "ch09", {
  thesis: "Hope, the expectation that our own efforts can improve our future, runs through every stage of grit. It is learned: from mastery over adversity, optimistic explanations, a growth mindset, and adults who model it.",
  overview: `"Fall seven, rise eight." Hope here isn't wishing; it's believing your efforts can improve your future. Duckworth nearly quit neurobiology at Harvard after a bad quiz, then persisted and majored in it.

**Learned helplessness.** In Seligman and Maier's 1964 experiment, dogs given shocks they couldn't control later failed to escape; dogs with control escaped. "It's suffering you think you can't control" that produces helplessness. But a third of dogs stayed resilient, which led Seligman to **learned optimism**: optimists explain bad events with temporary, specific causes; pessimists with permanent, pervasive ones. Optimists stay in jobs and sell more (MetLife). Under Aaron Beck, cognitive therapy teaches people to change their self-talk. Optimistic Teach For America teachers were grittier and more effective. "When you keep searching for ways to change your situation for the better, you stand a chance of finding them."

**Carol Dweck**'s mindsets: a fixed mindset leads to helplessness after failure; a growth mindset leads to persistence, and growth-minded students are grittier. Mindsets come from experience and from how authorities praise (effort vs. talent) and react to mistakes. Adults should *model* growth (James Baldwin: children "have never failed to imitate"). Vanguard CEO Bill McNabb's path from fixed to growth mindset; Outward Bound builds confidence; Maier's new experiments show **mastery** experienced alongside adversity "immunizes." People who cruise without failure lack mastery experiences. The chain: growth mindset → optimistic self-talk → perseverance → new challenges.`,
  voice: `Hope, as I mean it, isn't the hope that tomorrow will be better. It's the hope that we can make it better. Gritty people don't get knocked down less often. They explain setbacks in ways that make getting up seem worth it.

It isn't suffering that makes us give up; it's suffering we think we can't control. You can learn to talk to yourself like an optimist and to believe your abilities can grow. And because children imitate more than they listen, the most powerful thing adults can do is model hope.`,
  quotes: [
    { text: "When you keep searching for ways to change your situation for the better, you stand a chance of finding them. When you stop searching, assuming they can’t be found, you guarantee they won’t." },
    { text: "Fall seven, rise eight." },
  ],
  diagrams: ["helplessness"],
  sections: [
    { title: "Fall seven, rise eight", gist: "Two kinds of hope: the expectation that tomorrow will be better vs. the belief that our efforts will make it better.", q: "Which kind of hope do you rely on?", terms: ["learned-helplessness"] },
    { title: "Neurobiology", gist: "Duckworth's failed quiz and midterm; the choice to persist and major in neurobiology.", q: "When did you nearly quit after an early failure?", terms: ["perseverance"] },
    { title: "The 1964 experiment", gist: "Seligman & Maier's yoked design; dogs without control later don't escape; \"It's suffering you think you can't control.\"", idea: "Lack of perceived control, not suffering itself, produces helplessness.", q: "Where do you feel suffering without control?", terms: ["learned-helplessness"] },
    { title: "Learned optimism", gist: "A third of dogs stay resilient; optimists vs. pessimists in explanatory style; outcomes in health, grades, sales; elite swimmers after false feedback.", q: "How do you explain your setbacks: permanent or temporary, pervasive or specific?", terms: ["explanatory-style"] },
    { title: "Beck and cognitive therapy", gist: "Beck's break with psychoanalysis; the same event, different interpretations; CBT teaches optimistic self-talk.", q: "What's one pessimistic thought you could dispute?", terms: ["cognitive-therapy", "explanatory-style"] },
    { title: "Teach For America", gist: "Wendy Kopp's insight; optimistic teachers were grittier and more effective; keep searching for ways to change your situation.", idea: "When you stop searching, you guarantee you won't find a solution.", q: "Where have you stopped searching?", terms: ["explanatory-style", "grit"] },
    { title: "Carol Dweck", gist: "Why some persist and others give up; attributions; retraining children to attribute failure to effort.", q: "What did adults teach you about failure?", terms: ["growth-mindset"] },
    { title: "Mindsets", gist: "Implicit theories of intelligence; fixed vs. growth items; growth-minded students are grittier.", q: "Score yourself on the four mindset items.", terms: ["growth-mindset"] },
    { title: "Where mindsets come from", gist: "Histories of success and failure; praise for talent vs. effort; teachers who privilege high performers; parents who treat mistakes as harmful.", q: "Were you praised for talent or for effort?", terms: ["growth-mindset", "pygmalion-effect"] },
    { title: "Model a growth mindset", gist: "Language plus modeling; James Baldwin on imitation; we all default to a fixed mindset sometimes.", q: "What do your reactions to mistakes teach others?", terms: ["growth-mindset", "neonatal-imitation"] },
    { title: "Bill McNabb", gist: "Vanguard's CEO moves from fixed to growth mindset through sports and challenges; leaders who grow outperform.", q: "What experience changed your mindset?", terms: ["growth-mindset"] },
    { title: "What doesn't kill me", gist: "Nietzsche; Outward Bound increases confidence and sense of control; but uncontrollable stress didn't benefit any of the dogs.", q: "When did adversity make you stronger, and why that time?", terms: ["learned-helplessness"] },
    { title: "Mastery immunizes", gist: "Steve Maier's later rat experiments: experiencing control first protects against later uncontrollable stress.", idea: "Mastery at the same time as adversity builds hope.", q: "What mastery experiences could you build into a young person's life?", terms: ["learned-helplessness", "self-efficacy"] },
    { title: "The frictionless life", gist: "People who cruise without failure lack mastery experiences; Duckworth's own early nerves and over-preparation.", q: "Have you been protected from failure too long?", terms: ["learned-helplessness"] },
    { title: "From mindset to perseverance", gist: "Fixed mindset → pessimism → giving up; growth mindset → optimism → perseverance → seeking challenge; teach yourself hope.", q: "Which link in the chain is weakest for you?", terms: ["growth-mindset", "explanatory-style"] },
  ],
  origins: `**Learned helplessness** (Seligman & Maier, 1967; Maier & Seligman, 2016), the **reformulated helplessness theory** (Abramson, Seligman & Teasdale, 1978), **cognitive therapy** (Beck), **implicit theories** (Dweck & Leggett, 1988; Mueller & Dweck, 1998), and **Outward Bound** research (Hattie et al.'s 1997 meta-analysis).`,
  evidence: [
    { cite: "Seligman & Maier (1967); Maier & Seligman (2016), \"Learned helplessness at fifty,\" *Psychological Review*", note: "Original finding and the reversed mechanism: passivity is default; control is learned and engages the prefrontal cortex." },
    { cite: "Duckworth, Quinn & Seligman (2009), \"Positive predictors of teacher effectiveness,\" *Journal of Positive Psychology*", note: "TFA teachers' grit and life satisfaction predicted student gains. Optimism was linked via grit." },
    { cite: "Mueller & Dweck (1998), praise for intelligence, *JPSP*", note: "Children praised for intelligence chose easier tasks and persisted less after failure." },
    { cite: "Hattie, Marsh, Neill & Richards (1997), Outward Bound meta-analysis, *Review of Educational Research*", note: "Adventure programs produce moderate gains in self-concept and control." },

  debates: `**Mindset intervention sizes.** Large-scale trials show small average effects concentrated in specific groups and contexts (Yeager et al., 2019; Sisk et al., 2018). Mindset *culture* in classrooms and schools may matter as much as individual beliefs (Yeager et al., 2022), which is exactly *Situated*'s move in Ch. 10.

**The situational sentence.** "When you keep searching for ways to change your situation for the better…" is grit's hope applied to the situation, nearly the thesis of *Situated*.

**Maier's reversal.** If passivity is the default and control is learned, then environments that offer controllable challenges are essential. That supports the challenge-plus-support "sweet spot."`,
  people: [["Martin Seligman", "Learned helplessness; learned optimism; positive psychology."], ["Steven Maier", "Neuroscience of controllability."], ["Carol Dweck", "Mindsets."], ["Aaron Beck", "Cognitive therapy."], ["Wendy Kopp", "Teach For America."]],
  why: `Hope is the asset that keeps the others going. This chapter also shows hope is built from experiences of control, which means it depends on the situations we're given and the ones we seek.`,
  terms: ["learned-helplessness", "explanatory-style", "growth-mindset", "cognitive-therapy", "self-efficacy", "pygmalion-effect"],
  questions: {
    comprehension: ["Describe the triadic design and its findings.", "Contrast optimistic and pessimistic explanatory styles.", "What is a growth mindset, and where does it come from?", "What did Maier's later experiments add?"],
    critical: ["Growth-mindset intervention effects are small on average. Why might mindset culture matter more than individual mindset?", "How does \"keep searching for ways to change your situation\" anticipate *Situated*?"],
    personal: ["Rewrite a recent setback in temporary, specific terms."],
    club: ["Is protecting kids from failure a mistake? When is it right?"],
  },
  annotations: [
    { anchor: "Fall seven, rise eight", title: "Nana korobi ya oki", body: `A Japanese proverb associated with Daruma dolls, which right themselves when knocked over. Resilience research frames this as recovery and adaptation after adversity (Masten).` },
    { anchor: "It’s suffering you think you can’t control", title: "Perceived control", body: `Perceived control is one of psychology's most robust predictors of health and well-being (e.g., Langer & Rodin's 1976 nursing-home study, where giving residents responsibility for a plant improved outcomes).` },
    { anchor: "two-thirds of the dogs who had no control over the shocks", title: "Individual differences", body: `One third resisted helplessness. That variation launched Seligman's optimism research, a person-level explanation, while Maier's later work emphasizes prior *experiences* of control, a situational one.` },
    { anchor: "optimists habitually search for temporary and specific causes of their suffering", title: "Explanatory style", body: `The reformulated helplessness theory (1978) adds three dimensions: internal–external, stable–unstable, global–specific. Pessimistic style predicts depression prospectively in some studies.` },
    { anchor: "can lead to very different subjective interpretations", title: "Box Two", body: `This sentence is the cognitive model in one line, and it is *Situated*'s Box Two. Notice Beck's late shift (in *Situated* Ch. 3) toward Box One: changing situations to change modes.` },
    { anchor: "When you keep searching for ways to change your situation for the better, you stand a chance of finding them", title: "The bridge sentence", body: `In 2016 Duckworth already frames hope as searching to change your *situation*. *Situated* makes this the central strategy: situational agency.` },
    { anchor: "students with a growth mindset are significantly grittier than students with a fixed mindset", title: "Mindset and grit", body: `Correlational. Later work finds school-level growth-mindset culture predicts gains in grit over a year (Park et al., 2018; cited in *Situated* Ch. 10).` },
    { anchor: "but they have never failed to imitate them", title: "Modeling", body: `Baldwin's line from *Nobody Knows My Name* (1961). It anticipates *Situated*'s "children see, children do" and Bandura's observational learning.` },
    { anchor: "the program has been shown to increase independence, confidence, assertiveness", title: "Adventure education", body: `Hattie et al. (1997) found moderate effects that persisted at follow-up. Programs combine challenge, support, peers and mentors, all elements of a "sweet spot" situation.` },
    { anchor: "That happens when you experience mastery at the same time as adversity", title: "Stress inoculation", body: `Controllable stress can build resilience ("steeling"; Rutter). Seery's (2010) finding that moderate lifetime adversity predicts better well-being than none or high adversity fits this view.` },
  ],
});

SG.fill("grit", "ch10", {
  thesis: "Grit grows best with \"wise parenting\": warm and supportive yet demanding and respectful. Children of wise parents also emulate them. Other adults (teachers, coaches, mentors) can provide the same.",
  overview: `"What can I do to encourage grit in the people I care for?" Some say grit is forged in adversity, others in love. Duckworth meets two very different families. **Steve Young**'s Mormon father ("the ultimate tough guy") told him "You can quit, but you can't come home," and Steve stuck out a miserable first year at BYU, later apprenticing himself to Joe Montana. But the Youngs were also deeply loving and attentive to Steve's anxiety. **Francesca Martinez**, diagnosed with cerebral palsy at two, had "absurdly cool" parents who let her leave school to pursue comedy, yet her father pushed her to do her physical therapy.

The pattern is the **demanding × supportive** grid. Authoritative parenting, which Duckworth renames **"wise parenting,"** combines warmth, respect for autonomy, and high standards. Decades of research find children of such parents fare better. What matters is the message received, so she offers a child-report questionnaire. Wise parents are also more likely to be emulated, so a wise parent who models grit raises grit. Beyond parents, a larger ecosystem: Ron Ferguson finds "psychologically wise" teachers (demanding and supportive) produce better outcomes. And **Cody Coleman**, born in jail with no wise parents, found wise teachers, especially Chantel Smith. *Situated* Ch. 13 continues his story.`,
  voice: `Is grit forged by tough standards or by loving support? My answer is both. The gritty people I've met were raised by parents, or mentored by teachers and coaches, who were demanding and supportive at the same time. I call it wise parenting, because these adults read accurately what children need.

It's not the message you intend that matters but the one children receive. And because children of wise parents want to be like them, your own example counts more than your speeches. If a young person lacks wise parents, any of us can play that role.`,
  quotes: [
    { text: "Growing up with support, respect, and high standards confers a lot of benefits, one of which is especially relevant to grit—in other words, wise parenting encourages children to emulate their parents." },
  ],
  diagrams: ["parenting-quad", "sweet-spot"],
  sections: [
    { title: "Parenting for grit", gist: "The most common question Duckworth gets; it applies to coaches, teachers, managers.", q: "Whose grit do you most want to encourage?", terms: ["authoritative-parenting"] },
    { title: "Tough love or loving support?", gist: "Competing intuitions: adversity vs. unconditional support.", q: "What do you believe, and why?", terms: ["authoritative-parenting", "sweet-spot"] },
    { title: "What the research can say", gist: "Little research on parenting for grit specifically; a lot on parenting generally.", q: "What would a good study of parenting for grit look like?", terms: ["rct", "correlation-causation"] },
    { title: "Steve Young", gist: "Two-time NFL MVP; strict Mormon upbringing; \"You can quit, but you can't come home\"; sticking out BYU; apprenticing to Joe Montana.", q: "Was his father tough, loving, or both?", terms: ["authoritative-parenting", "perseverance"] },
    { title: "The Youngs, up close", gist: "Not authoritarian after all: warm, attentive to a timid, anxious boy; tough love isn't a contradiction.", idea: "Tough love isn't necessarily a contradiction in terms.", q: "Where have you seen tough love done well?", terms: ["authoritative-parenting"] },
    { title: "Francesca Martinez", gist: "Comic with cerebral palsy; permissive-seeming parents who supported her unusual path yet held standards (physical therapy).", q: "What looks permissive but isn't?", terms: ["authoritative-parenting"] },
    { title: "The pattern: wise parenting", gist: "Demanding × supportive quadrants; authoritative = \"wise\"; decades of evidence.", idea: "Children of psychologically wise parents fare better.", q: "Place your upbringing on the grid.", terms: ["authoritative-parenting", "sweet-spot"] },
    { title: "Messages received", gist: "The child's perception matters; a questionnaire of wise-parenting items (with reverse-coded ones).", q: "How would your children (or students) answer?", terms: ["authoritative-parenting", "reference-bias"] },
    { title: "Children emulate wise parents", gist: "Wise parenting increases emulation; wise parents who model grit raise gritty children.", q: "What are you modeling?", terms: ["neonatal-imitation", "authoritative-parenting"] },
    { title: "The larger ecosystem", gist: "All adults are \"parents\" to young people; mentors and coaches.", q: "Which young person outside your family could you support?", terms: ["mentor", "situational-parenting"] },
    { title: "Psychologically wise teachers", gist: "Ron Ferguson's data: demanding and supportive teachers produce engagement and achievement.", q: "Which teacher was wise for you?", terms: ["authoritative-parenting", "sweet-spot"] },
    { title: "Cody Coleman", gist: "Born in jail, raised by his grandmother; no wise parents, but wise teachers, especially Chantel Smith; a path to MIT.", idea: "One wise adult can change a trajectory.", q: "Who was your Chantel Smith?", terms: ["mentor", "flywheel"] },
  ],
  origins: `**Baumrind** (1966, 1971); **Maccoby & Martin** (1983); **Lamborn, Mounts, Steinberg & Dornbusch** (1991) on adolescents' outcomes by parenting style; **Ferguson**'s Tripod surveys of teaching ("care, control, clarify, challenge, captivate, confer, consolidate"); research on non-parental mentors.`,
  evidence: [
    { cite: "Lamborn et al. (1991), *Child Development*", note: "~10,000 adolescents: authoritative homes associated with better adjustment and achievement. Correlational." },

  ],
  debates: `**Cultural variation.** Authoritarian-seeming parenting may have different meanings and effects in different cultural contexts (Chao, 1994; Steinberg's ethnic-group findings). **Child effects.** Children's temperaments evoke parenting styles, so causation runs both ways. **Behavioral genetics.** Shared family environment explains little variance in adult personality (Plomin; Harris), which suggests parenting effects may operate through specific experiences and opportunities rather than general style.

/* Graduate-seminar supplement for Grit: extends each chapter's "where it comes from" and
   "live debates", and adds scholar's notes and people. Merged into the chapters by SG.extend
   (strings are appended as new paragraphs, arrays are concatenated). */
SG.extend = (bid, id, obj) => {
  const ch = SG.books[bid].chapters.find((c) => c.id === id);
  if (!ch) throw new Error("No chapter " + bid + "/" + id);
  for (const k in obj) {
    const v = obj[k];
    if (Array.isArray(v)) ch[k] = (ch[k] || []).concat(v);
    else if (typeof v === "string") ch[k] = ch[k] ? ch[k] + "\n\n" + v : v;
    else ch[k] = v;
  }
};

SG.extend("grit", "preface", {
  origins: `**Where the question comes from.** "Talent or effort?" is one of psychology's oldest questions. Francis Galton's *Hereditary Genius* (1869) argued that eminence runs in families and needs "ability combined with zeal and with capacity for hard labour." Galton therefore gave effort a place from the start, even though he is remembered as a hereditarian. The twentieth century split the question into two literatures that rarely spoke: **psychometrics**, which measured ability (Binet, Terman, Spearman's *g*), and **motivation science**, which studied why people try (achievement motivation from McClelland and Atkinson, then expectancy-value theory and self-determination theory). *Grit* bridges the two by proposing a measurable, trait-like *motivational* variable that sits beside ability in prediction equations.`,
  debates: `**The framing itself.** Philosophers of science would say the preface sets up a *contrast class*: grit *rather than* talent. Critics note that this framing invites a zero-sum reading, even though Duckworth's own model is multiplicative (Ch. 3). When you read on, notice whether each study tests grit *against* talent (incremental validity) or *alongside* it (interaction). The two are different empirical claims.`,
  annotations: [
    { anchor: "You know, you’re no genius!", title: "A personal frame", body: `Opening with a parent's verdict turns the book into an argument with a *lay theory* of ability. Lay theories (Dweck's "implicit theories," Heider's "naive psychology") shape how people interpret effort and failure. The preface is, in effect, a case study of how one such theory was absorbed and then resisted.` },
  ],
  people: [["Walter Mischel", "Delay of gratification; the person–situation debate that *Situated* revisits."], ["David McClelland", "Achievement motivation (\"need for achievement\"); a precursor to grit research."]],
});

SG.extend("grit", "ch01", {
  origins: `**The lineage of the construct.** Grit has three ancestors. (1) **Conscientiousness** in the Big Five, especially its *industriousness* and *achievement-striving* facets (Costa & McCrae; DeYoung, Quilty & Peterson 2007). (2) **Goal theory**: long-term, superordinate goals organizing lower ones (Carver & Scheier's control theory; Austin & Vancouver 1996). (3) **Biographical studies of eminence**: Cox (1926) and later Simonton found "persistence of motive" among the eminent. The 2007 paper's innovation was not the idea but the *instrument*: a brief self-report scale that could be put into prediction studies in schools, the military and workplaces at scale.`,
  debates: `**Construct validity.** The *jangle fallacy* is giving a new name to an old construct (Kelley, 1927). Critics argue grit is largely conscientiousness relabeled. In Credé et al. (2017), the grit–conscientiousness correlation was about .84 after correction for unreliability. Defenders respond that grit's *consistency of interest* facet adds something conscientiousness scales don't capture, and that a domain-focused construct can be useful even if it overlaps with a broad trait.

**Facet asymmetry.** Several large studies find that **perseverance of effort** predicts outcomes while **consistency of interest** adds little or nothing (e.g., Disabato, Goodman & Kashdan 2019; later meta-analyses). Jachimowicz et al. (2018, *PNAS*) offered a reconciliation: perseverance predicts performance chiefly when *passion* (for the specific pursuit) is also present, which supports Duckworth's insistence on both halves.

**Short grit scale.** Grit-S (Duckworth & Quinn 2009) has 8 items. Grit-O has 12. The 10-item version in Ch. 4 is a book variant. In practice, findings differ somewhat by version, so ask which scale a study used.`,
});

SG.extend("grit", "ch02", {
  origins: `**Why we discount effort.** Attribution theory supplies the mechanism behind naturalness bias. Kelley's **discounting principle** says that when an outcome has two plausible causes, evidence for one (visible effort) lowers our confidence in the other (ability). Kruger et al.'s (2004) **effort heuristic** shows the reverse in judging *products*: we rate work as better when told it took longer. So we admire effortful *things* and effortless *people*.`,
  debates: `**Updated validity estimates.** The chapter's critics usually cite Schmidt & Hunter (1998) for the predictive power of ability. Sackett, Zhang, Berry & Lievens (2022) re-estimated those figures with corrected range-restriction methods and found cognitive ability's validity for job performance lower than long believed. Structured interviews and job-knowledge tests do as well or better. Talent still matters, but the gap with other predictors is smaller.

**Self-fulfilling prophecy.** Rosenthal & Jacobson's *Pygmalion in the Classroom* (1968) is famous but contested. Jussim & Harber's (2005) review concludes expectancy effects are real but usually small and fade, and are larger for stigmatized groups. Duckworth's teaching anecdote is consistent with this, but it's an anecdote.`,
  annotations: [
    { anchor: "Enron was named America’s Most Innovative Company", title: "The Enron case", body: `Gladwell's argument (2002) was that a culture that rewards *being seen as* brilliant over doing reliable work encourages narcissism and risk-taking. Organizational researchers would add that Enron's failure was overdetermined: incentive design, accounting rules, and governance failures all mattered. It is a vivid example, not a controlled test.` },
  ],
  people: [["Malcolm Gladwell", "\"The Talent Myth\" (2002); later popularized the \"10,000-hour rule\" (2008)."], ["Paul Sackett", "Industrial-organizational psychologist; revised estimates of what predicts job performance (2022)."]],
});

SG.extend("grit", "ch03", {
  origins: `**Skill and output, studied separately.** "Talent × effort = skill; skill × effort = achievement" spans two research traditions. **Skill acquisition** research (Fitts & Posner's stages; Anderson's ACT theory; Ericsson's deliberate practice) studies how effort becomes skill. **Productivity** research (Simonton's "equal-odds rule": the more works a creator produces, the more hits) studies how skill becomes achievement through output.`,
  debates: `**Additive or multiplicative?** Van Iddekinge et al.'s (2018) meta-analysis of ability and motivation in job performance found mostly *additive* effects, with weak interactions. So the multiplication signs are a teaching device, not a fitted model. The conceptual point, that effort enters twice, survives either way.

**The Grant Study treadmill.** The 1940s Harvard Fatigue Laboratory treadmill test and George Vaillant's follow-up form an intriguing archival finding. But it rests on a small, elite, all-male, white sample, many outcomes and a long chain of inference. Treat it as illustrative rather than probative.`,
  annotations: [
    { anchor: "130 sophomores were asked to run on a treadmill", title: "Archival samples", body: `The Grant Study (begun 1938) followed Harvard men for decades, which made it famous and also limits it. Findings may not generalize across gender, class or race, and the number of outcomes examined raises the risk of chance associations (the "garden of forking paths").` },
    { anchor: "a good potter can make forty or fifty pots in a day", title: "Quantity breeds quality", body: `Simonton's equal-odds rule: across a career, the ratio of hits to total works is roughly constant, so the most prolific creators produce the most masterpieces *and* the most duds. MacKenzie's "some good, some mediocre" is the craftsman's version of the same law.` },
  ],
  people: [["Anders Ericsson", "Deliberate practice; the expertise tradition that grounds the \"effort counts twice\" idea (Ch. 7)."]],
});

SG.extend("grit", "ch04", {
  origins: `**Control theory and goal shielding.** The pyramid of goals comes from cybernetic **control theory** (Powers 1973; Carver & Scheier 1981, 1998), in which "be" goals (identity) sit above "do" goals, with feedback loops at each level. Buffett's "avoid-at-all-cost list" (attributed to him; the story's provenance is uncertain) is a folk version of **goal shielding**: active goals inhibit competing ones (Shah, Friedman & Kruglanski 2002). **Harmonious vs. obsessive passion** (Vallerand et al. 2003) refines what "staying in love" should mean: passion that fits with the rest of life, rather than controlling it, predicts sustained engagement and well-being.`,
  debates: `**Self-report and reference bias.** When you take the Grit Scale, you compare yourself to "most people." But "most people" differs by context: students at demanding schools may rate themselves *lower* because their reference group is grittier. West, Kraft et al. (2016) found that some high-performing charter schools had students with *lower* self-reported grit and self-control despite better behavioral outcomes. That is reference bias.

**Faking and stakes.** Self-report scales are easily faked when stakes are high. Duckworth & Yeager (2015, *Educational Researcher*) argued against using grit scores for accountability or admissions. That is a point worth raising whenever schools adopt "grit report cards."

**Passion vs. consistency.** Some researchers argue the "passion" items measure *stability of interests*, not passion as most people understand it. Jachimowicz et al. (2018) showed that measuring passion directly improves prediction.`,
  people: [["Robert Vallerand", "Dualistic model of passion: harmonious vs. obsessive."], ["Arie Kruglanski", "Goal systems theory: equifinality, multifinality, goal shielding."]],
});

SG.extend("grit", "ch05", {
  debates: `**What the twin study also found.** The same Rimfeld et al. (2016) study found that grit added little to predicting academic achievement once the other Big Five traits were controlled for. That finding is worth discussing next to the chapter's optimism.

**Can grit be taught?** Experiments that target grit directly are few and show modest effects. Interventions on related targets (growth mindset, purpose, self-control strategies) show small average effects with meaningful variation across settings. This is the bridge to *Situated*'s argument that changing situations may be more effective than exhorting individuals.`,
  annotations: [
    { anchor: "Digging through the raw scores of IQ tests", title: "Where the Flynn gains are", body: `Gains are largest on fluid, abstract-reasoning tests (like Raven's matrices) and smallest on vocabulary and arithmetic. Flynn's interpretation is that modern environments trained "scientific spectacles," habits of classifying and hypothesizing. Some recent data from Scandinavia show the effect stalling or reversing, which within-family analyses attribute to environmental rather than genetic causes (Bratsberg & Rogeberg 2018).` },
  ],
  people: [["Eric Turkheimer", "\"Three laws of behavior genetics\"; critic of naive readings of heritability."], ["Kaili Rimfeld", "Lead author of the twin study of grit's heritability (2016)."]],
});

SG.extend("grit", "ch06", {
  debates: `**Passion follows competence?** Critics of "follow your passion" (e.g., Cal Newport, *So Good They Can't Ignore You*, 2012) argue that passion often *follows* skill, autonomy and recognition rather than preceding them. That is compatible with Duckworth's "development" and "deepening" phases.

**Who gets to explore?** Discovery takes time, money and low stakes, which are unevenly distributed. Sociologist Annette Lareau's "concerted cultivation" (*Unequal Childhoods*) shows that affluent families structure children's exploration far more. When the chapter says interests must be "triggered again and again," ask: by whom, and for whom?`,
  annotations: [
    { anchor: "three different stages, each lasting several years", title: "Bloom's stages", body: `Bloom's retrospective interview design means stages are reconstructed by successful people and their parents. Survivors' accounts may smooth over false starts. Still, Côté's (1999) developmental model of sport participation, "sampling years" before "specializing" and "investment," independently found a similar sequence.` },
    { anchor: "I call them short-termers", title: "Turnover and fit", body: `Organizational research distinguishes turnover driven by poor fit from turnover driven by better alternatives. Jane Golden's "short-termers" may be people still in the discovery phase. That is not necessarily a deficit, since a broad early "sampling" phase predicts later expertise in many domains (Epstein's *Range*, 2019).` },
  ],
  people: [["Suzanne Hidi", "Four-phase model of interest development (with K. Ann Renninger)."], ["Paul O'Keefe", "Implicit theories of interest: \"find\" vs. \"develop\" your passion."]],
});

SG.extend("grit", "ch07", {
  origins: `**Before Ericsson.** Chase & Simon's chess studies (1973) showed that masters perceive meaningful "chunks" rather than individual pieces, so expertise is domain knowledge, not general brilliance. Afterward, the popular "10,000-hour rule" (Gladwell, *Outliers*, 2008) simplified deliberate practice into a number, and Ericsson objected that the quality and design of practice matter, not the hours alone (Ericsson & Pool, *Peak*, 2016).`,
  debates: `**The numbers.** Macnamara, Hambrick & Oswald's (2014) meta-analysis found deliberate practice explained about 26% of the variance in performance in games, 21% in music, 18% in sports, 4% in education and under 1% in professions. Ericsson replied that many included studies didn't measure *deliberate* practice properly. A 2019 replication of the violin study (Macnamara & Maitra) found smaller group differences than the original.

**Practice and ability together.** Hambrick and colleagues propose a multifactorial gene–environment model. Twin studies even find that practice *itself* is partly heritable (Mosing et al. 2014). Duckworth's position fits this model better than the strong "practice is all" view she's sometimes credited with.

**Is deliberate practice aversive?** Ericsson held that it is "not inherently enjoyable." Duckworth's survey data suggest that grittier people find effortful practice *both* hard *and* rewarding. That is consistent with Eisenberger's learned industriousness (Ch. 11).`,
  annotations: [
    { anchor: "I probably spend 70 percent of my time by myself", title: "Solitary practice", body: `In the violin study, the best students' time spent practicing alone was the strongest single discriminator. Solitary practice allows full control over difficulty and immediate repetition after errors. Team sports complicate the picture: much of their deliberate practice is coach-designed and social.` },
  ],
  people: [["David Z. Hambrick", "Multifactorial gene–environment model of expertise."], ["William Chase & Herbert Simon", "Chess chunking; founding studies of expert memory."]],
});

SG.extend("grit", "ch08", {
  origins: `**Existential and experimental roots.** Viktor Frankl's *Man's Search for Meaning* (1946) is the existential ancestor of purpose research. Carol Ryff's model of psychological well-being (1989) made "purpose in life" measurable. Adam Grant's field experiments supply causal evidence for prosocial motivation: call-center fundraisers who briefly met a student helped by their work went on to raise substantially more money (Grant et al. 2007).`,
  debates: `**Passion exploitation.** Kim, Campbell, Shepherd & Kay (2020, *JPSP*) found that people judge it more legitimate to extract unpaid or extra work from employees seen as passionate. That extends Bunderson & Thompson's zookeeper finding from the worker's side to the employer's.

**Self-transcendent purpose interventions.** Yeager et al. (2014, *JPSP*) found that brief "purpose for learning" exercises increased persistence on tedious tasks and modestly improved grades. Effects are small and context-dependent, which is typical of brief psychological interventions.

**Hedonic vs. eudaimonic.** Some researchers question whether the two can be cleanly separated empirically, since their measures correlate highly (Kashdan, Biswas-Diener & King 2008). Use the distinction as a lens, not a typology.`,
  annotations: [
    { anchor: "eudaimonic", title: "Eudaimonia, carefully", body: `In Aristotle, *eudaimonia* is not a feeling but an activity: the exercise of virtue over a complete life. Modern psychology's "eudaimonic well-being" turns it into self-reported meaning, growth and purpose. That is a useful operationalization, but it shifts the concept from the objective to the subjective.` },
    { anchor: "Amy calls this idea", title: "Job crafting evidence", body: `Job crafting includes task crafting (changing what you do), relational crafting (whom you work with) and cognitive crafting (how you frame the work). Field experiments show modest gains in well-being and performance (Berg, Dutton & Wrzesniewski; later meta-analyses by Rudolph et al. 2017). This is *Situated*'s "situation selection and modification" applied to a job.` },
    { anchor: "How could the world be a better place?", title: "Linking self to world", body: `The prompt asks students to connect mundane schoolwork to a self-transcendent aim. The mechanism is thought to be a reframing of boredom: when a task serves a valued purpose, its tedium is reinterpreted as worthwhile effort rather than wasted time.` },
  ],
  people: [["Viktor Frankl", "*Man's Search for Meaning*; logotherapy and the will to meaning."], ["Carol Ryff", "Psychological well-being model including purpose in life."], ["J. Stuart Bunderson & Jeffery Thompson", "Zookeeper study: callings as a double-edged sword."]],
});

SG.extend("grit", "ch09", {
  origins: `**Helpless and mastery-oriented children.** Before *Mindset*, Diener & Dweck (1978) observed children solving problems aloud. After failure, "helpless" children blamed their ability and their strategies deteriorated. "Mastery-oriented" children barely mentioned failure and instead instructed themselves to try harder or differently. Those transcripts are the observational seed of implicit-theories research.`,
  debates: `**The neuroscience of the reversal.** In "Learned Helplessness at Fifty" (*Psychological Review*, 2016), Maier & Seligman locate the default passive response in the dorsal raphe nucleus. What is learned is control: the ventromedial prefrontal cortex detects controllability and inhibits that default. The chapter's quote about "higher-order brain areas" reflects this update.

**Ongoing mindset replication debate.** Macnamara & Burgoyne's (2023, *Psychological Bulletin*) meta-analysis argued that, after accounting for study quality and potential bias, average effects of mindset interventions are close to zero. Proponents counter that effects are expected only for some students in some schools. Both sides agree that context, the situation, moderates the effect.

**Optimism's limits.** Unrealistic optimism can undermine effort (Oettingen's positive fantasies, Ch. 4). Duckworth's hope is *grounded*: "I have learned how to change my situation," not "it will turn out fine."`,
  annotations: [
    { anchor: "Steve Maier and his students designed an experiment nearly identical", title: "Inoculation by control", body: `In these rat studies, experiencing controllable stress first protected animals from the effects of later uncontrollable stress, and the protection depended on the prefrontal cortex. That is a neural basis for "stress inoculation" and for Outward Bound–type programs. The leap from rats to people is plausible but should be made carefully.` },
    { anchor: "regulated by higher-order brain areas", title: "Appraisal and the brain", body: `This is appraisal theory (Lazarus) restated in neural terms: the meaning we assign to a stressor, controllable or not, modulates the physiological response. *Situated*'s Three Boxes model places this in Box Two, thoughts, between situation and response.` },
  ],
  people: [["Lyn Abramson", "Reformulated helplessness theory; hopelessness theory of depression."], ["Richard Lazarus", "Appraisal theory of stress and coping."], ["Brooke Macnamara", "Critical meta-analyses of mindset interventions."]],
});

SG.extend("grit", "ch10", {
  origins: `**Attachment.** The deeper root of "supportive" parenting is attachment theory (Bowlby; Ainsworth): a responsive caregiver provides a *secure base* from which a child dares to explore and attempt hard things. Read "demanding and supportive" as a secure base *plus* high expectations.`,
  debates: `**Better causal evidence.** Correlational parenting studies can't rule out genes or child effects. Randomized parenting interventions can. For example, the Family Check-Up (Dishion and colleagues) shows that changing parents' monitoring and positive engagement changes children's behavior. Long-run effects on traits like grit are not established.

**Teachers too.** Ferguson's Tripod surveys were used in the large Measures of Effective Teaching project, where students' perceptions of teacher support and challenge predicted learning gains. That extends "supportive and demanding" beyond the family.`,
  annotations: [
    { anchor: "proposed a moratorium on further research on parenting styles", title: "Settled science?", body: `Steinberg's "moratorium" was rhetorical: he meant the basic authoritative-parenting finding had replicated enough. Some developmentalists disagree, arguing that the typology is too coarse and that specific *practices* (monitoring, autonomy granting, harsh discipline) should be studied instead of global styles.` },
  ],
  people: [["Eleanor Maccoby", "Reorganized parenting styles into responsiveness × demandingness."], ["Annette Lareau", "*Unequal Childhoods*; class differences in \"concerted cultivation.\""]],
});

SG.extend("grit", "ch11", {
  debates: `**Pay-to-play.** Participation in school sports and arts has become more expensive and more unequal (Putnam 2015; Snellman et al. 2015). If follow-through predicts success *and* access is income-graded, colleges' use of extracurriculars in admissions may compound inequality. That is a *Situated*-style point about situational responsibility.

**The Hard Thing Rule as a commitment device.** Economists call rules adopted in advance to bind future choices *commitment devices* (Schelling; Bryan, Karlan & Nelson 2010). They can build habits, but too-rigid rules may teach compliance rather than intrinsic interest. Note the rule's built-in autonomy: "you pick your hard thing."`,
  annotations: [
    { anchor: "One horse did win, and by a long stretch: follow-through", title: "The horse race", body: `"Horse race" analyses enter many predictors at once and see which survive. That is informative, but the winner depends on how reliably each predictor was measured. A well-measured construct (follow-through, coded from records) can beat a poorly measured one (a brief questionnaire) for reasons of reliability, not importance.` },
    { anchor: "followed eleven thousand American teenagers", title: "Dosage", body: `Gardner and colleagues found benefits for educational attainment and civic engagement mainly for students who participated for two or more years: a "dose–response" pattern, which is one criterion (Bradford Hill) that strengthens a causal reading.` },
  ],
  people: [["Margo Gardner", "Longitudinal study of extracurricular participation and young-adult outcomes."], ["Thomas Schelling", "Commitment devices and self-binding."]],
});

SG.extend("grit", "ch12", {
  origins: `**Selection into cultures.** Benjamin Schneider's **attraction–selection–attrition** model (1987) argues that organizations become homogeneous because similar people are attracted, selected and retained. **Person–organization fit** research (O'Reilly, Chatman & Caldwell 1991) shows that value fit predicts commitment and turnover.`,
  debates: `**Selection vs. socialization.** Do gritty cultures *make* people grittier, or *attract and retain* the already gritty? Selection alone can produce a gritty-looking culture. Disentangling the two needs longitudinal within-person data, which the chapter's examples (Seahawks, UNC, JPMorgan) don't provide. They illustrate the mechanism; they don't test it.

**Strong cultures' costs.** Strong cultures improve coordination but can suppress dissent and invite groupthink (Janis 1972).

**Measuring culture.** Survey "climate" measures (shared perceptions) are easier to collect than "culture" (deep assumptions), and most quantitative culture research actually measures climate.`,
  annotations: [
    { anchor: "Competition Wednesdays", title: "Ritualized challenge", body: `A weekly ritual of competition-level practice standardizes challenge, so everyone faces stretch conditions on a schedule. That is *situation design*: instead of hoping individuals seek difficulty, the environment guarantees it. *Situated* calls this kind of lever setting up the situation.` },
    { anchor: "Fortitude is to Jamie Dimon what sisu is to Finland", title: "Leaders as culture carriers", body: `Schein argued that leaders shape culture chiefly through what they pay attention to, how they react to crises, and whom they reward, promote and fire, more than through slogans. Dimon's personal "fortitude" story matters for culture only insofar as it is enacted in those mechanisms.` },
  ],
  people: [["Edgar Schein", "Layered model of organizational culture; leaders as culture builders."], ["Benjamin Schneider", "Attraction–selection–attrition model."], ["Daphna Oyserman", "Identity-based motivation theory."]],
});

SG.extend("grit", "ch13", {
  debates: `**Which facet carries well-being?** In a large international sample, Disabato, Goodman & Kashdan (2019) found that perseverance of effort related to well-being and strengths, while consistency of interest contributed little. That fits the facet asymmetry seen elsewhere (Ch. 1).

**The politics of grit.** Educators and sociologists have criticized school "grit" programs for putting the burden of overcoming structural disadvantage on individual children. *Situated* can be read as Duckworth's own answer: grit is necessary but not sufficient, and situations, including policies, must change too.`,
  annotations: [
    { anchor: "I’m no genius, and neither is he", title: "Closing the frame", body: `The book ends where it began: with the father's verdict, now reinterpreted. Narrative psychologists (McAdams) call this a *redemptive* arc, where a negative event is reframed into growth. Redemptive self-narratives correlate with generativity and well-being in American samples, though McAdams notes they are culturally specific.` },
  ],
  people: [["Carsten Wrosch", "Goal disengagement and re-engagement as adaptive self-regulation."], ["Dan McAdams", "Narrative identity; redemptive life stories."]],
});

/* App shell: router, pages (home, intro, book, chapter tabs, glossary, notebook),
   drawers, search, import/export, and EPUB loading. */
(function (SG) {
  "use strict";
  const { $, $$, esc, md, inline } = SG;
  SG.loaded = { situated: null, grit: null };
  SG.loadMsg = {};

  /* ---------------- content helpers ---------------- */
  SG.book = (bid) => SG.books[bid];
  SG.chapter = (bid, chid) => (SG.books[bid] ? SG.books[bid].chapters.find((c) => c.id === chid) : null);
  SG.sectionGuide = (bid, chid, key, index) => {
    const ch = SG.chapter(bid, chid);
    if (!ch || !ch.sections) return null;
    if (SG.books[bid].sectioning === "hr") { const m = /^s(\d+)$/.exec(key); return m ? ch.sections[+m[1]] || null : null; }
    return ch.sections.find((s) => (s.key || SG.slug(s.title)) === key) || null;
  };
  SG.termChip = (id) => {

    return '<a class="chip" href="#/glossary/' + esc(id) + '" data-term="' + esc(id) + '">' + esc(t ? t.term : id) + "</a>";
  };
  const chLabel = (ch) => (ch.num != null && ch.num !== "" ? (typeof ch.num === "number" ? "Chapter " + ch.num : ch.num) : ch.title);
  const route = (...p) => "#/" + p.filter((x) => x != null && x !== "").map(encodeURIComponent).join("/");

  /* ---------------- theme & settings ---------------- */
  function applySettings() {
    const st = SG.data.settings;
    const root = document.documentElement;
    if (st.theme === "light" || st.theme === "dark") root.setAttribute("data-theme", st.theme); else root.removeAttribute("data-theme");
    root.style.setProperty("--read-size", st.size + "rem");
    const tb = $("#themeBtn");
    if (tb) { tb.title = "Theme: " + st.theme; tb.setAttribute("aria-label", "Theme: " + st.theme + ". Click to change."); tb.querySelector("span").textContent = st.theme === "system" ? "Auto" : st.theme === "dark" ? "Dark" : "Light"; }
  }

  /* ---------------- shell ---------------- */
  const ICON = {
    search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
    menu: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>',
    moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
    book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>',
  };
  function shell() {
    document.body.innerHTML =
      '<header class="topbar">' +
      '<button class="iconbtn menubtn" id="menuBtn" aria-label="Open navigation" aria-expanded="false">' + ICON.menu + "</button>" +
      '<a class="brand" href="#/"><b>Situated <i>×</i> Grit</b><span>Book club companion</span></a>' +
      '<div class="grow"><div class="crumbs" id="crumbs"></div></div>' +
      '<button class="iconbtn searchbtn" id="searchBtn" aria-label="Search everything">' + ICON.search + '<span class="lbl">Search books, notes, terms</span><kbd>/</kbd></button>' +
      '<button class="iconbtn" id="themeBtn">' + ICON.moon + "<span>Auto</span></button>" +
      "</header>" +
      '<div class="shell"><nav class="rail" id="rail" aria-label="Contents"></nav><div class="scrim" id="scrim"></div><main id="main" tabindex="-1"></main></div>' +
      '<input type="file" id="fileIn" accept=".epub,application/epub+zip" multiple hidden>';
    $("#menuBtn").onclick = () => toggleRail();
    $("#scrim").onclick = () => toggleRail(false);
    $("#searchBtn").onclick = () => openSearch("");
    $("#themeBtn").onclick = () => {
      const order = ["system", "light", "dark"];
      SG.data.settings.theme = order[(order.indexOf(SG.data.settings.theme) + 1) % 3];
      SG.save(); applySettings(); SG.toast("Theme: " + SG.data.settings.theme);
    };
    $("#fileIn").addEventListener("change", (e) => { loadFiles(e.target.files); e.target.value = ""; });
  }
  function toggleRail(force) {
    const r = $("#rail"), s = $("#scrim");
    const open = force == null ? !r.classList.contains("open") : force;
    r.classList.toggle("open", open); s.classList.toggle("open", open);
    $("#menuBtn").setAttribute("aria-expanded", String(open));
  }

  function renderRail(cur) {
    const r = $("#rail");

  /* ---------------- router ---------------- */

  }

    lastRoute = hash;
    try {
      if (!p.length) pageHome(main);

    }

    SG.data.last = hash; SG.save();
  }

      '<div class="btnrow"><a class="btn" href="#/intro">Start with Before You Begin</a><a class="btn ghost" href="' + route("book", "situated", "prologue") + '">Open Situated</a><a class="btn ghost" href="' + route("book", "grit", "preface") + '">Open Grit</a>' + (last ? '<a class="btn ghost" href="' + esc(last) + '">Continue where you left off</a>' : "") + "</div></section>" +

      '<a class="card" href="' + route("book", "situated") + '"><span class="k">2026 · 4 parts · 13 chapters</span><span class="t">Situated</span><p>Find the people and places that bring out your best: awareness, agency, responsibility.</p></a>' +
      '<a class="card" href="' + route("book", "grit") + '"><span class="k">2016 · 3 parts · 13 chapters</span><span class="t">Grit</span><p>The power of passion and perseverance, and how to grow it from the inside out and the outside in.</p></a>' +
      '<a class="card" href="#/glossary"><span class="k">' + Object.keys(SG.glossary).length + ' terms</span><span class="t">Glossary</span><p>Every technical term, with its origin, the current research, and where it shows up in the books.</p></a>' +

  function pageLibrary(main) {

  function wireDrop() {

    ["dragleave", "drop"].forEach((ev) => d.addEventListener(ev, (e) => { e.preventDefault(); d.classList.remove("drag"); }));
    d.addEventListener("drop", (e) => { if (e.dataTransfer && e.dataTransfer.files) loadFiles(e.dataTransfer.files); });

  /* ---------------- loading EPUBs ---------------- */
  async function loadFiles(files) {
    const list = Array.from(files || []);
    if (!list.length) return;
    for (const f of list) {
      SG.toast("Reading " + f.name + "…");
      try {
        const buf = await f.arrayBuffer();
        const parsed = await SG.parseEpub(buf, (m) => { SG.toast(m); });
        SG.loaded[parsed.bookId] = parsed;
        SG.loadMsg[parsed.bookId] = "";
        SG.index = null;
        const stored = await SG.idbPut("epub:" + parsed.bookId, buf);
        SG.toast(SG.books[parsed.bookId].title + " loaded" + (stored ? " and saved on this device" : " (this browser will not keep it after you close the page)"));
      } catch (e) {
        console.error(e);
        SG.toast(e.message || "That file could not be read.");
      }
    }
    router();
  }
  async function restoreBooks() {
    for (const bid of Object.keys(SG.books)) {
      const buf = await SG.idbGet("epub:" + bid);
      if (!buf) continue;
      SG.loadMsg[bid] = "Loading…";
      try { SG.loaded[bid] = await SG.parseEpub(buf); SG.loadMsg[bid] = ""; }
      catch (e) { SG.loadMsg[bid] = "Could not reopen"; console.error(e); }
      SG.index = null;
    }
  }

  /* ---------------- chapter page ---------------- */
  const TABS = [["guide", "Guide"], ["read", "Read"], ["sources", "Sources"], ["discuss", "Discuss"]];
  function neighbors(bid, chid) {

  function pageChapter(main, bid, chid, tab, sec) {

    crumbs([["Home", "#/"], [b.title, route("book", bid)], [chLabel(ch) + (typeof ch.num === "number" ? ": " + ch.title : ""), route("book", bid, chid)], [TABS.find((t) => t[0] === tab)[1]]]);

  function tabGuide(body, bid, ch) {
    let h = "";

  function tabRead(body, bid, ch, sec) {
    const p = SG.loaded[bid];
    if (!p || !p.chapters[ch.id]) {
      const why = !p ? (SG.loadMsg[bid] === "Loading…" ? '<p>Opening your saved copy of the book…</p>' : "<p>The verbatim text comes from your own EPUB. Load it once and it stays on this device.</p>") : "<p>This part of the book was not found in the EPUB you loaded. It may be a different edition.</p>";
      body.innerHTML = '<div class="callout">' + why + (!p ? '<button class="btn" data-act="pick">' + ICON.book + " Load your EPUB of " + esc(SG.books[bid].title) + "</button>" : "") + "</div>" +
        ((ch.sections || []).length ? '<h2 class="h">Sections in this chapter</h2><div class="seclist">' + ch.sections.map((s, i) => '<div class="seccard"><span class="ix">' + (i + 1) + '</span><p class="st">' + esc(s.title) + '</p><p class="sg">' + inline(s.gist || "") + "</p></div>").join("") + "</div>" : "");

  // Locate the loaded book's paragraph that contains a quoted line (null if the book isn't loaded).

  /* ---------------- search ---------------- */
  function buildIndex() {
    const E = [];
    const push = (kind, title, text, href, extra) => { if (text) E.push(Object.assign({ kind, title, text, low: (title + " " + text).toLowerCase(), href }, extra || {})); };
    SG.intro.sections.forEach((s) => push("Study guide", "Before You Begin · " + s.title, SG.plain(s.body + " " + (s.after || "") + " " + (s.timeline || []).map((t) => t.join(" ")).join(" ")), route("intro", s.id)));
    Object.entries(SG.glossary).forEach(([id, t]) => push("Glossary", t.term, SG.plain(t.short + " " + t.deep + " " + (t.origin || "") + " " + (t.debate || "") + " " + (t.aka || []).join(" ")), route("glossary", id), { term: id }));
    Object.values(SG.books).forEach((b) => {
      b.chapters.forEach((c) => {
        const lab = b.title + " · " + chLabel(c) + (typeof c.num === "number" ? ": " + c.title : "");
        push("Study guide", lab + " · Guide", SG.plain([c.thesis, c.overview, c.voice, c.origins, c.debates, c.why, (c.evidence || []).map((e) => e.cite + " " + e.note).join(" "), (c.people || []).map((p) => p.join(" ")).join(" ")].join(" ")), route("book", b.id, c.id));
        (c.sections || []).forEach((s, i) => push("Study guide", lab + " · " + s.title, SG.plain([s.gist, s.idea, s.q].join(" ")), route("book", b.id, c.id, "read", b.sectioning === "hr" ? "s" + i : s.key || SG.slug(s.title))));
        (c.annotations || []).forEach((a) => push("Scholar's note", lab + " · " + a.title, SG.plain(a.body), route("book", b.id, c.id, "read")));
        const Q = c.questions || {};
        const qs = [].concat(Q.comprehension || [], Q.critical || [], Q.personal || [], Q.club || []);
        if (qs.length) push("Questions", lab + " · Discuss", SG.plain(qs.join(" ")), route("book", b.id, c.id, "discuss"));
        const p = SG.loaded[b.id] && SG.loaded[b.id].chapters[c.id];
        if (p) {
          const secT = {}; p.sections.forEach((s) => { secT[s.key] = s.title; });
          p.blocks.forEach((bl) => push("Book text", lab + (secT[bl.sec] && bl.sec !== "_open" ? " · " + secT[bl.sec] : ""), bl.text, route("book", b.id, c.id, "read"), { pid: bl.pid }));
          p.notes.forEach((n) => push("Endnote", lab + " · " + (n.kind === "foot" ? "Footnote " + n.label : "Note " + n.n), n.text, route("book", b.id, c.id, "read"), { note: n.key }));
        }
      });
    });
    SG.data.highlights.forEach((h) => { const c = SG.chapter(h.book, h.ch); if (c) push("My notes", "Highlight · " + SG.books[h.book].title + " · " + c.title, h.text + " " + (h.note || ""), route("book", h.book, h.ch, "read"), { pid: h.segs[0].pid }); });
    Object.entries(SG.data.notes).forEach(([k, v]) => { if ((v || "").trim()) push("My notes", "Note · " + noteLabel(k), v, noteRoute(k)); });
    Object.entries(SG.data.answers).forEach(([k, v]) => { if ((v || "").trim() && v !== "1") { const [b, c] = k.split("/"); if (SG.chapter(b, c)) push("My notes", "Answer · " + SG.books[b].title + " · " + SG.chapter(b, c).title, v, route("book", b, c, "discuss")); } });
    return E;
  }
  function noteLabel(k) {
    if (k.startsWith("intro/")) { const s = SG.intro.sections.find((x) => x.id === k.slice(6)); return "Before You Begin · " + (s ? s.title : ""); }
    if (k.startsWith("term/")) { const t = SG.glossary[k.slice(5)]; return "Term · " + (t ? t.term : k.slice(5)); }
    const [bc, sec] = k.split("#"); const [b, c] = bc.split("/"); const ch = SG.chapter(b, c);
    if (!ch) return k;
    let s = SG.books[b].title + " · " + ch.title;
    if (sec) { const p = SG.loaded[b] && SG.loaded[b].chapters[c]; const st = p && p.sections.find((x) => x.key === sec); const g = SG.sectionGuide(b, c, sec); s += " · " + (st ? st.title : g ? g.title : "section"); }
    return s;
  }
  function noteRoute(k) {
    if (k.startsWith("intro/")) return route("intro", k.slice(6));

  const KINDS = ["Book text", "Endnote", "Study guide", "Scholar's note", "Glossary", "Questions", "My notes"];
  let searchKind = "";
  function openSearch(q) {
    SG.hideSelTool();
    const m = modal('<div class="searchin">' + ICON.search.replace("<svg", '<svg width="20" height="20"') + '<label class="sr" for="sq">Search</label><input id="sq" type="search" autocomplete="off" placeholder="Search both books, endnotes, guides, glossary, your notes…"></div>', '<div class="chips" id="sk"><button class="chip on" data-k="">All</button>' + KINDS.map((k) => '<button class="chip" data-k="' + esc(k) + '">' + esc(k) + "</button>").join("") + '</div><div id="sr" style="margin-top:8px"></div>', true);
    searchKind = "";
    const inp = $("#sq");
    inp.value = q || "";
    if (!SG.index) SG.index = buildIndex();
    const run = SG.debounce(() => drawResults(inp.value), 120);
    inp.addEventListener("input", run);
    inp.addEventListener("keydown", (e) => {
      const items = $$("#sr .res"); let i = items.findIndex((x) => x.classList.contains("sel"));
